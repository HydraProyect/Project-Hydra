# Stack de producción (etapa puente post-Railway, ver RUNBOOK-DESPLIEGUE-LOCAL.md
# en el repositorio local de negocio, tecnico/): app + PostgreSQL 18 + Caddy como
# reverse proxy con TLS automático (Let's Encrypt). No confundir con el
# docker-compose.yml de la raíz, que es solo el Postgres de desarrollo.
#
# Sin Cloudflare en la cadena a propósito: el compromiso EU-only de
# DATA_OWNERSHIP.md (repositorio de negocio) excluye subencargados fuera del
# EEE, y el Tunnel de Cloudflare habría proxyado todo el tráfico de la app por
# el borde de una empresa estadounidense (SCC + Data Privacy Framework, no
# ilegal pero sí un subencargado nuevo a declarar). Caddy corre en la misma
# máquina/VPS (idealmente ya en el EEE, p. ej. Hetzner Falkenstein) y solo
# necesita el puerto 80/443 abierto — sin cuenta ni servicio de terceros de
# por medio para el proxy en sí. Let's Encrypt (la CA que Caddy usa por
# defecto) no procesa datos personales — solo valida la propiedad del dominio
# para emitir el certificado — y no se considera subencargado en este DPA.
#
# Uso:  cp .env.example .env   (rellenar, incluida DOMINIO)
#       docker compose -f docker-compose.produccion.yml up -d --build
#
# Red "edge" (staging, ver docker-compose.staging.yml): dos procesos Caddy no
# pueden compartir el 80/443 del host, así que el segundo dominio
# (staging.talveg.es) no lleva su propio Caddy — se enruta desde ESTE mismo
# Caddy, que gana un segundo bloque de sitio en Caddyfile. Para que este Caddy
# alcance al contenedor `app` de staging (proyecto Compose distinto), ambos se
# unen a la red "caemanager-edge" de abajo. db/seq se quedan fuera de esa red
# a propósito: solo app y caddy salen a ella, así que el stack de staging
# nunca puede alcanzar el Postgres/Seq de producción por red aunque compartan
# máquina — el aislamiento real sigue siendo el volumen de datos separado.
# ─────────────────────────────────────────────────────────────────────────
# PRERREQUISITO DE ARRANQUE — bootstrap de roles de clúster
#
# Antes del primer `up` contra un clúster NUEVO (o restaurado), hay que
# ejecutar una vez:
#
#     docker compose -f docker-compose.produccion.yml up -d db
#     docker compose -f docker-compose.produccion.yml exec -T db #         psql -U postgres -d postgres -v ON_ERROR_STOP=1 #         < ../../deploy/bootstrap/roles-de-cluster.sql
#
# Los roles son objetos de clúster y ninguna migración los crea: crearlos
# desde la migración de una base ponía a seis migradores a competir y tres
# de seis fallaban con 42704. Si este paso se olvida, la aplicación falla al
# migrar con un 42704 inmediato y claro — no en silencio.
#
# En un clúster ya en marcha los roles ya existen; el guion es idempotente y
# volver a ejecutarlo no cambia nada.
#
# DEUDA CONOCIDA: este es el único de los cinco adaptadores que no está
# automatizado, porque el despliegue del VPS es hoy un comando manual. Es una
# debilidad del sistema de despliegue, no una propiedad deseable.
# ─────────────────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: caemanager-app
    # Techo de memoria del contenedor. Sin el, un desbordamiento dentro de la
    # app no se queda en la app: el contenedor comparte maquina con Postgres,
    # Caddy y Seq, asi que el OOM killer del kernel elige victima por su propio
    # criterio y puede llevarse la BASE DE DATOS en vez del proceso culpable.
    # Con el techo, el peor caso pasa a ser "se reinicia el contenedor de la
    # app" —hay restart: unless-stopped— en lugar de "cae el stack entero".
    #
    # Importa aqui mas que en otros servicios porque es donde corren los
    # parsers sobre contenido que sube el usuario: PDFsharp, los
    # decodificadores de imagen y LibreOffice. Los limites de entrada que ya
    # existen (tope por archivo, presupuesto por lote, maximo de pixeles antes
    # de decodificar) acotan lo previsible; este techo acota lo que no se
    # previo, que es justo lo que hace falta frente a un fallo de parser.
    #
    # .NET lee el limite del cgroup y dimensiona su GC con el, asi que en muchos
    # casos la peticion culpable falla con OutOfMemoryException y el proceso
    # sigue sirviendo, en vez de morir el contenedor entero.
    #
    # EL VALOR ES LA UNICA PARTE NO MEDIDA de este cambio: no se ha comprobado
    # ni la RAM de la maquina ni el consumo real en operacion. 3g deja holgura
    # sobre el peor lote legitimo (60 archivos de 10 MB mas las copias de la
    # conversion) y sigue muy por debajo de los varios GB que costaba un
    # archivo hostil antes de los limites de entrada. Ajustalo con
    # LIMITE_MEMORIA_APP en el .env tras mirar `free -g` y
    # `docker stats caemanager-app` en el servidor.
    mem_limit: ${LIMITE_MEMORIA_APP:-3g}
    restart: unless-stopped
    # ConnectionStrings__CaeManagerDbRuntime (RUNBOOK-RLS.md, repositorio de
    # negocio) NO aparece en el bloque `environment:` de abajo a propósito:
    # es la cadena completa con la contraseña del rol restringido
    # cae_app_runtime, y vive SOLO en el `.env` real de este directorio (que
    # `env_file` inyecta entero al contenedor) para que nunca quede compuesta
    # en este YAML ni visible en `docker compose config`/`docker inspect` —
    # al contrario que CaeManagerDb, cuya contraseña sí se interpola aquí
    # abajo. Auditar si está configurada es auditar el `.env` real de este
    # directorio, no este archivo: `docker compose exec app printenv
    # ConnectionStrings__CaeManagerDbRuntime` en el VPS lo confirma sin
    # exponer el valor en ningún log.
    env_file: .env
    environment:
      ConnectionStrings__CaeManagerDb: "Host=db;Port=5432;Database=caemanager;Username=postgres;Password=${POSTGRES_PASSWORD}"
      AlmacenamientoArchivos__Ruta: /data/documentos
      DataProtection__RutaClaves: /data/dataprotection-keys
    volumes:
      - caemanager-data:/data
    # Sin `ports` publicados: la app solo es alcanzable desde la red interna
    # del compose (Caddy la referencia como "caemanager-app:8080", el
    # container_name — no el nombre de servicio "app", que en la red "edge"
    # compartida con staging sería ambiguo entre los dos stacks), nunca
    # directamente desde fuera de la máquina.
    networks:
      - default
      - edge
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/salud"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  db:
    # SIN mem_limit — hueco declarado, no resuelto aquí (REC-199, § 5 punto
    # 4 del handoff HO-199-01). De los cuatro contenedores de este stack,
    # "app" es hoy el único con techo (REC-198); su valor sale de REC-196,
    # que sigue en stop condition — no se inventa aquí.
    #
    # Misma versión mayor que llevaba producción en Railway (18.4) y que el
    # pg_dump de la imagen de la app (postgresql-client-18 del Dockerfile).
    # Versión exacta + digest (cadena de suministro, auditoría Módulo 10,
    # 2026-08-30): el tag flotante "18" apunta al último parche de la serie
    # sin dejar rastro en el repositorio de CUÁNDO cambió ni con qué CI lo
    # validó — Dependabot (.github/dependabot.yml, ecosistema "docker") es
    # ahora quien propone el siguiente parche, en un PR normal.
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    container_name: caemanager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: caemanager
    # Desde la imagen oficial de postgres:18, el volumen se monta en el
    # directorio PADRE, no en /var/lib/postgresql/data — el propio entrypoint
    # ahora organiza los datos en subcarpetas por versión mayor (compatible
    # con pg_ctlcluster) y rechaza arrancar si el volumen apunta al layout
    # antiguo (docker-library/postgres#1259). Detectado en el primer
    # despliegue real contra un volumen nuevo — no aparecía en Railway porque
    # gestionaba el volumen a su manera.
    volumes:
      - caemanager-postgres-data:/var/lib/postgresql
    # Sin `ports` a propósito: la BD solo es alcanzable desde la red interna
    # del compose, nunca desde fuera de la máquina.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    # SIN mem_limit — mismo hueco declarado que "db" arriba (REC-199/REC-198,
    # valor pendiente de REC-196).
    #
    # Versión exacta + digest, mismo motivo que "db" de arriba.
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: caemanager-caddy
    restart: unless-stopped
    env_file: .env
    ports:
      # Estos dos sí van al exterior: es el único servicio con superficie
      # pública del stack. Requiere que el 80/443 de la máquina/VPS estén
      # abiertos (en Hetzner Cloud, el firewall por defecto ya los permite).
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    depends_on:
      - app

  seq:
    # SIN mem_limit — mismo hueco declarado que "db" arriba (REC-199/REC-198,
    # valor pendiente de REC-196).
    #
    # Logs centralizados (P0-3 de RUNBOOK-HORIZONTE-0.md) — licencia
    # Individual gratuita, autoalojado, sin coste por asiento (Datalust
    # solo cobra por usuarios adicionales, no aplica con un único operador).
    # Versión exacta + digest, mismo motivo que "db" de arriba — el tag
    # "latest" es el peor caso de los tres: ni siquiera fija la serie mayor.
    image: datalust/seq:2026.1.17114@sha256:fa405502a3c57884c88477b78b55ca76c5a3fb1a4d20c6a185c24e750db34056
    container_name: caemanager-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Seq 2026.x se niega a arrancar sin decidir autenticación (falla con
      # "No default admin password was supplied"). Se opta explícitamente por
      # sin autenticación propia porque la frontera de seguridad real es de
      # red, no de aplicación (ver el "Solo loopback" de abajo) — añadir una
      # contraseña de Seq encima solo sumaría un secreto más que gestionar
      # sin reforzar nada que el aislamiento de red no cubra ya.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "True"
    volumes:
      - seq-data:/data
    # Solo loopback a propósito, igual que la BD: sin autenticación propia
    # (ver arriba), este puerto no debe ser alcanzable desde internet bajo
    # ningún concepto. Para verlo desde el navegador local: túnel SSH
    #   ssh -L 5341:localhost:5341 root@<IP-del-VPS>
    # y abrir http://localhost:5341 en tu máquina.
    ports:
      - "127.0.0.1:5341:80"

volumes:
  caemanager-data:
  caemanager-postgres-data:
  caddy-data:
  caddy-config:
  seq-data:

networks:
  # Nombre explícito (no el "local_default" implícito que pondría Compose por
  # defecto) para que docker-compose.staging.yml pueda unirse a ella como red
  # externa por un nombre estable, sin adivinar cómo se llamó este proyecto.
  edge:
    name: caemanager-edge
