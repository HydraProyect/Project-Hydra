# Stack de producción en el VPS (ver Project-Hydra-Negocio/tecnico/RUNBOOK-DESPLIEGUE-LOCAL.md
# en el repositorio local de negocio, tecnico/): app + PostgreSQL 18 + Caddy como
# reverse proxy con TLS automático (Let's Encrypt). No confundir con el
# docker-compose.yml de la raíz, que es solo el Postgres de desarrollo.
#
# Sin Cloudflare en la cadena a propósito: el compromiso EU-only de
# Project-Hydra-Negocio/DATA_OWNERSHIP.md (repositorio de negocio) excluye subencargados fuera del
# EEE, y el Tunnel de Cloudflare habría proxyado todo el tráfico de la app por
# el borde de una empresa estadounidense (SCC + Data Privacy Framework, no
# ilegal pero sí un subencargado nuevo a declarar). Caddy corre en la misma
# máquina/VPS (idealmente ya en el EEE, p. ej. Hetzner Falkenstein) y solo
# necesita el puerto 80/443 abierto — sin cuenta ni servicio de terceros de
# por medio para el proxy en sí. Let's Encrypt (la CA que Caddy usa por
# defecto) no procesa datos personales — solo valida la propiedad del dominio
# para emitir el certificado — y no se considera subencargado en este DPA.
#
# Uso:  cp .env.example .env   (rellenar, incluida DOMINIO)
#       bash deploy/relevo-app.sh desplegar produccion <sha>
# con la imagen caemanager:<sha> ya cargada: la despliega deploy/ci-deploy.sh
# desde el job `imagen` de .github/workflows/deploy.yml (firmada en CI; en el
# VPS no se compila, ver `app-azul` más abajo). Un `up -d` a secas levanta
# db, migrador, caddy y seq, pero ninguna ranura de la app (perfil "ranura").
#
# Red "edge" (staging, ver docker-compose.staging.yml): dos procesos Caddy no
# pueden compartir el 80/443 del host, así que el segundo dominio
# (staging.talveg.es) no lleva su propio Caddy — se enruta desde ESTE mismo
# Caddy, que gana un segundo bloque de sitio en Caddyfile. Para que este Caddy
# alcance al contenedor `app` de staging (proyecto Compose distinto), ambos se
# unen a la red "caemanager-edge" de abajo. db/seq se quedan fuera de esa red
# a propósito: solo app y caddy salen a ella, así que el stack de staging
# nunca puede alcanzar el Postgres/Seq de producción por red aunque compartan
# máquina — el aislamiento real sigue siendo el volumen de datos separado.
# ─────────────────────────────────────────────────────────────────────────
# PRERREQUISITO DE ARRANQUE — bootstrap de roles de clúster
#
# Antes del primer `up` contra un clúster NUEVO (o restaurado), hay que
# ejecutar una vez:
#
#     docker compose -f docker-compose.produccion.yml up -d db
#     docker compose -f docker-compose.produccion.yml exec -T db #         psql -U postgres -d postgres -v ON_ERROR_STOP=1 #         < ../../deploy/bootstrap/roles-de-cluster.sql
#
# Los roles son objetos de clúster y ninguna migración los crea: crearlos
# desde la migración de una base ponía a seis migradores a competir y tres
# de seis fallaban con 42704. Si este paso se olvida, la aplicación falla al
# migrar con un 42704 inmediato y claro — no en silencio.
#
# En un clúster ya en marcha los roles ya existen; el guion es idempotente y
# volver a ejecutarlo no cambia nada.
#
# DEUDA CONOCIDA: este es el único de los cinco adaptadores que no está
# automatizado, porque el despliegue del VPS es hoy un comando manual. Es una
# debilidad del sistema de despliegue, no una propiedad deseable.
# ─────────────────────────────────────────────────────────────────────────

services:
  migrador:
    # Job de migración de vida corta (REC-017/P39). Antes de este cambio, el
    # contenedor "app" —que sirve tráfico de forma permanente— también
    # ejecutaba las migraciones en cada arranque (Migraciones:AlArrancar,
    # Program.cs), con la MISMA imagen y el MISMO ConnectionStrings__CaeManagerDb
    # (el rol propietario "postgres", el único con privilegios de DDL: ver
    # deploy/bootstrap/roles-de-cluster.sql). Eso significa que un proceso que
    # vive indefinidamente —y que además procesa contenido subido por usuarios
    # (parsers PDF/Office)— llevaba esa identidad de esquema cargada en su
    # configuración durante toda su vida, no solo en el instante de migrar.
    #
    # Este servicio aísla esa identidad a un contenedor que solo vive lo que
    # tarda `--migrate-only` (Program.cs, ya existía sin estar conectado a
    # ningún paso del pipeline — este cambio es exactamente esa conexión) y
    # sale con código 0 o no arranca nada más: ver `depends_on` de "app-azul"
    # más abajo, con `condition: service_completed_successfully`. `restart: "no"`
    # a propósito — un job de un solo uso que Compose reiniciara indefinidamente
    # ante un fallo real de migración escondería el error en vez de pararlo.
    #
    # No hay `deploy.replicas` en ningún servicio de este fichero. Las dos
    # ranuras de la app (P1-F2) no cambian eso: el relevo arranca UNA ranura
    # por despliegue, así que sigue habiendo un solo "migrador" por despliegue,
    # serializado por `depends_on`, y los despliegues simultáneos
    # (staging/producción) sobre el mismo /opt/talveg los cierra el flock de
    # deploy/ci-deploy.sh. Lo que sí cambia: este migrador corre MIENTRAS la
    # ranura anterior sigue sirviendo (y la deja drenar hasta 30 min después),
    # así que cada migración tiene que ser compatible con el código de la
    # versión anterior — expand/contract: añadir en una versión, dejar de usar
    # en la siguiente y solo entonces borrar o renombrar. Regla en el runbook
    # de despliegue (repositorio de negocio).
    #
    # P0-2 (plan de madurez 2026-09-24): el comando pasó de `--migrate-only` a
    # `--preparar-arranque` — migra Y siembra (Program.cs), porque dos seeders
    # del arranque (IdentitySeeder y el backfill de asignaciones) necesitan
    # también la identidad del rol propietario. Mientras sembraba "app", ese
    # contenedor seguía recibiendo la credencial del superusuario postgres toda
    # su vida; ahora este es el ÚNICO servicio que la recibe. Los modos
    # administrativos que la necesitan se lanzan también desde aquí:
    #   docker compose -f docker-compose.produccion.yml run --rm migrador --retirar-tenant-demo <TenantId>
    # Imagen construida y firmada en CI, cargada por ci-deploy.sh, que arranca
    # con IMAGEN_TAG=<sha>. Sin `build:` y con `pull_policy: never` a propósito:
    # un `up` manual sin IMAGEN_TAG falla («No such image: caemanager:sin-
    # etiqueta») en vez de compilar en el VPS (incidente del 2026-09-22) o de
    # arrancar una imagen sin firma. Para un `up` manual con la desplegada:
    #   IMAGEN_TAG="$(docker inspect "$(bash /opt/talveg/deploy/relevo-app.sh activa produccion)" --format '{{.Config.Image}}' | cut -d: -f2)"
    image: caemanager:${IMAGEN_TAG:-sin-etiqueta}
    pull_policy: never
    container_name: caemanager-migrador
    restart: "no"
    command: ["--preparar-arranque"]
    env_file: .env
    environment:
      ConnectionStrings__CaeManagerDb: "Host=db;Port=5432;Database=caemanager;Username=postgres;Password=${POSTGRES_PASSWORD}"
      AlmacenamientoArchivos__Ruta: /data/documentos
      DataProtection__RutaClaves: /data/dataprotection-keys
    volumes:
      - caemanager-data:/data
    depends_on:
      db:
        condition: service_healthy

  # La aplicación corre en DOS ranuras, app-azul y app-verde (P1-F2): cada
  # despliegue arranca la versión nueva en la ranura libre, espera a /salud,
  # conmuta Caddy hacia ella y deja drenar la anterior, que conserva sus
  # circuitos Blazor hasta que se vacía o vence el drenaje (deploy/relevo-app.sh,
  # y la cabecera del Caddyfile). Solo se arrancan nombrándolas: el perfil
  # "ranura" impide que un `docker compose up` a secas levante las dos a la vez
  # con la misma imagen. app-verde es app-azul con otro container_name
  # (`extends`), así que la definición vive una sola vez, aquí.
  #
  # Qué ranura sirve: `bash /opt/talveg/deploy/relevo-app.sh activa produccion`.
  app-azul:
    # Imagen construida y firmada en CI, cargada por ci-deploy.sh, que arranca
    # con IMAGEN_TAG=<sha>. Sin `build:` y con `pull_policy: never` a propósito:
    # un `up` manual sin IMAGEN_TAG falla («No such image: caemanager:sin-
    # etiqueta») en vez de compilar en el VPS (incidente del 2026-09-22) o de
    # arrancar una imagen sin firma. Para un `up` manual con la desplegada:
    #   IMAGEN_TAG="$(docker inspect "$(bash /opt/talveg/deploy/relevo-app.sh activa produccion)" --format '{{.Config.Image}}' | cut -d: -f2)"
    image: caemanager:${IMAGEN_TAG:-sin-etiqueta}
    pull_policy: never
    container_name: caemanager-app-azul
    profiles: ["ranura"]
    # Techo de memoria del contenedor. Sin el, un desbordamiento dentro de la
    # app no se queda en la app: el contenedor comparte maquina con Postgres,
    # Caddy y Seq, asi que el OOM killer del kernel elige victima por su propio
    # criterio y puede llevarse la BASE DE DATOS en vez del proceso culpable.
    # Con el techo, el peor caso pasa a ser "se reinicia el contenedor de la
    # app" —hay restart: unless-stopped— en lugar de "cae el stack entero".
    #
    # Importa aqui mas que en otros servicios porque es donde corren los
    # parsers sobre contenido que sube el usuario: PDFsharp, los
    # decodificadores de imagen y LibreOffice. Los limites de entrada que ya
    # existen (tope por archivo, presupuesto por lote, maximo de pixeles antes
    # de decodificar) acotan lo previsible; este techo acota lo que no se
    # previo, que es justo lo que hace falta frente a un fallo de parser.
    #
    # .NET lee el limite del cgroup y dimensiona su GC con el, asi que en muchos
    # casos la peticion culpable falla con OutOfMemoryException y el proceso
    # sigue sirviendo, en vez de morir el contenedor entero.
    #
    # EL VALOR ES LA UNICA PARTE NO MEDIDA de este cambio: no se ha comprobado
    # ni la RAM de la maquina ni el consumo real en operacion. 3g deja holgura
    # sobre el peor lote legitimo (60 archivos de 10 MB mas las copias de la
    # conversion) y sigue muy por debajo de los varios GB que costaba un
    # archivo hostil antes de los limites de entrada. Ajustalo con
    # LIMITE_MEMORIA_APP en el .env tras mirar `free -g` y
    # `docker stats` en el servidor. Durante un drenaje hay DOS contenedores
    # de la app a la vez (el techo es por contenedor, no por las dos).
    mem_limit: ${LIMITE_MEMORIA_APP:-3g}
    restart: unless-stopped
    # REC-017/P39 y P0-2: ni las migraciones ni la siembra las hace este
    # contenedor — las hace el servicio "migrador" de arriba
    # (`--preparar-arranque`), antes de que este arranque (ver su `depends_on`
    # más abajo).
    #
    # SIN CREDENCIAL DEL SUPERUSUARIO (P0-2). `env_file: .env` inyecta el
    # `.env` entero, que contiene POSTGRES_PASSWORD (la usa `db` y compone la
    # cadena del "migrador"); por eso `environment:` la vacía expresamente
    # —`environment` gana a `env_file`— y hace lo mismo con
    # ConnectionStrings__CaeManagerDb, por si el `.env` real la trae compuesta
    # y para tapar el valor de desarrollo de appsettings.json. /salud usa la
    # conexión del tráfico (Program.cs, ResolverCadenaDeTrafico). Contrato
    # vigilado por deploy/ci-deploy-secretos.tests.sh (caso 19).
    #
    # ConnectionStrings__CaeManagerDbRuntime (Project-Hydra-Negocio/tecnico/RUNBOOK-RLS.md, repositorio de
    # negocio) NO aparece en el bloque `environment:` de abajo a propósito:
    # es la cadena completa con la contraseña del rol restringido
    # cae_app_runtime, y vive SOLO en el `.env` real de este directorio (que
    # `env_file` inyecta entero al contenedor) para que nunca quede compuesta
    # en este YAML ni visible en `docker compose config`/`docker inspect` —
    # al contrario que CaeManagerDb, cuya contraseña sí se interpola aquí
    # abajo. Auditar si está configurada es auditar el `.env` real de este
    # directorio, no este archivo: `docker exec <ranura activa> printenv
    # ConnectionStrings__CaeManagerDbRuntime` en el VPS lo confirma sin
    # exponer el valor en ningún log.
    env_file: .env
    environment:
      # P0-2 — ver el comentario de más arriba, junto a `restart:`.
      POSTGRES_PASSWORD: ""
      ConnectionStrings__CaeManagerDb: ""
      AlmacenamientoArchivos__Ruta: /data/documentos
      DataProtection__RutaClaves: /data/dataprotection-keys
      # REC-017/P39 y P0-2 — ver el comentario de más arriba, junto a `restart:`.
      Migraciones__AlArrancar: "false"
      Siembra__AlArrancar: "false"
    volumes:
      - caemanager-data:/data
      # P44b — certificado de cliente del conector de Microsoft 365 (PEM). Fuera del
      # checkout y de los volúmenes con nombre; solo lectura. Si el directorio no
      # existe, Docker lo crea vacío y no tiene efecto mientras no se configuren
      # CertificadoRuta y ClavePrivadaRuta. Guía:
      # Project-Hydra-Negocio/tecnico/ACCIONES-PROPIETARIO-SECRETOS-CI-2026-09-19.md
      #
      # PROPIEDAD Y PERMISOS DEL PEM: el contenedor arranca como root, pero el
      # entrypoint baja a APP_UID:APP_UID (1654:1654, medido en la imagen aspnet
      # fijada en el Dockerfile) con gosu antes de ejecutar la app, y solo hace
      # `chown -R` de /data, nunca de /run/secretos (que además va :ro). Un PEM
      # creado con el reflejo natural para una clave privada (root:root, 600) es
      # ILEGIBLE para la app: el arranque lo avisa con un WARN que nombra la opción
      # (CertificadoRuta o ClavePrivadaRuta) y, si no se corrige, cada canje o
      # renovación de tokens falla con CertificadoNoLegible en el log; el correo
      # deja de entrar y las suscripciones de Graph caducan. En el host:
      # `chown root:1654` y `chmod 640` en la clave privada (el certificado,
      # público, puede ir 644) y `chmod 750` en el directorio; comprobar con
      # `docker exec "$(bash /opt/talveg/deploy/relevo-app.sh activa produccion)" ls -ln /run/secretos`.
      - "${SECRETOS_DIR:-/opt/talveg-secretos/produccion}:/run/secretos:ro"
    # Sin `ports` publicados: la app solo es alcanzable desde la red interna
    # del compose (Caddy la referencia por container_name,
    # "caemanager-app-azul:8080" o "-verde" — no por el nombre de servicio,
    # que en la red "edge" compartida con staging sería ambiguo entre los dos
    # stacks), nunca directamente desde fuera de la máquina.
    networks:
      - default
      - edge
    depends_on:
      db:
        condition: service_healthy
      # REC-017/P39: el esquema tiene que estar migrado ANTES de que arranque
      # el servidor — `service_completed_successfully` bloquea el `up` de este
      # servicio hasta que "migrador" termine con código 0, y lo falla si
      # "migrador" sale con error (ver el comentario largo junto a ese
      # servicio, arriba).
      migrador:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/salud"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      # Sin `start_interval` (acortaría la espera del relevo a healthy, que con
      # interval 30s llega como pronto a los 30 s) a propósito: exige Docker
      # Engine >= 25 y la versión del VPS no está medida; con uno anterior el
      # `up` fallaría. La espera no corta a nadie: la ranura anterior sirve.

  app-verde:
    extends:
      service: app-azul
    container_name: caemanager-app-verde
    # Repetidos a propósito: que `extends` herede `profiles` y `depends_on`
    # depende de la versión de Compose (las antiguas no heredaban depends_on),
    # y sin ellos la verde arrancaría con un `up` a secas o sin esperar al
    # migrador. La del VPS no está medida.
    profiles: ["ranura"]
    depends_on:
      db:
        condition: service_healthy
      migrador:
        condition: service_completed_successfully

  db:
    # SIN mem_limit — hueco declarado, no resuelto aquí (REC-199, § 5 punto
    # 4 del handoff HO-199-01). De los cuatro contenedores de este stack,
    # "app" es hoy el único con techo (REC-198); su valor sale de REC-196,
    # que sigue en stop condition — no se inventa aquí.
    #
    # Versión mayor 18, la de producción desde antes del VPS. Las copias
    # (scripts/backup-borg.sh) ejecutan pg_dump dentro de este contenedor,
    # así que el cliente siempre coincide con el servidor.
    # Versión exacta + digest (cadena de suministro, auditoría Módulo 10,
    # 2026-08-30): el tag flotante "18" apunta al último parche de la serie
    # sin dejar rastro en el repositorio de CUÁNDO cambió ni con qué CI lo
    # validó — Dependabot (.github/dependabot.yml, ecosistema "docker") es
    # ahora quien propone el siguiente parche, en un PR normal.
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    container_name: caemanager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: caemanager
    # Desde la imagen oficial de postgres:18, el volumen se monta en el
    # directorio PADRE, no en /var/lib/postgresql/data — el propio entrypoint
    # ahora organiza los datos en subcarpetas por versión mayor (compatible
    # con pg_ctlcluster) y rechaza arrancar si el volumen apunta al layout
    # antiguo (docker-library/postgres#1259). Detectado en el primer
    # despliegue real contra un volumen nuevo — no aparecía en el hosting
    # anterior porque gestionaba el volumen a su manera.
    volumes:
      - caemanager-postgres-data:/var/lib/postgresql
    # Sin `ports` a propósito: la BD solo es alcanzable desde la red interna
    # del compose, nunca desde fuera de la máquina.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    # SIN mem_limit — mismo hueco declarado que "db" arriba (REC-199/REC-198,
    # valor pendiente de REC-196).
    #
    # Versión exacta + digest, mismo motivo que "db" de arriba.
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: caemanager-caddy
    restart: unless-stopped
    # Solo las dos variables que el Caddyfile interpola ({$DOMINIO}, {$ACME_EMAIL}).
    # Antes este servicio —el único con puertos publicados al exterior— cargaba el
    # `.env` ENTERO (`env_file: .env`) y recibía la contraseña de PostgreSQL, la
    # cadena de conexión de runtime, la clave de Anthropic, la contraseña SMTP, el
    # secreto de cliente de Microsoft 365, las claves de Stripe... sin usar ninguna
    # (hallazgo de la revisión de Codex de P18b). Compose interpola `${VAR}` desde
    # el mismo `.env` del directorio de proyecto, como ya hace `db` con
    # `${POSTGRES_PASSWORD}`. Contrato vigilado por
    # deploy/ci-deploy-secretos.tests.sh (caso 17).
    environment:
      DOMINIO: ${DOMINIO}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      # Estos dos sí van al exterior: es el único servicio con superficie
      # pública del stack. Requiere que el 80/443 de la máquina/VPS estén
      # abiertos (en Hetzner Cloud, el firewall por defecto ya los permite).
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Ranura activa (y saliente, durante un drenaje) de cada entorno: un
      # fichero por entorno que escribe deploy/relevo-app.sh fuera del checkout.
      # Directorio, no fichero: un bind de fichero suelto sigue viendo el inodo
      # viejo cuando el fichero se reemplaza. Por lo mismo, relevo-app.sh recarga
      # Caddy pasándole el Caddyfile del checkout por stdin. Escribible: ver
      # `command` abajo.
      - /var/lib/talveg/caddy-ranuras:/etc/caddy/ranuras
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    # Sin depends_on de la app: las ranuras van por perfil y Caddy resuelve el
    # upstream en cada petición; con la app caída responde 502 como antes.
    #
    # El Caddyfile importa un fichero de ranuras por entorno y no carga si
    # falta alguno. Antes de arrancar se crea el que falte apuntando al
    # contenedor único anterior a P1-F2. Hace falta para la transición: el
    # primer despliegue tras P1-F2 lo ejecuta el ci-deploy.sh ANTERIOR (ver su
    # cabecera, «un cambio a ESTE fichero tarda un despliegue»), que hace un
    # `up` de estos servicios con este compose sin pasar por relevo-app.sh;
    # sin estos ficheros, ese `up` recrea Caddy con el montaje vacío y Caddy no
    # arranca. Con ellos sigue sirviendo el contenedor anterior hasta que el
    # siguiente despliegue haga el primer relevo. Después, relevo-app.sh los
    # mantiene y esta línea no hace nada.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        [ -f /etc/caddy/ranuras/produccion.caddy ] || echo 'to caemanager-app:8080' > /etc/caddy/ranuras/produccion.caddy;
        [ -f /etc/caddy/ranuras/staging.caddy ] || echo 'to caemanager-staging-app:8080' > /etc/caddy/ranuras/staging.caddy;
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

  seq:
    # SIN mem_limit — mismo hueco declarado que "db" arriba (REC-199/REC-198,
    # valor pendiente de REC-196).
    #
    # Logs centralizados (P0-3 de Project-Hydra-Negocio/tecnico/RUNBOOK-HORIZONTE-0.md) — licencia
    # Individual gratuita, autoalojado, sin coste por asiento (Datalust
    # solo cobra por usuarios adicionales, no aplica con un único operador).
    # Versión exacta + digest, mismo motivo que "db" de arriba — el tag
    # "latest" es el peor caso de los tres: ni siquiera fija la serie mayor.
    image: datalust/seq:2026.1.17114@sha256:fa405502a3c57884c88477b78b55ca76c5a3fb1a4d20c6a185c24e750db34056
    container_name: caemanager-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Seq 2026.x se niega a arrancar sin decidir autenticación (falla con
      # "No default admin password was supplied"). Se opta explícitamente por
      # sin autenticación propia porque la frontera de seguridad real es de
      # red, no de aplicación (ver el "Solo loopback" de abajo) — añadir una
      # contraseña de Seq encima solo sumaría un secreto más que gestionar
      # sin reforzar nada que el aislamiento de red no cubra ya.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "True"
    volumes:
      - seq-data:/data
    # Solo loopback a propósito, igual que la BD: sin autenticación propia
    # (ver arriba), este puerto no debe ser alcanzable desde internet bajo
    # ningún concepto. Para verlo desde el navegador local: túnel SSH
    #   ssh -L 5341:localhost:5341 root@<IP-del-VPS>
    # y abrir http://localhost:5341 en tu máquina.
    ports:
      - "127.0.0.1:5341:80"

volumes:
  caemanager-data:
  caemanager-postgres-data:
  caddy-data:
