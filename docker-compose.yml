# Solo PostgreSQL — la app se ejecuta con `dotnet run`/el IDE, no en
# contenedor, para no perder hot-reload ni depuración en el día a día. Ver
# Dockerfile para la imagen de despliegue real (Railway).
#
# Misma versión que el job de CI (`.github/workflows/ci.yml`) — un test que
# pasa en local debe pasar en CI y viceversa. Producción corre Postgres 18.4
# (Railway); el desfase con CI/local ya está anotado en el Dockerfile.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: caemanager
    ports:
      - "5432:5432"
    volumes:
      - caemanager-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caemanager-postgres-data:
