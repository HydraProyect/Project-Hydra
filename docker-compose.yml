# Solo PostgreSQL — la app se ejecuta con `dotnet run`/el IDE, no en
# contenedor, para no perder hot-reload ni depuración en el día a día. Ver
# Dockerfile para la imagen de despliegue real (VPS, deploy/local/).
#
# Misma etiqueta y digest que producción (servicio db de
# deploy/local/docker-compose.produccion.yml) y que los servicios de
# `.github/workflows/ci.yml` (P1-C1): un test que pasa en local debe pasar en
# CI, y los dos deben describir el motor de producción. Lo vigila
# MismaVersionDePostgresTests (Architecture).
services:
  postgres:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: caemanager
    ports:
      - "5432:5432"
    volumes:
      # Desde la imagen oficial de postgres:18 el volumen va en el directorio
      # PADRE (docker-library/postgres#1259), igual que en producción. Volumen
      # con nombre nuevo: el de la 17 no es legible por la 18 sin pg_upgrade,
      # y los datos de desarrollo son desechables.
      - caemanager-postgres18-data:/var/lib/postgresql
      # Bootstrap de roles de clúster. La especificación normativa está en ese
      # fichero y aquí solo se monta: initdb.d lo ejecuta al INICIALIZAR el
      # directorio de datos.
      #
      # OJO con el límite: si tu volumen ya existe, este hook NO vuelve a
      # correr. Para un clúster de desarrollo ya creado hay que ejecutarlo a
      # mano una vez:
      #
      #   docker compose exec -T postgres psql -U postgres -d postgres \
      #       -v ON_ERROR_STOP=1 < deploy/bootstrap/roles-de-cluster.sql
      #
      # Sin los roles, la primera migración falla con 42704 — de forma
      # inmediata y clara, que es la mitad buena del cambio.
      - ./deploy/bootstrap/roles-de-cluster.sql:/docker-entrypoint-initdb.d/10-roles-de-cluster.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caemanager-postgres18-data:
