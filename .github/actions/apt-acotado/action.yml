name: Apt acotado
description: >
  Ejecuta un comando que usa apt con tiempo limitado, reintentos y sin depender
  del espejo de Azure ni de *.ubuntu.com cuando no responden.

# Por qué existe: la imagen ubuntu-24.04 de GitHub declara sus fuentes como
# `mirror+file:/etc/apt/apt-mirrors.txt`, con azure.archive.ubuntu.com delante.
# Cuando el runner no alcanza ese espejo, `apt-get update` pasa a
# archive.ubuntu.com, descarga los InRelease y se queda parado sin escribir
# nada ni terminar. El 2026-10-31 eso colgó seis jobs, siempre en la misma
# línea del log, y dejó sin respuesta la cola de fusión (#1929, #1932).
# Reproducido bloqueando ese espejo con iptables en un runner: `apt-get update`
# seguía parado a los 300 s; con archive.ubuntu.com directo, instalar tardó 28 s.
#
# Desde el 2026-11-11 hay runners que no resuelven ningún nombre de ubuntu.com
# («Temporary failure resolving 'archive.ubuntu.com'») y sí NuGet y npm: pasar a
# archive.ubuntu.com ya no basta. Si Azure no responde, elegir-espejo.sh sondea
# archive.ubuntu.com y, detrás, espejos oficiales de Ubuntu fuera de ubuntu.com,
# y todas las fuentes de Ubuntu (incluido el pocket de security) pasan al primero
# que responda. Solo cambia la URL: cada estrofa conserva su Signed-By y apt sigue
# verificando la firma de cada InRelease con las claves de Ubuntu de la imagen.
# Nunca trusted=yes ni verificación desactivada: AptAcotadoEnCiTests lo vigila.
#
# Cada comando con apt del CI pasa por aquí: AptAcotadoEnCiTests lo exige. Los
# que llaman a apt por dentro (`playwright install --with-deps`) heredan las
# fuentes ya reescritas, porque el comando corre después de elegir el archivo.
# El sondeo evita el cuelgue conocido; el límite por intento cubre el resto.

inputs:
  comando:
    description: Comando de bash que usa apt, con sudo si lo necesita.
    required: true
  limite-segundos:
    description: Tiempo máximo de cada uno de los tres intentos.
    required: false
    default: "360"

runs:
  using: composite
  steps:
    - name: Ejecutar con apt acotado
      shell: bash
      env:
        COMANDO: ${{ inputs.comando }}
        LIMITE: ${{ inputs.limite-segundos }}
      run: |
        # Sin -e, que `shell: bash` activa: un fallo al preparar o limpiar no
        # debe abortar el paso, porque quitaría los reintentos que quedan.
        set +e -uo pipefail

        fuentes=/etc/apt/sources.list.d/ubuntu.sources
        . /etc/os-release
        sonda="http://azure.archive.ubuntu.com/ubuntu/dists/${VERSION_CODENAME}/InRelease"

        # Sin esto, apt espera 120 s por conexión y el cerrojo de dpkg de un
        # intento anterior haría fallar el siguiente en vez de esperar.
        #
        # Acquire::Retries es siempre 0 (hasta #2168 valía 1; el Dockerfile ya
        # usaba 0). El CVE-2026-109518 (ver el Dockerfile) deja colar un paquete
        # no verificado en un reintento de descarga, y eso lo aprovecha tanto un
        # espejo de terceros como un atacante en la ruta de cualquier fuente HTTP,
        # Azure y security.ubuntu.com incluidos. Decidir 0 o 1 leyendo las fuentes
        # admitía HTTP y no veía todas las fuentes de apt; con 0 fijo no hay nada
        # que decidir. Los tres intentos de abajo, cada uno con su sondeo, ya
        # cubren los fallos de red. APT::Acquire::Retries también va a 0 por si
        # otro fichero de la imagen lo fija, y lo que se comprueba es el valor que
        # apt lee de verdad (apt-config), no solo el contenido de este fichero.
        escribir_conf_apt() {
          printf '%s\n' \
            'Acquire::Retries "0";' \
            'APT::Acquire::Retries "0";' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            'DPkg::Lock::Timeout "60";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-apt-acotado > /dev/null \
            && [ "$(apt-config shell R Acquire::Retries A APT::Acquire::Retries)" = "R='0'"$'\n'"A='0'" ]
        }
        # Sin errexit, cada preparación se comprueba a mano y falla cerrada: apt
        # nunca corre sin esta configuración ni con unas fuentes a medio reescribir.
        escribir_conf_apt || { echo "::error::No se pudo escribir la configuración de apt."; exit 1; }

        # Apunta cada URI de Ubuntu de las fuentes deb822 (el mirror+file de
        # Azure, archive, security o un espejo elegido antes, todos acabados en
        # /ubuntu) a una sola base. No toca Signed-By ni añade opciones.
        apuntar_fuentes_a() {
          local firmas
          firmas="$(grep -c '^Signed-By:' "$fuentes")"
          sudo sed -E -i "/^URIs:/ s#[^[:space:]]+(apt-mirrors\.txt|/ubuntu/?)([[:space:]]|\$)#${1}\2#g" "$fuentes" || return 1
          grep '^URIs:' "$fuentes" || return 1
          # Cada URIs: es exactamente la base elegida y no se pierde ningún Signed-By.
          ! grep '^URIs:' "$fuentes" | grep -vqxF "URIs: $1" || return 1
          [ "$(grep -c '^Signed-By:' "$fuentes")" = "$firmas" ] || return 1
        }

        # Fuera de Azure: archive.ubuntu.com o, si tampoco responde, el primer
        # espejo oficial de reserva que responda (elegir-espejo.sh).
        usar_archivo_directo() {
          local base
          if base="$(bash "$GITHUB_ACTION_PATH/elegir-espejo.sh" "$VERSION_CODENAME")"; then
            case "$base" in
              https://archive.ubuntu.com/*)
                echo "::warning::apt usará archive.ubuntu.com directamente." ;;
              *)
                echo "::warning::Ni Azure ni archive.ubuntu.com responden: apt usará el espejo de reserva ${base}" ;;
            esac
          else
            base=https://archive.ubuntu.com/ubuntu/
            echo "::warning::Ningún archivo de Ubuntu responde a la sonda: apt probará archive.ubuntu.com igualmente."
          fi
          apuntar_fuentes_a "$base" || return 1
        }
        preparar_o_fallar() {
          usar_archivo_directo && return 0
          echo "::error::No se pudieron preparar la configuración o las fuentes de apt: no se ejecuta apt."
          exit 1
        }

        # `timeout` corre como runner y no puede matar a los procesos de root
        # que deja `sudo apt-get`: siguen vivos y con el cerrojo tomado.
        limpiar_apt() {
          sudo pkill -9 -x apt-get
          sudo pkill -9 -f '^/usr/lib/apt/methods/'
          sudo pkill -9 -x dpkg
          sudo timeout -k 5 120 dpkg --configure -a
        }

        # Solo vale un 200 final del propio espejo con la descarga completa: sin -L
        # curl no sigue un 3xx, y con -f lo daría por bueno sin haber alcanzado el
        # InRelease. El código de salida de curl también cuenta: un 200 que se corta
        # o se cuelga a mitad del cuerpo no es una respuesta.
        responde_200() {
          local codigo
          codigo="$(curl -sS --max-time 10 --max-redirs 0 -o /dev/null -w '%{http_code}' "$1")" || return 1
          [ "$codigo" = "200" ]
        }

        if ! responde_200 "$sonda"; then
          echo "::warning::El espejo de Azure no responde: apt sale de Azure."
          preparar_o_fallar
        fi

        for intento in 1 2 3; do
          timeout -k 15 "$LIMITE" bash -euo pipefail -c "$COMANDO" && exit 0
          codigo=$?
          echo "::warning::Intento $intento de 3 terminó con código $codigo (124 o 137: superó ${LIMITE} s)."
          limpiar_apt
          [ "$intento" -lt 3 ] && preparar_o_fallar
          [ "$intento" -lt 3 ] && sleep $((intento * 10))
        done

        echo "::error::El comando con apt no terminó bien en tres intentos."
        exit 1
