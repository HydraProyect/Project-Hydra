# P2 #25 de Project-Hydra-Negocio/MATURITY_REVIEW.md — dependencias desactualizadas
# (paquetes NuGet, la imagen base del Dockerfile, las Actions del propio CI)
# hoy solo se detectan a mano. Cada ecosistema abre sus PRs por separado, sin
# agruparlos: en un repo con -warnaserror y tests de integración reales, cada
# actualización merece pasar su propio CI antes de fiarse de ella, no
# mezclarse con otras diez en un solo PR difícil de diagnosticar si algo
# rompe.
#
# Metadatos de PR: el check "Gobernanza — metadatos de PR"
# (.github/workflows/gobernanza-pr.yml) exige a TODA PR, dependabot[bot]
# incluido, un milestone y una etiqueta "Type: *" y otra "Priority: *",
# leídos por API al evaluar. dependabot[bot] solo está exento de la sección
# "## Revisión Codex" (scripts/verificar-gobernanza-pr.sh), no de esto. Sin
# `labels`/`milestone` aquí, cada PR de Dependabot nacía en rojo y había que
# etiquetarla a mano. Declarar `labels` SUSTITUYE las etiquetas por defecto
# de Dependabot, por eso se repiten "dependencies" y la del ecosistema
# (".NET", "docker", "github_actions"), que son las que ya llevaban. El
# milestone se da por número (12 = "Mantenimiento de dependencias
# (Dependabot)"), que es lo que admite Dependabot; si se cierra o se
# renumera, las PR vuelven a nacer sin milestone.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - ".NET"
      - "Type: Enhancement"
      - "Priority: Low"
    milestone: 12 # "Mantenimiento de dependencias (Dependabot)"
    ignore:
      # FluentAssertions 8.x exige licencia comercial de pago (Xceed) desde
      # 2026-01; nos quedamos fijados en la rama 7.x (Apache 2.0, bugfixes
      # indefinidos). No proponer el salto de mayor de versión.
      - dependency-name: "FluentAssertions"
        versions: [">=8.0.0"]
      # MediatR 13.x cambia de Apache 2.0 a licencia dual (Lucky Penny
      # Software): RPL-1.5 —copyleft recíproco que obligaría a publicar el
      # fuente del producto— o suscripción de pago. 12.5.0 sigue siendo
      # Apache 2.0 y lo será siempre: el cambio NO es retroactivo. No
      # proponer el salto de mayor de versión.
      - dependency-name: "MediatR"
        versions: [">=13.0.0"]
      # Microsoft.OpenApi 3.x NO es instalable en este arbol: el propio
      # Microsoft.AspNetCore.OpenApi 10.0.11 exige (>= 2.7.5 && < 3.0.0), asi
      # que dependabot proponia algo que viola la restriccion de una dependencia
      # de primera parte (NU1608). Ademas rompe el codigo — IOpenApiMediaType.Example
      # pasa a ser de solo lectura (CS0200) — pero eso es lo secundario.
      # RETIRAR esta regla cuando Microsoft.AspNetCore.OpenApi admita 3.x: si no,
      # el bloqueo sobrevive al motivo que lo justificaba.
      - dependency-name: "Microsoft.OpenApi"
        versions: [">=3.0.0"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
      - "Type: Enhancement"
      - "Priority: Low"
    milestone: 12 # "Mantenimiento de dependencias (Dependabot)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github_actions"
      - "Type: Enhancement"
      - "Priority: Low"
    milestone: 12 # "Mantenimiento de dependencias (Dependabot)"
