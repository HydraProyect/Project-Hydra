name: CI

on:
  # Las ramas de trabajo (`claude/**`) quedan fuera a propósito: cuando tienen un PR
  # abierto, el disparador `pull_request` de abajo ya verifica exactamente el mismo
  # commit. Tenerlas aquí duplicaba cada verificación — dos runs completos (~27 min
  # facturables cada uno) para el mismo código, y el doble de espera por PR.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # La cola de merge construye cada PR sobre una referencia temporal
  # (`gh-readonly-queue/main/...`) que incluye los que van delante, y espera ahí
  # los mismos checks obligatorios. Sin este disparador esos checks no se
  # ejecutan nunca y la cola se queda colgada en silencio — no falla, espera.
  merge_group:

# Cancela ejecuciones anteriores del mismo PR/rama cuando llega un push nuevo
# — evita gastar minutos de CI en un estado ya obsoleto. La cola de merge queda
# fuera a propósito: cada entrada tiene su propia referencia, y cancelar una
# construcción de la cola la retiraría de la fila.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # SUELO del reparto de tests de integracion (scripts/repartir-clases-de-test.sh).
  #
  # La comprobacion "el reparto cubrio todas las clases" compara dos numeros que
  # salen de la MISMA deteccion: eso la protege de que los bloques deriven entre
  # si, pero no de que la deteccion entera se rompa. Si `--list-tests` devolviera
  # 3 clases en vez de 145, los dos lados dirian 3, coincidirian, y 142 clases no
  # se ejecutarian en ningun bloque con el gate en verde. La igualdad no distingue
  # "coinciden porque esta bien" de "coinciden porque los dos estan vacios".
  #
  # 145 clases el 2026-08-29; suelo en 120, con holgura para que no salte al
  # crecer o menguar de forma normal. Es un ratchet: se sube cuando el numero real
  # crezca de forma sostenida, nunca se baja para que pase un PR concreto.
  MINIMO_CLASES: "120"

jobs:
  # Los tests de integración eran el camino crítico del CI: medido el
  # 2026-08-29, 1138 s de los 1354 s que duraba "Build, format y tests" —el
  # 84%— y el job más largo del workflow con diferencia, así que marcaba el
  # ritmo de toda la cola de merge. Aquí se reparten en cuatro bloques que
  # corren a la vez.
  #
  # El reparto se CALCULA, no se escribe: cada bloque lista las clases de
  # test, las ordena y se queda con las que le tocan por posición. Una clase
  # nueva cae en un bloque sola, sin que nadie mantenga una lista que se
  # desincronice.
  #
  # Los minutos de Actions son gratis en un repositorio público, así que
  # comprar tiempo de reloj con paralelismo aquí no cuesta dinero — al revés
  # que apilar PRs, que sí multiplica ejecuciones completas (§ 22).
  tests-integracion:
    name: Tests de integración (bloque ${{ matrix.bloque }} de 4)
    runs-on: ubuntu-latest
    strategy:
      # Un bloque que falla no cancela a los demás: de una ejecución interesa
      # ver TODOS los fallos, no solo el primero que aparezca.
      fail-fast: false
      matrix:
        bloque: [1, 2, 3, 4]
    # Cada bloque levanta su propio PostgreSQL: son procesos distintos en
    # máquinas distintas, así que no comparten clúster y no pueden pisarse.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Solo lo necesita CaeManager.IntegrationTests, en
      # Conversion/LibreOfficeConversorWordPdfServiceTests. Por eso se instala
      # aquí y ya no en el job de build, que se ahorra los ~25 s.
      - name: Instalar LibreOffice (Entorno de conversión)
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer

      - name: Restaurar dependencias
        run: dotnet restore CaeManager.slnx

      - name: Compilar los tests de integración
        run: dotnet build tests/CaeManager.IntegrationTests --no-restore -warnaserror

      # BOOTSTRAP DE CLÚSTER — prerrequisito de cualquier MigrateAsync.
      #
      # Los roles son objetos de clúster (pg_authid es catálogo compartido) y
      # ninguna migración los crea: crearlos desde la migración de una base
      # ponía a seis migradores a competir y tres de seis fallaban con 42704.
      # deploy/bootstrap/roles-de-cluster.sql es la especificación normativa y
      # este paso es su adaptador de CI; el guion trae dentro su propia
      # verificación post-bootstrap.
      #
      # ON_ERROR_STOP=1: sin esto psql seguiría adelante tras un error y el
      # bloque arrancaría contra un clúster fuera de contrato.
      - name: Bootstrap de roles de clúster
        env:
          PGPASSWORD: postgres
        run: >
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f deploy/bootstrap/roles-de-cluster.sql

      # El reparto vive en scripts/repartir-clases-de-test.sh, no aqui: asi
      # tiene sus propios tests (repartir-clases-de-test.tests.sh) y no hay
      # que escapar una expresion regular dentro de YAML dentro de shell.
      #
      # Ese guion falla si el bloque quedase vacio, en vez de dejar correr un
      # `dotnet test` con un filtro que no casa con nada — que termina en
      # VERDE sin ejecutar un solo test.
      - name: Repartir las clases de test en este bloque
        id: reparto
        run: |
          filtro=$(bash scripts/repartir-clases-de-test.sh tests/CaeManager.IntegrationTests 4 ${{ matrix.bloque }})
          echo "filtro=$filtro" >> "$GITHUB_OUTPUT"
          mkdir -p reparto
          REPARTO_SALIDA=reparto/bloque-${{ matrix.bloque }}.txt bash scripts/repartir-clases-de-test.sh tests/CaeManager.IntegrationTests 4 ${{ matrix.bloque }} > /dev/null

      - name: Ejecutar el bloque
        run: >
          dotnet test tests/CaeManager.IntegrationTests --no-build --logger "console;verbosity=normal"
          --logger "trx;LogFileName=bloque-${{ matrix.bloque }}.trx"
          --filter "${{ steps.reparto.outputs.filtro }}"
          --collect "XPlat Code Coverage" --results-directory ./coverage/integration

      # El paso de reparto garantiza que el FILTRO no este vacio, pero no que
      # el filtro haya CASADO con algo: `dotnet test` con un patron que no
      # encuentra tests termina en 0, sin fallar. Con cuatro bloques hay cuatro
      # sitios donde un bloque mudo se leeria como un bloque que pasa, y la
      # suma seguiria pareciendo verde.
      #
      # Se cuenta sobre el .trx, que es el recuento que produjo la propia
      # ejecucion, en vez de fiarse del codigo de salida.
      - name: Comprobar que el bloque ejecuto tests de verdad
        run: |
          trx=$(find coverage/integration -name "bloque-*.trx" | head -1)
          if [ -z "$trx" ]; then
            echo "::error::No se genero ningun .trx: no hay prueba de que este bloque ejecutara nada."
            exit 1
          fi
          ejecutados=$(grep -o "total=\"[0-9]*\"" "$trx" | head -1 | grep -o "[0-9]*")
          echo "Tests ejecutados en el bloque ${{ matrix.bloque }}: ${ejecutados:-0}"
          if [ "${ejecutados:-0}" -eq 0 ]; then
            echo "::error::El bloque ${{ matrix.bloque }} no ejecuto ningun test. El filtro no caso con nada y dotnet test habria salido en verde."
            exit 1
          fi

      # El ratchet de cobertura se aplica en "Build, format y tests", que es
      # el check obligatorio de la protección de rama. Necesita la cobertura
      # de los CUATRO bloques: sin esto mediría solo Domain y Application y
      # caería muy por debajo del umbral, que es justo lo que un gate no debe
      # hacer — cambiar de significado sin que nadie lo decida.
      - name: Publicar la cobertura del bloque
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-integracion-${{ matrix.bloque }}
          path: coverage/integration
          retention-days: 1

      # La lista de clases que ESTE bloque dijo suyas. "Build, format y tests"
      # junta las cuatro y comprueba que suman la suite entera: sin eso, una
      # clase podria caerse del reparto y no ejecutarse en NINGUN bloque, con
      # los cuatro en verde y nadie mirando. Es una perdida parcial y muda,
      # peor que un bloque entero vacio porque no se nota.
      - name: Publicar el reparto del bloque
        uses: actions/upload-artifact@v4
        with:
          name: reparto-bloque-${{ matrix.bloque }}
          path: reparto
          retention-days: 1

  build-and-test:
    name: Build, format y tests
    runs-on: ubuntu-latest
    # Espera a los bloques de integración porque el ratchet de cobertura de
    # más abajo se calcula sobre Domain + Application + Integration, y este
    # job es el que la protección de rama exige por nombre. Ya no necesita
    # PostgreSQL ni LibreOffice: los únicos tests que los usaban se fueron a
    # `tests-integracion`.
    needs: tests-integracion
    steps:
      - uses: actions/checkout@v7

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore CaeManager.slnx

      # reportgenerator (para el informe de cobertura de abajo) — mismo
      # manifiesto que dotnet-ef, ver .config/dotnet-tools.json.
      - name: Restaurar herramientas locales
        run: dotnet tool restore

      # -warnaserror: ningún warning nuevo pasa desapercibido — coherente con
      # el nivel de rigor que ya pide CODING_STANDARDS.md, ahora ejecutable.
      - name: Compilar (warnings como errores)
        run: dotnet build CaeManager.slnx --no-restore -warnaserror

      - name: Verificar formato (dotnet format)
        run: dotnet format CaeManager.slnx --no-restore --verify-no-changes

      - name: Tests de Domain
        run: >
          dotnet test tests/CaeManager.Domain.Tests --no-restore --logger "console;verbosity=normal"
          --collect "XPlat Code Coverage" --results-directory ./coverage/domain

      - name: Tests de Application
        run: >
          dotnet test tests/CaeManager.Application.Tests --no-restore --logger "console;verbosity=normal"
          --collect "XPlat Code Coverage" --results-directory ./coverage/application

      - name: Tests de arquitectura
        run: dotnet test tests/CaeManager.Architecture.Tests --no-restore --logger "console;verbosity=normal"

      - name: Recoger el reparto de los bloques
        uses: actions/download-artifact@v4
        with:
          pattern: reparto-bloque-*
          path: reparto
          merge-multiple: true

      # EL REPARTO CUBRIO LA SUITE ENTERA.
      #
      # Que cada bloque ejecutara algo no implica que entre los cuatro las
      # ejecutaran TODAS: cuatro bloques con recuento no nulo pueden dejarse una
      # clase fuera, y esa clase no falla porque no corre. Perdida parcial, en
      # verde y sin ruido — peor que un bloque mudo, que al menos es entero.
      #
      # El denominador se calcula con el MISMO guion del reparto pidiendole un
      # solo bloque de uno. Eso protege de que los bloques deriven entre si; del
      # colapso conjunto protege el suelo MINIMO_CLASES, no esta igualdad.
      #
      # Se compara a nivel de CLASE. Una version anterior de este comentario
      # justificaba esa eleccion diciendo que --list-tests y la ejecucion no
      # cuentan lo mismo (212 frente a 210). ERA FALSO, y el error era de
      # medicion: aquella ejecucion uso un filtro contaminado con la salida de
      # error del guion, porque se capturo 2>&1 en la variable. Con el filtro
      # limpio el bloque 1 da 212 listadas y 212 ejecutadas — sin discrepancia.
      #
      # Vale la pena conservar el incidente porque es el modo de fallo que este
      # job vigila, mordiendo a quien lo estaba construyendo: un filtro que no
      # es el que crees ejecuta MENOS tests, en verde y sin decir nada. De ahi
      # que el paso de ejecucion tome el recuento del .trx.
      - name: Comprobar que el reparto cubrio todas las clases
        run: |
          REPARTO_SALIDA=/tmp/esperadas-sin-ordenar.txt bash scripts/repartir-clases-de-test.sh tests/CaeManager.IntegrationTests 1 1 > /dev/null
          sort /tmp/esperadas-sin-ordenar.txt > /tmp/esperadas.txt
          cat reparto/bloque-*.txt | sort > /tmp/repartidas.txt
          esperadas=$(wc -l < /tmp/esperadas.txt)
          repartidas=$(wc -l < /tmp/repartidas.txt)
          unicas=$(sort -u /tmp/repartidas.txt | wc -l)
          echo "Clases de la suite: $esperadas — repartidas: $repartidas — distintas: $unicas"
          if [ "$esperadas" -ne "$unicas" ] || [ "$repartidas" -ne "$unicas" ]; then
            echo "::error::El reparto no cubre la suite exactamente una vez. Alguna clase no se ejecuto en ningun bloque, o se ejecuto en dos."
            diff /tmp/esperadas.txt /tmp/repartidas.txt || true
            exit 1
          fi


      # --collect "XPlat Code Coverage" (coverlet.collector, ya referenciado
      # en los tres proyectos de test) escribe un coverage.cobertura.xml por
      # suite bajo ./coverage — P1-19 de docs/business/MATURITY_REVIEW.md:
      # "cobertura en CI" no tenía ninguna señal hasta ahora, ni de
      # visibilidad ni de gate. Ahora tiene las dos: el informe de más abajo
      # sigue siendo solo visibilidad, y el paso "Umbral de cobertura"
      # después de él es el gate real (ratchet, ver su comentario).
      # Los cuatro bloques de tests-integracion publican su cobertura; aqui se
      # recogen para que el informe y el ratchet de abajo midan exactamente el
      # mismo conjunto que antes: Domain + Application + Integration.
      #
      # Sin este paso el ratchet seguiria ejecutandose, pero sobre dos suites
      # en vez de tres: caeria por debajo del umbral y el fallo se leeria como
      # una perdida de cobertura del producto. Un gate que cambia de
      # significado sin que nadie lo decida es peor que no tenerlo.
      - name: Recoger la cobertura de los bloques de integración
        uses: actions/download-artifact@v4
        with:
          pattern: cobertura-integracion-*
          path: coverage/integration
          merge-multiple: true
      # SE EJECUTARON TODOS LOS TESTS, no solo todas las clases.
      #
      # La comprobacion de clases detecta que un bloque se deje una clase
      # entera fuera. No detecta que una clase corra A MEDIAS — que es lo que
      # ocurrio el 2026-08-29 construyendo esto: un filtro contaminado ejecuto
      # 210 de 212 tests de un bloque, en verde, con todas sus clases
      # presentes. Esta comprobacion si lo habria visto.
      #
      # `total` del .trx es el contador correcto: incluye los omitidos
      # (medido — un bloque con 4 omitidos da total=206 y executed=202).
      # Contra `executed` faltarian los 4 omitidos de la suite y el gate
      # fallaria solo. Y el atributo `notExecuted` de <Counters> es una trampa:
      # vale 0 aunque haya omitidos, asi que no sirve para contarlos.
      #
      # Los dos lados se miden en ESTE run, nunca contra un numero escrito a
      # mano: un numero fijo envejece con cada test nuevo y acaba bajandose
      # para que pase un PR, que es como mueren estas guardas. El descubrimiento
      # se hace ademas sobre el arbol recien compilado — listar con --no-build
      # sobre un ensamblado rancio devolvio una vez un test fantasma que ya no
      # existia en el codigo.
      - name: Comprobar que se ejecutaron todos los tests
        run: |
          esperados=$(dotnet test tests/CaeManager.IntegrationTests --no-build --list-tests | grep -cE "^[[:space:]]+CaeManager\.IntegrationTests\.")
          sumados=0
          for f in $(find coverage/integration -name "bloque-*.trx"); do
            n=$(grep -o "total=\"[0-9]*\"" "$f" | head -1 | grep -o "[0-9]*")
            echo "  $(basename "$f"): ${n:-0}"
            sumados=$((sumados + ${n:-0}))
          done
          echo "Tests descubiertos: $esperados — ejecutados entre los bloques: $sumados"
          if [ "$esperados" -ne "$sumados" ]; then
            echo "::error::Los bloques ejecutaron $sumados tests de $esperados. Si faltan, alguna clase corrio a medias o un filtro no caso con todo lo suyo; si sobran, algun test se ejecuto en dos bloques."
            exit 1
          fi


      # MarkdownSummaryGithub: pensado por ReportGenerator específicamente
      # para $GITHUB_STEP_SUMMARY — aparece en la pestaña Summary del run,
      # no hace falta abrir un artefacto para ver el número. JsonSummary es
      # para el paso siguiente (el gate) — el mismo run de reportgenerator
      # produce los dos formatos, sin repetir el cálculo.
      # continue-on-error: un fallo en este informe (p. ej. ningún
      # .cobertura.xml si algo cambia en coverlet) no debe tumbar un job
      # cuyos tests ya pasaron por esta parte — es visibilidad. El gate de
      # verdad es el paso siguiente, que si no encuentra Summary.json falla
      # por su cuenta (ver su comentario) — el fallo del informe no queda
      # silenciado, solo no duplica el mensaje de error.
      - name: Informe de cobertura
        if: always()
        continue-on-error: true
        run: |
          dotnet reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:coveragereport -reporttypes:"MarkdownSummaryGithub;JsonSummary"
          cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # Ratchet de cobertura (§ 8 del plan de negocio, Horizonte transversal):
      # cobertura de línea medida en local a 2026-08-15 sobre Domain +
      # Application + Integration (los tres proyectos con --collect de este
      # job) = 91.6%. El umbral se fija en 90.0%, no en 91.6% exacto — 1.6
      # puntos de margen absorben el ruido normal entre ejecuciones (orden
      # de tests, generación de datos aleatorios en los builders) sin que un
      # PR legítimo falle por decimales; una caída real de cobertura (borrar
      # tests, añadir código sin cubrir de un tamaño con el que valga la
      # pena preocuparse) sigue siendo mucho mayor que ese margen y sí falla
      # el build. Es un ratchet: solo sube cuando la cobertura real mejora
      # de forma sostenida, nunca se baja para que pase un PR concreto.
      #
      # Vive dentro de "Build, format y tests" — ya es required status check
      # de la protección de la rama main — en vez de un job nuevo: así el
      # gate hereda ese estado "required" sin tocar la configuración de
      # protección de rama, y no hay forma de que este paso corra y su
      # resultado se ignore (a diferencia del job de k6 de más abajo, que es
      # informativo a propósito y por eso está fuera de los required checks).
      - name: Umbral de cobertura (ratchet — nunca bajar de 90%)
        run: |
          cobertura=$(jq -r '.summary.linecoverage' coveragereport/Summary.json)
          umbral="90.0"
          echo "Cobertura de línea (Domain+Application+Integration): ${cobertura}% — umbral ratchet: ${umbral}%"
          if ! python3 -c "import sys; sys.exit(0 if float('${cobertura}') >= float('${umbral}') else 1)"; then
            echo "::error::La cobertura de línea (${cobertura}%) cayó por debajo del umbral ratchet (${umbral}%). Sube el umbral solo cuando la cobertura real mejore de forma sostenida — nunca lo bajes para que pase este PR."
            exit 1
          fi

  migraciones-pendientes:
    name: Detectar migraciones EF olvidadas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore CaeManager.slnx

      - name: Restaurar herramientas locales (dotnet-ef)
        run: dotnet tool restore

      # Falla si alguien cambió el modelo (una entidad, una propiedad) sin
      # generar la migración correspondiente — el tipo de olvido que solo se
      # descubre hoy al desplegar y ver crashear la app contra la base real.
      # Las migraciones viven en su propio ensamblado, no en Infrastructure
      # (ver CaeManager.Migrations.PostgreSQL).
      - name: dotnet ef migrations has-pending-model-changes
        run: dotnet ef migrations has-pending-model-changes --project src/CaeManager.Migrations.PostgreSQL --startup-project src/CaeManager.Web

  docker-build:
    name: Build de la imagen de despliegue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reconstruye exactamente la imagen que despliega Railway (mismo
      # Dockerfile, mismo -r linux-x64 --self-contained false de la Fase 22)
      # — así un SDK band distinto o un asset de framework faltante se
      # detecta aquí, no en producción como pasó esa vez.
      #
      # load: true (además de push: false) mete la imagen en el daemon local
      # de este runner — sin esto, Trivy no tendría qué escanear en el paso
      # siguiente.
      - name: Construir imagen Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: caemanager:ci

      # P2 #25 de docs/business/MATURITY_REVIEW.md: escaneo de la imagen de
      # despliegue en busca de vulnerabilidades conocidas (SO + paquetes del
      # framework de .NET). Bloqueante desde la auditoría de madurez
      # 2026-08-16: el primer triage real (los tres runs previos de este
      # mismo workflow, 2026-08-15) dio 0 hallazgos CRITICAL/HIGH — no había
      # nada pendiente que este cambio convirtiera en bloqueante de golpe.
      # Si una vulnerabilidad nueva aparece y se decide que es aceptable
      # (falso positivo, sin parche disponible todavía), se documenta con
      # un .trivyignore en vez de volver a exit-code 0 para todo el escaneo.
      - name: Escanear vulnerabilidades de la imagen (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: caemanager:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

  bunit-tests:
    name: Tests de componentes (bUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore CaeManager.slnx

      - name: Restaurar herramientas locales
        run: dotnet tool restore

      - name: Tests de componentes Blazor
        run: >
          dotnet test tests/CaeManager.Web.Tests --logger "console;verbosity=normal"
          --collect "XPlat Code Coverage" --results-directory ./coverage/web

      # continue-on-error: un fallo en el informe (p. ej. ningún .cobertura.xml
      # si algo cambia en coverlet) no debe tumbar un job cuyos tests ya
      # pasaron — es visibilidad, no gate.
      #
      # Deliberadamente sin el ratchet que sí tiene "Build, format y tests":
      # coverlet instrumenta todo el árbol de dependencias de
      # CaeManager.Web.Tests (Domain/Application/Infrastructure/Web
      # completos, no solo los componentes Blazor), así que esta cifra
      # es "cuánto del código TOTAL ejecuta la suite de bUnit sola" — medido
      # en local, 0.4% — no "cuánto cubren los componentes Blazor". Fijar un
      # umbral sobre ese número sería o bien un gate casi vacío (cualquier
      # umbral bajo pasa siempre) o uno que falla por ruido de instrumentación
      # sin relación con una regresión real. El número honesto de cobertura ya
      # tiene su gate en "Build, format y tests" (Domain+Application+
      # Integration, 91.6% medido); replicarlo aquí sobre una cifra que no
      # significa lo que parece decir sería peor que no tener gate.
      - name: Informe de cobertura
        if: always()
        continue-on-error: true
        run: |
          dotnet reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:coveragereport -reporttypes:MarkdownSummaryGithub
          cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

  e2e-tests:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    # WebAppFixture arranca la app real contra una base PostgreSQL propia
    # (creada y borrada por test, ver BaseDatosPostgresDePruebas) — mismo
    # servicio que usa el job build-and-test.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore CaeManager.slnx

      # Arranca la propia app (WebAppFixture) como subproceso real contra
      # PostgreSQL — necesita el .dll ya compilado antes de correr los
      # tests, y el propio proyecto Web (CaeManager.Web.dll) también.
      - name: Compilar
        run: dotnet build CaeManager.slnx --no-restore

      # El paquete Microsoft.Playwright genera un playwright.ps1 en el output
      # del proyecto que lo referencia — se usa ese, no una instalación
      # global, para no acoplar la versión de los navegadores a nada fuera
      # del propio csproj (ver CaeManager.E2ETests.csproj).
      # --collect "XPlat Code Coverage" (coverlet.collector, ya referenciado
      # en los tres proyectos de test) escribe un coverage.cobertura.xml por
      # suite bajo ./coverage — P1-19 de docs/business/MATURITY_REVIEW.md:
      # "cobertura en CI" no tenía ninguna señal hasta ahora, ni de
      # visibilidad ni de gate. Ahora tiene las dos: el informe de más abajo
      # sigue siendo solo visibilidad, y el paso "Umbral de cobertura"
      # después de él es el gate real (ratchet, ver su comentario).
      # BOOTSTRAP DE CLÚSTER — prerrequisito de cualquier MigrateAsync.
      #
      # Los roles son objetos de clúster (pg_authid es catálogo compartido) y
      # desde este incremento NINGUNA migración los crea: crearlos desde la
      # migración de una base ponía a seis migradores a competir y tres de seis
      # fallaban con 42704. deploy/bootstrap/roles-de-cluster.sql es la
      # especificación normativa y este paso es su adaptador de CI; el guion
      # trae dentro su propia verificación post-bootstrap.
      #
      # ON_ERROR_STOP=1: sin esto psql seguiría adelante tras un error y el job
      # arrancaría contra un clúster fuera de contrato.
      - name: Bootstrap de roles de clúster
        env:
          PGPASSWORD: postgres
        run: >
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f deploy/bootstrap/roles-de-cluster.sql

      - name: Instalar navegadores de Playwright
        run: pwsh tests/CaeManager.E2ETests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Tests E2E
        run: dotnet test tests/CaeManager.E2ETests --no-build --logger "console;verbosity=normal"

  load-test:
    name: Prueba de carga base (k6)
    runs-on: ubuntu-latest
    # No bloqueante a propósito (P1-5 de la revisión de madurez): es la
    # primera cifra real de carga que existe en el repo (P1-19 de
    # docs/business/MATURITY_REVIEW.md, antes no había ninguna) — sin un
    # historial de resultados todavía no hay umbral defendible que hacer
    # fallar el build, solo visibilidad. A diferencia del escaneo de Trivy
    # de "Build de la imagen de despliegue" (que solo afecta a su propio
    # paso vía exit-code: "0", sin tocar el resultado del job), este
    # continue-on-error es a nivel de job — por eso "Prueba de carga base
    # (k6)" está deliberadamente fuera de los required status checks de la
    # protección de rama de main: un gate marcado "informativo" en el
    # código no debe poder bloquear un merge en GitHub.
    continue-on-error: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore CaeManager.slnx

      - name: Compilar
        run: dotnet build CaeManager.slnx --no-restore

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      # Arranca el mismo binario que despliega Railway, en segundo plano,
      # contra el Postgres del job — mismo patrón que WebAppFixture en los
      # tests E2E (ver esa clase), pero como proceso de shell porque este
      # job no es un proyecto de test .NET.
      # --collect "XPlat Code Coverage" (coverlet.collector, ya referenciado
      # en los tres proyectos de test) escribe un coverage.cobertura.xml por
      # suite bajo ./coverage — P1-19 de docs/business/MATURITY_REVIEW.md:
      # "cobertura en CI" no tenía ninguna señal hasta ahora, ni de
      # visibilidad ni de gate. Ahora tiene las dos: el informe de más abajo
      # sigue siendo solo visibilidad, y el paso "Umbral de cobertura"
      # después de él es el gate real (ratchet, ver su comentario).
      # BOOTSTRAP DE CLÚSTER — prerrequisito de cualquier MigrateAsync.
      #
      # Los roles son objetos de clúster (pg_authid es catálogo compartido) y
      # desde este incremento NINGUNA migración los crea: crearlos desde la
      # migración de una base ponía a seis migradores a competir y tres de seis
      # fallaban con 42704. deploy/bootstrap/roles-de-cluster.sql es la
      # especificación normativa y este paso es su adaptador de CI; el guion
      # trae dentro su propia verificación post-bootstrap.
      #
      # ON_ERROR_STOP=1: sin esto psql seguiría adelante tras un error y el job
      # arrancaría contra un clúster fuera de contrato.
      - name: Bootstrap de roles de clúster
        env:
          PGPASSWORD: postgres
        run: >
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f deploy/bootstrap/roles-de-cluster.sql

      - name: Arrancar la app
        run: |
          ASPNETCORE_ENVIRONMENT=Development \
          ASPNETCORE_URLS=http://127.0.0.1:5000 \
          ConnectionStrings__CaeManagerDb="Host=localhost;Port=5432;Database=caemanager_carga;Username=postgres;Password=postgres" \
          DatosPrueba__Activo=true \
          nohup dotnet src/CaeManager.Web/bin/Debug/net10.0/CaeManager.Web.dll > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5000/salud > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "La app no respondió /salud a tiempo:"
          cat app.log
          exit 1

      # scripts/carga-basica.js explica por qué k6 y no un paquete NuGet
      # (NBomber exige suscripción comercial para uso organizacional —
      # mismo motivo por el que ARCHITECTURE.md ya había descartado
      # QuestPDF). Sin --scenario-thresholds: el resumen es la primera
      # cifra real, no hay una anterior con la que decidir un umbral.
      - name: Prueba de carga (k6)
        run: k6 run scripts/carga-basica.js | tee k6-resumen.txt
        env:
          BASE_URL: http://127.0.0.1:5000

      - name: Publicar resumen
        if: always()
        run: |
          {
            echo "## Prueba de carga base (k6)"
            echo '```'
            cat k6-resumen.txt 2>/dev/null || echo "Sin resumen — revisa el log del paso anterior."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  gitleaks:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action@v3 aborta en la cola de merge con «ERROR: The
    # [merge_group] event is not yet supported» — no es un secreto encontrado,
    # es que la Action se niega a arrancar. Como el escaneo es check obligatorio,
    # eso bloqueaba TODAS las entradas de la cola.
    #
    # Saltarlo aquí no deja ningún hueco: cada PR se escanea íntegro por la vía
    # `pull_request` ANTES de poder entrar en la cola, y una entrada de la cola
    # es la combinación de PRs ya escaneados con un `main` ya escaneado. Un
    # secreto no aparece por combinar dos ramas limpias.
    #
    # Un job saltado reporta «skipped», que GitHub da por satisfecho en los
    # checks obligatorios — por eso la cola puede completar.
    #
    # Deuda declarada: el binario `gitleaks` que esta Action descarga y ejecuta
    # por debajo es MIT y no tiene ninguna de sus tres limitaciones (licencia por
    # tipo de cuenta, validación remota que su propio autor dejó desactivada, y
    # este evento sin soportar). Sustituir la Action por el binario resolvería
    # las tres de golpe; queda como incremento propio, no como parche a la
    # carrera de un gate roto.
    if: github.event_name != 'merge_group'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # La Action exige clave de licencia cuando el repositorio pertenece
          # a una organización — mira el tipo de cuenta del propietario, no la
          # visibilidad del repo ni cuántos hay. Mientras estuvo en cuenta
          # personal no hacía falta ninguna. La clave de organización es hoy
          # gratuita (gitleaks.io); el binario que ejecuta por debajo es MIT.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  deploy-script-tests:
    name: Prueba de mutación — SHA determinista en el despliegue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: deploy/resolve-deploy-sha.tests.sh
        run: bash deploy/resolve-deploy-sha.tests.sh

  licencias-dependencias:
    name: Licencias de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # El guion se prueba a sí mismo primero, sin red: si el verificador no
      # sabe distinguir MediatR 12.5.0 de 13.0.0, su veredicto sobre el árbol
      # real tampoco vale nada.
      - name: Probar el verificador (sin red)
        run: bash scripts/verificar-licencias-nuget.tests.sh

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore CaeManager.slnx

      # Las versiones se toman RESUELTAS, no del csproj: los comodines de
      # versión (`12.*`) no dicen qué se instaló de verdad, y es justamente lo
      # instalado lo que tiene licencia.
      - name: Listar dependencias de primer nivel
        run: |
          dotnet list package --format json > paquetes.json
          jq -r '[.projects[].frameworks[]?.topLevelPackages[]?
                  | "\(.id) \(.resolvedVersion)"] | unique | .[]' \
            paquetes.json > lista-paquetes.txt
          echo "Dependencias de primer nivel: $(wc -l < lista-paquetes.txt)"

      # Falla si un paquete cambia a una licencia no permitida o la declara
      # como fichero sin estar en scripts/licencias-revisadas.txt. Es el gate
      # que habría cazado FluentAssertions 8.x y MediatR 13.x cuando llegaron
      # como PRs de dependabot indistinguibles de una actualización rutinaria.
      - name: Verificar licencias
        run: bash scripts/verificar-licencias-nuget.sh lista-paquetes.txt

