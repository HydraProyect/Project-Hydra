name: Desplegar

# --- Qué dispara este workflow, y por qué así -------------------------------
#
# Staging se despliega cuando el workflow `CI` TERMINA EN VERDE sobre un
# commit de `main` — no en cuanto el commit llega a `main`. La diferencia
# importa: son dos momentos distintos, y entre ellos cabe un CI en rojo.
#
# Hasta el 2026-09-02 este workflow disparaba en `push: branches: [main]` y su
# cabecera lo justificaba diciendo que el commit "ya superó CI" porque la
# protección de rama exigía estar al día Y en verde para poder mergear. Esa
# regla se retiró el 2026-08-29 al adoptar la cola de merge (CLAUDE.md § 22):
# la cola prueba el RESULTADO YA FUSIONADO, que es lo correcto para decidir el
# merge, pero nadie volvía a mirar el CI que corre sobre `main` DESPUÉS del
# merge. Caso real (`bced727a`): la cola dejó pasar el merge, staging se
# desplegó, y el CI de `main` salió en rojo a continuación. El gate que
# faltaba no es "antes de mergear" — es "antes de desplegar lo ya mergeado".
#
# Por eso el disparador es `workflow_run` sobre el workflow `CI`:
#
#   - `types: [completed]` recibe TODA terminación de CI, verde o no. El job
#     `staging` es el que filtra por la conclusión. Un CI en rojo crea
#     igualmente un run de `Desplegar`, pero con todos sus jobs omitidos — y
#     como `aprobacion-produccion` depende de `staging`, tampoco deja una
#     aprobación de producción pendiente que alguien pueda aprobar por error.
#   - `branches: [main]` filtra por el NOMBRE de la rama en la que corrió CI.
#     Deja fuera los runs de `pull_request` de este repositorio (rama
#     `claude/**`) y los de la cola de merge (rama
#     `gh-readonly-queue/main/...`) — comprobado sobre los runs reales, no
#     supuesto. Lo que NO deja fuera es una PR desde la rama `main` de un
#     fork, que también lleva `head_branch` = `main`: de eso se encarga la
#     condición `workflow_run.event == 'push'` del job `staging`. Ver allí.
#   - Un CI de `main` CANCELADO no despliega. Ocurre de forma rutinaria: CI
#     cancela su propio run en curso sobre `main` cuando llega un merge más
#     nuevo. No se pierde nada — el commit nuevo contiene al viejo, y es ese
#     el que se despliega cuando su CI termina en verde.
#
# CONSECUENCIA NUEVA, que el disparador anterior no tenía: REEJECUTAR un run
# de CI antiguo de `main` vuelve a emitir `completed`, y si sale verde
# despliega SU commit. Es decir, reejecutar el CI de un commit ya superado
# devuelve staging a ese commit. No hay forma de distinguir esa reejecución de
# la de la punta actual —que sí queremos que despliegue, por ejemplo tras un
# rojo de infraestructura—, así que no se filtra por número de intento. Si
# ocurre, la salida es reejecutar el CI del commit más nuevo de `main`, o
# lanzar este workflow a mano. Y ojo con la concurrencia: el grupo
# `deploy-staging` solo guarda UN despliegue en espera, así que un despliegue
# que llegue a la cola desplaza al que estuviera esperando (nunca al que ya
# está corriendo, que es lo que protege `cancel-in-progress: false`).
#
# CUIDADO al cambiar este disparador: `workflow_run` solo funciona si el
# fichero está en la rama por defecto. Un cambio aquí no surte efecto hasta
# que la PR se mergea, y no se puede probar desde la rama.
#
# --- Qué SHA se despliega ---------------------------------------------------
#
# `SHA_DESPLEGADO` (más abajo), NUNCA `github.sha` a secas. Bajo
# `workflow_run`, `github.sha` es "el último commit de la rama por defecto" en
# el momento del evento, no el commit que superó CI: si `main` avanzó entre
# medias, son commits distintos. Usarlo reintroduciría por otra vía el
# incidente del 2026-08-26 (un job aprobado para el commit X terminando por
# desplegar el commit Y). Por la vía manual (`workflow_dispatch`) no hay run
# de CI del que leer nada, así que ahí sí se usa `github.sha`: el SHA de la
# referencia que se eligió al lanzarlo. Desde el 2026-09-23 esa referencia
# tiene que ser `main` (ver "La imagen se construye en el runner"): la firma
# de la imagen exige `deploy.yml@refs/heads/main`, así que la vía manual
# despliega la punta de main y nada más.
#
# El idiom `condición && valor || alternativa` devuelve `valor` solo si
# `valor` es truthy; una cadena vacía no lo es. Un `head_sha` vacío daría
# entonces `github.sha`, o sea la punta de `main`: el comportamiento anterior
# a este cambio, degradado pero no peligroso. Y si aun así llegara vacío al
# VPS, resolve-deploy-sha.sh exige 40 hexadecimales y rechaza cualquier otra
# cosa — el fallo es cerrado y ruidoso, nunca un despliegue silencioso de algo
# equivocado.
#
# CONSECUENCIA AL LEER LA LISTA DE RUNS: la interfaz atribuye cada run de
# `Desplegar` a la punta de `main`, porque eso es lo que vale `github.sha`
# bajo `workflow_run`. El SHA realmente desplegado está en el log del job
# ("Desplegar SHA exacto a ..."). No deduzcas qué se desplegó del encabezado
# del run.
#
# --- Producción -------------------------------------------------------------
#
# Producción entra en el mismo run que staging, pero su job usa
# `environment: produccion`, que en la configuración del repo exige aprobación
# manual de un revisor antes de ejecutar un solo paso (ver Settings →
# Environments → produccion). El job queda en pausa ("Waiting") hasta que se
# aprueba o se rechaza — nunca corre solo. Con el gate de CI de arriba, ahora
# además esa aprobación solo llega a existir si CI está verde.
#
# workflow_dispatch se conserva como vía alternativa (por ejemplo para forzar
# un redeploy sin un push nuevo) — pasa por el mismo gate del entorno.
#
# --- La clave SSH -----------------------------------------------------------
#
# La clave SSH (secrets.VPS_SSH_KEY) es de un par dedicado, restringido en el
# propio VPS (ver /root/.ssh/authorized_keys, entrada con "command=") a solo
# poder ejecutar /opt/talveg/deploy/ci-deploy.sh — ese script decide, por el
# primer token recibido, qué hacer: "staging" o "produccion" arrancan ese
# stack con la imagen firmada que llega por stdin (ver "La imagen se construye
# en el runner"), usando el segundo token (el SHA) para fijar exactamente qué
# commit despliega (ver deploy/resolve-deploy-sha.sh); "secretos" (sin segundo
# token, REC-014/P37 — job "aprobacion-produccion" más abajo) actualiza en
# `.env` solo las claves de la lista blanca que ci-deploy.sh define
# (CLAVES_PERMITIDAS_SECRETOS_PRODUCCION — no incluye credenciales de
# PostgreSQL, ver el comentario de ese fichero), sin construir ni desplegar
# nada. Aunque este secreto se filtrara, no da una shell libre en el VPS:
# como mucho, permite forzar el redeploy de un commit que ya sea ancestro
# real de main en GitHub, o sobrescribir en `.env` una clave de esa lista
# blanca — nunca leer un secreto ya guardado, ni escribir una clave fuera de
# ella (rechazo total y ruidoso, `.env` sin tocar).
#
# --- Las claves SSH (D6, 2026-09-19): una por capacidad ----------------------
#
# Con UNA clave de repositorio, la aprobación de `environment: produccion` no
# protegía la clave: cualquier workflow de main podía leerla y lanzar
# `produccion <SHA>`. D6 la parte en dos, y lo que cada una puede hacer lo fija
# el servidor (argumento del comando forzado en authorized_keys, ver
# deploy/ci-deploy.sh), no lo que pida el cliente:
#
#   - VPS_SSH_KEY_STAGING (secreto de REPOSITORIO): `--clave staging`, solo
#     `staging` y `muestreo-memoria`. La leen el job `staging` y la carga de
#     staging (carga-staging.yml, si está en main).
#   - VPS_SSH_KEY_PRODUCCION (secreto del ENVIRONMENT `produccion`, ninguno
#     de repositorio): `--clave produccion`, solo `produccion` y `secretos`.
#     Solo la puede leer un job que declare `environment: produccion`, es
#     decir, tras la aprobación.
#
# TRANSICIÓN SIN CORTE: mientras un secreto nuevo no exista, su job usa
# VPS_SSH_KEY (la clave única de antes, que sin argumentos en el comando forzado
# admite los cuatro modos). Cada job imprime qué clave usó. La clave antigua y
# ese modo de compatibilidad se retiran juntos, al final de
# RUNBOOK-CLAVES-SSH-D6-P32-2026-09.md (repositorio de negocio).
#
# Por eso el job `produccion` (el que lanza `produccion <SHA>`) declara
# TAMBIÉN `environment: produccion` (decisión del propietario, 2026-09-19,
# opción (a) de D6): sin ello no podría leer VPS_SSH_KEY_PRODUCCION y
# `produccion <SHA>` seguiría saliendo con una clave de repositorio, fuera de
# la aprobación. Consecuencia aceptada: DOS aprobaciones por despliegue a
# producción (la de `aprobacion-produccion` y la de `produccion`). Cambia lo
# que decían DEC-39/40 (ver la sección siguiente): el despliegue ya no queda
# fuera del environment. VPS_SSH_KEY y el modo de compatibilidad de
# ci-deploy.sh se retiran cuando este cambio esté verificado en un despliegue
# real (RUNBOOK-CLAVES-SSH-D6-P32-2026-09.md, pasos 12 y 13).
#
# --- La imagen se construye en el runner, no en el VPS (2026-09-23) ---------
#
# Hasta este cambio `staging`/`produccion` le decían al VPS "despliega <sha>" y
# el VPS compilaba (`docker compose build`) en la misma máquina de 4 GB que
# sirve los dos stacks. csc moría por OOM en cada despliegue, y en uno de esos
# episodios (2026-09-21 23:50Z) la renovación DHCP de eth0 no pudo fijar su
# ruta: la IPv4 caducó 24 h después y producción y staging quedaron
# inaccesibles unas 17 h.
#
# Ahora el job `imagen` construye `caemanager:<sha>` en el runner, la exporta
# (`docker save | gzip`), escribe un manifiesto de dos líneas (revision=<sha>,
# sha256=<hash del tarball>) y lo firma con cosign "keyless" (certificado de
# Fulcio para la identidad OIDC de ESTE job, registrado en Rekor). `staging` y
# `produccion` envían firma, manifiesto y tarball por stdin del mismo SSH de
# siempre, y ci-deploy.sh no carga nada sin verificar antes que la firma es de
# `deploy.yml@refs/heads/main` de este repositorio y del mismo SHA, y que el
# tarball tiene el hash firmado (ver verificar_firma_imagen en ese fichero).
# Por eso la clave SSH sola sigue sin bastar para ejecutar código que no haya
# salido de main: puede reenviar una imagen firmada de un commit de main, no
# fabricar una.
#
# Consecuencias:
#
#   - Staging y producción arrancan la MISMA imagen (el mismo artefacto del
#     run), no dos builds distintos del mismo SHA.
#   - El job `imagen` es el único con un permiso del GITHUB_TOKEN:
#     `id-token: write`, sin el cual GitHub no emite el token OIDC que Fulcio
#     certifica (ver "Permisos del GITHUB_TOKEN").
#   - La firma queda en el registro público de transparencia de Sigstore
#     (Rekor) con el repositorio, el workflow y el SHA. El repositorio ya es
#     público; no se publica nada que no lo fuera.
#   - La firma exige `refs/heads/main`: un `workflow_dispatch` lanzado sobre
#     otra rama produce una firma que el VPS rechaza. La vía manual solo
#     despliega commits de main lanzándola sobre main.
#   - El artefacto dura 30 días: una aprobación de producción más vieja que
#     eso falla al descargar y hay que relanzar el despliegue.
#   - El primer despliegue tras fusionar este cambio NO puede hacerlo el propio
#     workflow: el VPS aún tiene el ci-deploy.sh anterior, que ignora stdin y
#     compila (limitación conocida de su cabecera). Antes hay que actualizar a
#     mano el checkout de /opt/talveg e instalar cosign en el VPS.
#
# --- La conexión SSH: keepalive de aplicación (2026-09-22) -------------------
#
# Todo `ssh` de este fichero lleva `-o ServerAliveInterval=30
# -o ServerAliveCountMax=20`. Sin eso, la sesión no enviaba nada mientras el
# VPS compilaba en silencio, y del 2026-09-21 al 2026-09-22 siete despliegues
# seguidos a staging (de c64de0a9 a 4e0cf636) murieron así: tras la línea
# «CaeManager.Infrastructure -> …dll» no había más salida, y al cabo el job
# terminaba con «client_loop: send disconnect: Broken pipe» y código 255.
# El corte llegaba unos 4 min 20 s después de la última línea (en cuatro
# runs), a los 8 min 36 s (en uno) o a las 2 h 11-13 min (en dos), que es
# lo que tarda el keepalive TCP por defecto
# de Linux (7200 s + 9 × 75 s): la conexión ya estaba muerta y el runner no se
# enteraba. El silencio largo lo provoca el build en el VPS, que ahora pasa
# minutos sin escribir (antes, como mucho unos 80 s entre dos líneas), y eso
# no lo arregla este cambio: lo que arregla es la parte del cliente. Con el
# keepalive la conexión nunca pasa más de 30 s callada, y si el servidor deja
# de contestar de verdad el job falla a los 10 min (30 × 20) en vez de tener
# la cola `deploy-staging` colgada más de dos horas. No cambia qué hace el
# VPS ni cuándo se corta el despliegue: un build que falla sigue saliendo por
# `ci-deploy.sh` con su propio mensaje, que ahora sí llega al log.
#
# --- Por qué producción depende de staging, y por qué son dos jobs ----------
#
# `aprobacion-produccion` depende de `staging` (needs:) por una razón que no
# es de orden de despliegue sino de disco: los dos `docker-compose.*.yml`
# compilan con `build: context: ../..`, es decir, ambos entornos comparten EL
# MISMO checkout git en /opt/talveg. Sin este `needs:`, GitHub podría arrancar
# ambos jobs a la vez (si la aprobación de producción llegara rápido) y sus
# dos `git checkout --detach <sha>` + `docker compose build` competirían por
# el mismo árbol de ficheros en disco — pisándose entre sí y pudiendo acabar
# arrancando cualquiera de los dos con los compose del SHA equivocado,
# precisamente lo que el SHA determinista de arriba quiere evitar. `needs:
# staging` fuerza a que el despliegue de staging termine (éxito o fallo) antes
# de que producción empiece siquiera a esperar aprobación. (Desde el 2026-09-23
# el VPS ya no compila, ver "La imagen se construye en el runner", pero sigue
# haciendo el checkout para sus guiones y sus compose.)
#
# La aprobación (`environment: produccion`) vive en un job propio,
# `aprobacion-produccion`, separado del job que ejecuta el despliegue real
# (`produccion`, más abajo). Son dos grupos de concurrencia distintos, y esa
# separación es la que evita la cola interminable de aprobaciones obsoletas
# (incidente real, 2026-08-30: cada push a main dejaba su propia aprobación
# pendiente sin que nadie la revisara, y solo se vaciaban rechazándolas una a
# una a mano — 6 commits obsoletos acumulados antes de vaciar la cola):
#
#   - `aprobacion-produccion` usa cancel-in-progress: true. En cuanto llega
#     un despliegue más nuevo, GitHub cancela solo la aprobación pendiente
#     del anterior si nadie llegó a revisarla — ya no hace falta rechazarla
#     a mano para que la cola no crezca sin límite.
#   - `deploy-produccion` (el job `produccion`) sigue con
#     cancel-in-progress: false, exactamente como antes. Vive en un grupo
#     distinto a propósito: la cancelación automática de arriba nunca debe
#     alcanzar a un despliegue que YA fue aprobado y está corriendo el `ssh`
#     contra el VPS — interrumpirlo a medias sigue siendo tan peligroso como
#     siempre (`docker load` o `docker compose up` a medio terminar), así que ese job
#     sigue serializándose, nunca cancelándose solo.
#
# En resumen: solo se cancela sola una aprobación que TODAVÍA no se dio. Una
# vez aprobado, un despliegue corre siempre hasta el final.
#
# CAMBIO D6 (2026-09-19) respecto a lo anterior: el job `produccion` también
# declara `environment: produccion`, para poder leer VPS_SSH_KEY_PRODUCCION
# (ver "Las claves SSH"). Lo que NO cambia: la cancelación automática sigue
# viviendo solo en `aprobacion-produccion`; `produccion` conserva su grupo y su
# `cancel-in-progress: false`, así que un despliegue ya en marcha sigue sin
# poder cancelarse a medias. Lo que SÍ cambia: el despliegue espera una segunda
# aprobación antes de arrancar.
#
# UNKNOWN (no medido, y por eso no se afirma): qué hace GitHub con el grupo
# `deploy-produccion` mientras la segunda aprobación está pendiente. Dos
# lecturas posibles: (1) el job en espera de aprobación NO ocupa el grupo, y
# entonces dos despliegues aprobados a la vez solo quedan serializados por el
# cerrojo `flock` de ci-deploy.sh en el VPS (no por esta concurrencia); o
# (2) el job en espera SÍ lo ocupa, y entonces una segunda aprobación olvidada
# deja a los `produccion` de los runs posteriores en «pending» hasta que se
# apruebe o rechace (un pending más nuevo cancela a otro pending más viejo,
# nunca al que ocupa el grupo). Se mide con dos despliegues seguidos en cuanto
# los secretos nuevos estén cargados (RUNBOOK-CLAVES-SSH-D6-P32-2026-09.md,
# paso 11): dejar la segunda aprobación del primero sin dar y observar si el
# `produccion` del segundo arranca, queda en pending o se cancela.
#
# --- Permisos del GITHUB_TOKEN (2026-09-03, DEC-39 / REC-120) ---------------
#
# `permissions: {}` a nivel de workflow: el `GITHUB_TOKEN` sale sin ningún
# permiso. Medido línea a línea antes de fijarlo (evidencia en el handoff
# HO-120-01): este workflow no usa `actions/checkout`, no llama a la API de
# GitHub con `gh` ni con `actions/github-script`, y su único secreto es
# `secrets.VPS_SSH_KEY` — que no es el `GITHUB_TOKEN` y no depende de
# `permissions:`. La comprobación de la punta de `main` (más abajo) tampoco
# lo necesita: usa `git ls-remote` anónimo por HTTPS, válido porque el
# repositorio es público — mide estrictamente menos privilegio que pedir
# `contents: read` por la API de GitHub, que sí habría exigido conceder ese
# scope a un job (fuente: docs.github.com, "Using jobs" → "Assigning
# permissions to jobs", consultado 2026-09-03: "As a good security practice,
# you should grant the GITHUB_TOKEN the least required access"). Por eso
# ningún job de este fichero declaraba `permissions:` propio.
#
# EXCEPCIÓN (2026-09-23): el job `imagen` declara `id-token: write` y nada más.
# Es lo que GitHub exige para emitir el token OIDC con el que cosign obtiene el
# certificado de firma (ver "La imagen se construye en el runner"). No da
# acceso de lectura ni de escritura al repositorio: el código se sigue
# obteniendo con un `git fetch` anónimo, igual que la comprobación de la punta.
#
# --- Vía manual como break-glass explícito (2026-09-03, DEC-40 / REC-121) ---
#
# `workflow_dispatch` ya no dispara el despliegue con solo pulsar "Run
# workflow": exige dos `inputs` (docs.github.com, "Events that trigger
# workflows" → `workflow_dispatch`, consultado 2026-09-03), `confirmar` (debe
# coincidir EXACTAMENTE con "DESPLIEGO SIN GATE DE CI") y `motivo`
# (obligatorio). El primer paso del job `imagen` los valida antes de construir
# ni firmar nada; si la confirmación no coincide o el motivo llega vacío
# (`required: true` obliga a que la API reciba el input, pero la
# documentación no garantiza que rechace una cadena vacía), el job falla sin
# desplegar nada — y como `staging` depende de `imagen` y
# `aprobacion-produccion` de `staging` (`needs:`), tampoco queda ninguna
# aprobación de producción pendiente. Si la
# validación pasa, el paso escribe "BREAK-GLASS: actor, SHA, motivo" en el
# log (`::warning::`) y en `GITHUB_STEP_SUMMARY`, para que quede visible que
# este despliegue se hizo sin pasar por el gate de CI — nunca de forma
# silenciosa. Esto NO convierte la vía manual en el flujo normal (DEC-40,
# punto 7): sigue siendo un rodeo deliberado, operado por una persona que
# confirma explícitamente que lo es. `confirmar` y `motivo` se leen a través
# de `env:` en el paso, no interpolados directamente dentro de `${{ }}` en
# medio de `run:` — evita que un input con metacaracteres de shell (backticks,
# `$()`, etc.) se ejecute en el runner.
#
# --- Rechazo de runs obsoletos (2026-09-03, DEC-41 / REC-122) ---------------
#
# Antes de construir y otra vez antes de desplegar por la vía automática
# (`workflow_run`), un paso de `imagen` y otro de `staging` comprueban que
# `SHA_DESPLEGADO` sigue siendo la punta vigente de `main`
# (`git ls-remote` sobre el repositorio, sin autenticar). Si `main` avanzó
# desde que ese CI corrió — el caso típico es reejecutar ("rerun") un run de
# CI antiguo, ver "CONSECUENCIA NUEVA" arriba — el paso falla con "run
# obsoleto para despliegue" en el log y en el resumen, y no llega a tocar la
# clave SSH. Por el mismo mecanismo de `needs:` de arriba, tampoco queda
# aprobación de producción pendiente.
#
# Esta comprobación vive en el WORKFLOW, no en `resolve-deploy-sha.sh`: al
# guion lo invocan tanto la vía automática como el break-glass manual, y no
# distingue entre ambas — meterla ahí bloquearía también un rollback
# intencional hecho a propósito por la vía manual (DEC-41: "debe hacerse
# mediante la vía manual explícita... no como efecto secundario de pulsar
# rerun"). Por eso el paso solo corre `if: github.event_name == 'workflow_run'`
# y nunca se aplica a `workflow_dispatch`.
#
# CAMBIO 2026-09-23, pendiente de ratificar contra DEC-41: con la imagen
# firmada en CI, la vía manual ya NO sirve para volver a un commit anterior.
# Lanzarla sobre una rama o etiqueta que apunte a ese commit produce una firma
# de `deploy.yml@refs/<otra>`, que el VPS rechaza; lanzada sobre main despliega
# la punta. El rollback pasa a ser un revert en main (con su CI). La
# alternativa que conservaría el rollback manual —un input `sha` firmado por
# un run de main— queda como decisión abierta, no implementada aquí.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe exactamente: DESPLIEGO SIN GATE DE CI'
        required: true
        type: string
      motivo:
        description: 'Motivo del despliegue manual (obligatorio, break-glass)'
        required: true
        type: string

# Sin ningún permiso para el GITHUB_TOKEN: ver "Permisos del GITHUB_TOKEN" en
# la cabecera. Ningún job de este workflow necesita ninguno.
permissions: {}

env:
  VPS_HOST: 2.29.9.79
  # Clave publica del host. No es un secreto: identifica al servidor, no da
  # acceso. Vive versionada a proposito, para que cambiarla deje rastro.
  VPS_HOST_KEY: "2.29.9.79 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJdktXchT+yIjLV+Z7181+W+Sv7cnTuzk3hC8QwU7DsW"
  # El commit que se despliega. Ver "Qué SHA se despliega" en la cabecera:
  # bajo `workflow_run` es el commit que superó CI, no la punta de `main`.
  SHA_DESPLEGADO: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  imagen:
    # Construye, firma y publica como artefacto del run la imagen que staging
    # y producción van a arrancar. Ver "La imagen se construye en el runner"
    # en la cabecera. Mismo gate que `staging` (ver el comentario de allí).
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success')
    name: Construir y firmar la imagen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Único permiso del GITHUB_TOKEN en este workflow: el token OIDC que
    # certifica la firma. Ver "Permisos del GITHUB_TOKEN" en la cabecera.
    permissions:
      id-token: write
    steps:
      - name: Break-glass — validar confirmación manual
        # Ver "Vía manual como break-glass explícito" en la cabecera.
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
          MOTIVO: ${{ inputs.motivo }}
        run: |
          set -euo pipefail
          ESPERADO="DESPLIEGO SIN GATE DE CI"
          if [ "$CONFIRMAR" != "$ESPERADO" ]; then
            echo "::error::confirmación incorrecta — debes escribir exactamente: $ESPERADO"
            {
              echo "### 🛑 Despliegue manual rechazado"
              echo ""
              echo "La confirmación no coincide con el texto exigido."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -z "$MOTIVO" ]; then
            echo "::error::el motivo es obligatorio para el despliegue manual"
            {
              echo "### 🛑 Despliegue manual rechazado"
              echo ""
              echo "Falta el motivo."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Motivo de una sola línea antes de escribirlo en el log o el
          # resumen: un salto de línea dentro del input permitiría falsificar
          # una línea de log de Actions (p. ej. un `::error::` o `::warning::`
          # posterior no emitido de verdad por este paso). Quien dispara
          # workflow_dispatch ya necesita acceso de escritura al repositorio,
          # así que esto no es una escalada de privilegio — es higiene del
          # registro de auditoría que DEC-40 exige (actor, SHA, motivo).
          MOTIVO="$(printf '%s' "$MOTIVO" | tr '\n\r' '  ')"
          echo "::warning::BREAK-GLASS — actor=$GITHUB_ACTOR sha=$SHA_DESPLEGADO motivo=$MOTIVO"
          {
            echo "### ⚠️ BREAK-GLASS: despliegue manual sin gate de CI"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Actor | $GITHUB_ACTOR |"
            echo "| SHA | \`$SHA_DESPLEGADO\` |"
            echo "| Motivo | $MOTIVO |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comprobar que el SHA sigue siendo la punta de main
        # Ver "Rechazo de runs obsoletos" en la cabecera. Solo aplica a la vía
        # automática; la manual solo despliega la punta de main desde el
        # 2026-09-23 (ver el "CAMBIO 2026-09-23" de esa sección).
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          PUNTA_ACTUAL="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ "$PUNTA_ACTUAL" != "$SHA_DESPLEGADO" ]; then
            echo "::error::run obsoleto para despliegue — $SHA_DESPLEGADO ya no es la punta de main ($PUNTA_ACTUAL)"
            {
              echo "### 🛑 Despliegue omitido: run obsoleto"
              echo ""
              echo "El commit de este run (\`$SHA_DESPLEGADO\`) ya no es la punta de \`main\`"
              echo "(\`$PUNTA_ACTUAL\`). Esto ocurre al reejecutar (rerun) un CI antiguo:"
              echo "main avanzó mientras tanto. No se despliega."
              echo ""
              echo "Para desplegar la punta actual, relanza el CI de main o usa la vía"
              echo "manual (workflow_dispatch) sobre main. Para volver a un commit"
              echo "anterior, haz un revert en main: la vía manual ya no despliega"
              echo "commits que no sean la punta (imagen firmada en CI, 2026-09-23)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Punta de main confirmada: $SHA_DESPLEGADO"

      - name: Obtener el código del SHA exacto
        # `git fetch` anónimo por el SHA, no actions/checkout: el GITHUB_TOKEN
        # de este job no tiene `contents: read` (ver la cabecera) y el
        # repositorio es público. `test` del final: lo que se construye es
        # exactamente SHA_DESPLEGADO, no otra cosa que se llame igual.
        run: |
          set -euo pipefail
          git init -q .
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$SHA_DESPLEGADO"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SHA_DESPLEGADO"

      - name: Construir la imagen
        # La etiqueta OCI de revisión la comprueba cargar_imagen_verificada
        # en el VPS tras el `docker load`.
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.revision=$SHA_DESPLEGADO" \
            -t "caemanager:$SHA_DESPLEGADO" .

      - name: Exportar la imagen y escribir el manifiesto
        run: |
          set -euo pipefail
          mkdir -p imagen-despliegue
          docker save "caemanager:$SHA_DESPLEGADO" | gzip -1 > imagen-despliegue/imagen.tar.gz
          printf 'revision=%s\nsha256=%s\n' "$SHA_DESPLEGADO" \
            "$(sha256sum imagen-despliegue/imagen.tar.gz | cut -d' ' -f1)" \
            > imagen-despliegue/imagen.manifiesto
          cat imagen-despliegue/imagen.manifiesto
          ls -l imagen-despliegue

      - name: Instalar cosign
        # Versión y hash fijados: el hash es el de cosign_checksums.txt de la
        # release v3.1.3 de sigstore/cosign. El VPS usa la misma versión.
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/cosign" \
            https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          echo "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  $RUNNER_TEMP/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/cosign"

      - name: Firmar el manifiesto
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cosign" sign-blob --yes \
            --bundle imagen-despliegue/imagen.sigstore.json \
            imagen-despliegue/imagen.manifiesto

      - name: Verificar la firma con la misma función que el VPS
        # `source` de ci-deploy.sh (su guarda de BASH_SOURCE impide que corra
        # main): mismas constantes de identidad y misma función que usará el
        # VPS. Si la identidad fijada allí no casa con la real de este job, el
        # fallo sale aquí y no a mitad de un despliegue.
        run: |
          set -euo pipefail
          source deploy/ci-deploy.sh
          COSIGN="$RUNNER_TEMP/cosign" verificar_firma_imagen imagen-despliegue "$SHA_DESPLEGADO"

      - name: Publicar la imagen firmada como artefacto del run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: imagen-despliegue
          path: imagen-despliegue
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          # "Re-run all jobs" vuelve a subir el mismo nombre en el mismo run.
          overwrite: true

  staging:
    # EL GATE. Solo despliega si el CI que acaba de terminar terminó en verde
    # Y corrió sobre un `push` a `main`. `failure`, `cancelled`, `timed_out`,
    # `skipped` y `action_required` omiten el job — y con él, toda la cadena
    # hacia producción, que cuelga de este `needs:`.
    #
    # Las DOS condiciones hacen falta. `branches: [main]` de arriba compara el
    # NOMBRE de la rama en la que corrió CI, no el evento: este repositorio es
    # público, así que cualquiera puede abrir una PR desde la rama `main` de
    # su fork, y el run de CI de esa PR lleva `head_branch` = `main`. Sin
    # `workflow_run.event == 'push'`, ese run verde activaría este workflow,
    # que sí tiene acceso a `secrets.VPS_SSH_KEY` aunque el de la PR no lo
    # tuviera — el riesgo clásico de `workflow_run`. No llegaría a desplegar
    # nada (resolve-deploy-sha.sh rechaza un SHA que no sea ancestro real de
    # `origin/main`), pero bastaría para hacer que el workflow contacte con el
    # VPS y compita por el grupo `deploy-staging`. Exigir `push` cierra ese
    # camino entero: un run de CI por `push` a `main` solo puede venir de un
    # push a la `main` de ESTE repositorio.
    #
    # La vía manual se conserva aparte: en `workflow_dispatch` no hay run de
    # CI del que leer una conclusión, y bloquearla dejaría sin forma de forzar
    # un redeploy ni de probar el mecanismo de despliegue. Es, a propósito, un
    # rodeo del gate operado por una persona: quien lanza el workflow a mano
    # despliega la punta de la referencia que elija, tenga esa punta el CI en
    # verde, en rojo o todavía corriendo. Comprobar CI también ahí es una
    # decisión de producto pendiente, no un olvido — hoy la vía manual existe
    # justamente para los casos en que el camino automático no sirve.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success')
    name: Desplegar a staging
    needs: imagen
    runs-on: ubuntu-latest
    # Concurrencia por entorno, no por workflow entero: dos deploys de
    # staging no deben chocar entre sí (causa real del run #47, dos runs
    # desplegando staging a la vez), pero staging tampoco debe quedar
    # bloqueado detrás de una aprobación de producción pendiente durante
    # horas — son colas independientes.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Comprobar que el SHA sigue siendo la punta de main
        # Ver "Rechazo de runs obsoletos" en la cabecera. Solo aplica a la vía
        # automática; la manual solo despliega la punta de main desde el
        # 2026-09-23 (ver el "CAMBIO 2026-09-23" de esa sección).
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          PUNTA_ACTUAL="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ "$PUNTA_ACTUAL" != "$SHA_DESPLEGADO" ]; then
            echo "::error::run obsoleto para despliegue — $SHA_DESPLEGADO ya no es la punta de main ($PUNTA_ACTUAL)"
            {
              echo "### 🛑 Despliegue omitido: run obsoleto"
              echo ""
              echo "El commit de este run (\`$SHA_DESPLEGADO\`) ya no es la punta de \`main\`"
              echo "(\`$PUNTA_ACTUAL\`). Esto ocurre al reejecutar (rerun) un CI antiguo:"
              echo "main avanzó mientras tanto. No se despliega."
              echo ""
              echo "Para desplegar la punta actual, relanza el CI de main o usa la vía"
              echo "manual (workflow_dispatch) sobre main. Para volver a un commit"
              echo "anterior, haz un revert en main: la vía manual ya no despliega"
              echo "commits que no sean la punta (imagen firmada en CI, 2026-09-23)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Punta de main confirmada: $SHA_DESPLEGADO"

      - name: Preparar clave SSH
        # D6: clave PROPIA de staging (`--clave staging` en authorized_keys:
        # solo staging y muestreo-memoria, nunca producción), secreto de
        # repositorio. Mientras VPS_SSH_KEY_STAGING no exista se usa la clave
        # antigua, para no cortar el despliegue (ver "Las claves SSH").
        env:
          CLAVE_NUEVA: ${{ secrets.VPS_SSH_KEY_STAGING }}
          CLAVE_ANTIGUA: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          if [ -n "$CLAVE_NUEVA" ]; then
            printf '%s\n' "$CLAVE_NUEVA" > ~/.ssh/id_ed25519
            echo "Clave SSH usada: VPS_SSH_KEY_STAGING"
          else
            printf '%s\n' "$CLAVE_ANTIGUA" > ~/.ssh/id_ed25519
            echo "::warning::VPS_SSH_KEY_STAGING no está cargado: se usa VPS_SSH_KEY (transición D6, ver RUNBOOK-CLAVES-SSH-D6-P32)"
          fi
          # Clave de host FIJADA, no aprendida. `ssh-keyscan` en cada ejecucion
          # confia en la primera clave que le contesten: si alguien se interpone
          # una sola vez, el despliegue le entrega la sesion sin distinguirlo de
          # una rotacion legitima. Fijada aqui, un cambio de clave rompe el
          # despliegue y obliga a mirar, que es lo que debe pasar.
          echo "$VPS_HOST_KEY" >> ~/.ssh/known_hosts

      - name: Descargar la imagen firmada
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: imagen-despliegue
          path: imagen-despliegue

      - name: Desplegar SHA exacto a staging
        # stdin: firma y manifiesto en base64 (una línea cada uno) y después el
        # tarball — el formato que lee recibir_imagen_firmada en ci-deploy.sh.
        run: |
          set -euo pipefail
          echo "Desplegando a staging el commit $SHA_DESPLEGADO"
          {
            base64 -w0 imagen-despliegue/imagen.sigstore.json; echo
            base64 -w0 imagen-despliegue/imagen.manifiesto; echo
            cat imagen-despliegue/imagen.tar.gz
          } | ssh -i ~/.ssh/id_ed25519 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "root@$VPS_HOST" "staging $SHA_DESPLEGADO"

  aprobacion-produccion:
    name: Aprobar despliegue a producción
    needs: staging
    runs-on: ubuntu-latest
    environment: produccion
    # cancel-in-progress: true a propósito — ver el comentario de arriba.
    # Este job no toca el VPS, solo espera al revisor; cancelarlo a medias
    # no deja nada a medio construir.
    concurrency:
      group: aprobacion-produccion
      cancel-in-progress: true
    steps:
      - name: Aprobado
        run: echo "Despliegue a produccion aprobado para $SHA_DESPLEGADO"

      - name: Preparar clave SSH
        # D6: clave PROPIA de producción (`--clave produccion` en
        # authorized_keys: solo produccion y secretos), secreto del
        # environment `produccion` — solo los jobs que declaran ese
        # environment (este y `produccion`) pueden leerla. Mientras VPS_SSH_KEY_PRODUCCION no
        # exista se usa la clave antigua (ver "Las claves SSH").
        env:
          CLAVE_NUEVA: ${{ secrets.VPS_SSH_KEY_PRODUCCION }}
          CLAVE_ANTIGUA: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          if [ -n "$CLAVE_NUEVA" ]; then
            printf '%s\n' "$CLAVE_NUEVA" > ~/.ssh/id_ed25519
            echo "Clave SSH usada: VPS_SSH_KEY_PRODUCCION"
          else
            printf '%s\n' "$CLAVE_ANTIGUA" > ~/.ssh/id_ed25519
            echo "::warning::VPS_SSH_KEY_PRODUCCION no está cargado: se usa VPS_SSH_KEY (transición D6, ver RUNBOOK-CLAVES-SSH-D6-P32)"
          fi
          echo "$VPS_HOST_KEY" >> ~/.ssh/known_hosts

      - name: Actualizar secretos de producción (REC-014/P37)
        # Transición documentada (REC-014, opción "secretos de GitHub
        # inyectados en el despliegue"): mientras el propietario no cargue
        # ningún valor abajo, este paso no cambia nada en el VPS — el `.env`
        # real sigue siendo la única fuente, exactamente como antes de este
        # cambio (ver deploy/ci-deploy.sh, actualizar_secretos_produccion, el
        # no-op con stdin vacío).
        #
        # Corre en ESTE job — el único con `environment: produccion`, que es
        # lo que da acceso a estos secretos — y NO en el job "produccion" de
        # abajo. GitHub no permite pasar secretos a otro job por sus
        # `outputs` ("job outputs are not masked and are not encrypted"), así
        # que el SSH que los escribe tiene que salir de aquí, en un segundo
        # comando forzado separado del que construye y despliega
        # ("secretos", nunca "produccion $SHA") — meterlo en el mismo job que
        # hace `docker load`/`up` reabriría el problema que DEC-39/40
        # resolvió separando la aprobación (cancelable) de la ejecución (no
        # cancelable a medias): este job sigue con `cancel-in-progress: true`
        # porque escribir `.env` es idempotente y seguro de cancelar a
        # medias (el `mv` final en el VPS es atómico), cosa que un
        # `docker compose up` a medias no es.
        #
        # LISTA DE NOMBRES (única fuente de qué se inyecta hoy — para añadir
        # un secreto más: declararlo aquí en `env:` con el MISMO nombre que
        # usa `.env`, añadir su línea en `agregar` más abajo, Y añadirlo a
        # CLAVES_PERMITIDAS_SECRETOS_PRODUCCION en ci-deploy.sh — las dos
        # listas tienen que coincidir, o el VPS rechaza el envío entero, ver
        # ese fichero — y por último cargar el valor como "environment
        # secret" en GitHub, Settings → Environments → produccion). Cubre
        # hoy las credenciales de integraciones externas y el valor de
        # arranque del administrador inicial — no todo lo que admite `.env`
        # (DOMINIO, ACME_EMAIL y demás configuración no sensible se sigue
        # gestionando a mano, igual que antes).
        #
        # POSTGRES_PASSWORD y ConnectionStrings__CaeManagerDbRuntime NO están
        # aquí a propósito (hallazgo de la revisión de Codex): son
        # contraseñas de un ROL de PostgreSQL, y este paso solo sabe escribir
        # `.env`, nunca ejecuta el `ALTER ROLE` que las hace efectivas de
        # verdad — ver el comentario largo en ci-deploy.sh, junto a
        # CLAVES_PERMITIDAS_SECRETOS_PRODUCCION, sobre por qué rotarlas así
        # deja el stack sirviendo con una contraseña que PostgreSQL rechaza.
        env:
          SEC_ADMINISTRADOR_INICIAL_CONTRASENA: ${{ secrets.AdministradorInicial__Contrasena }}
          SEC_ANTHROPIC_APIKEY: ${{ secrets.Anthropic__ApiKey }}
          SEC_SMTP_CONTRASENA: ${{ secrets.Smtp__Contrasena }}
          SEC_AZUREAD_CLIENTSECRET: ${{ secrets.AzureAd__ClientSecret }}
          SEC_MICROSOFT365_CLIENTSECRET: ${{ secrets.Integraciones__Microsoft365__ClientSecret }}
          SEC_WHATSAPP_APPSECRET: ${{ secrets.Integraciones__WhatsApp__AppSecret }}
          SEC_WHATSAPP_VERIFYTOKEN: ${{ secrets.Integraciones__WhatsApp__VerifyToken }}
          SEC_SEQ_APIKEY: ${{ secrets.Serilog__Seq__ApiKey }}
          SEC_STRIPE_APIKEY: ${{ secrets.Stripe__ApiKey }}
          SEC_STRIPE_WEBHOOKSECRET: ${{ secrets.Stripe__WebhookSecret }}
        run: |
          set -euo pipefail

          BLOB=""
          agregar() {
            local nombre="$1" valor="$2"
            if [ -n "$valor" ]; then
              case "$valor" in
                *$'\n'*)
                  echo "::error::el secreto $nombre trae un salto de línea — este mecanismo solo admite valores de una sola línea (formato KEY=VALOR en .env)"
                  exit 1
                  ;;
              esac
              # $'\n' explícito, nunca un salto de línea literal en el
              # fuente: dentro de un bloque YAML `run: |`, un salto de línea
              # "de verdad" aquí arrastraría la indentación de la línea
              # siguiente como espacios literales dentro de BLOB, y esos
              # espacios delante de la próxima clave le rompen a awk el
              # patrón `^[A-Za-z_][A-Za-z0-9_]*=` — la clave deja de
              # reconocerse, su valor no se actualiza, y queda una línea
              # basura al final del .env. Verificado con
              # deploy/ci-deploy-secretos.tests.sh.
              BLOB="${BLOB}${nombre}=${valor}"$'\n'
            fi
          }
          agregar "AdministradorInicial__Contrasena" "$SEC_ADMINISTRADOR_INICIAL_CONTRASENA"
          agregar "Anthropic__ApiKey" "$SEC_ANTHROPIC_APIKEY"
          agregar "Smtp__Contrasena" "$SEC_SMTP_CONTRASENA"
          agregar "AzureAd__ClientSecret" "$SEC_AZUREAD_CLIENTSECRET"
          agregar "Integraciones__Microsoft365__ClientSecret" "$SEC_MICROSOFT365_CLIENTSECRET"
          agregar "Integraciones__WhatsApp__AppSecret" "$SEC_WHATSAPP_APPSECRET"
          agregar "Integraciones__WhatsApp__VerifyToken" "$SEC_WHATSAPP_VERIFYTOKEN"
          agregar "Serilog__Seq__ApiKey" "$SEC_SEQ_APIKEY"
          agregar "Stripe__ApiKey" "$SEC_STRIPE_APIKEY"
          agregar "Stripe__WebhookSecret" "$SEC_STRIPE_WEBHOOKSECRET"

          # LIMITACIÓN CONOCIDA compartida con ci-deploy.sh (ver su cabecera,
          # "un cambio a ESTE fichero tarda un despliegue en surtir efecto"):
          # el PRIMER despliegue a producción después de fusionar este PR
          # todavía ejecuta, en el VPS, la copia de ci-deploy.sh de ANTES de
          # este cambio — que no reconoce "secretos" y rechaza el comando con
          # "Entorno no permitido". Sin este `if`, ese rechazo esperado
          # tumbaría "aprobacion-produccion" y, con él, bloquearía TODO
          # despliegue a producción (needs: aprobacion-produccion) hasta el
          # siguiente. Se trata como aviso, no como fallo — cualquier OTRO
          # error (SSH, fallo real de actualizar_secretos_produccion en una
          # copia ya actualizada) sigue haciendo fallar el job.
          SALIDA="$(ssh -i ~/.ssh/id_ed25519 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "root@$VPS_HOST" "secretos" <<< "$BLOB" 2>&1)" && ESTADO=0 || ESTADO=$?
          printf '%s\n' "$SALIDA"
          if [ "$ESTADO" -ne 0 ]; then
            if printf '%s' "$SALIDA" | grep -qF "Entorno no permitido: 'secretos'"; then
              echo "::warning::el VPS todavía corre la copia de ci-deploy.sh anterior a REC-014/P37 y no reconoce 'secretos' — se actualizará sola en el próximo despliegue que traiga este cambio a /opt/talveg. No se ha escrito ningún secreto en este run; .env sigue como estaba."
            else
              echo "::error::fallo real al actualizar secretos de producción — ver la salida de arriba"
              exit 1
            fi
          fi

  produccion:
    name: Desplegar a producción
    needs: aprobacion-produccion
    runs-on: ubuntu-latest
    # D6: el environment da acceso a VPS_SSH_KEY_PRODUCCION y pide una SEGUNDA
    # aprobación por despliegue (ver "Cambio D6" en la cabecera).
    environment: produccion
    # Grupo propio, distinto al de la aprobación — y es lo que de verdad
    # importa aquí: si dos despliegues aprobados quedaran encolados a la
    # vez, esta cola evita que ambos ejecuten `docker compose up` sobre el
    # mismo VPS en paralelo, y ninguno de los dos se cancela nunca solo.
    concurrency:
      group: deploy-produccion
      cancel-in-progress: false
    steps:
      - name: Preparar clave SSH
        # D6: misma clave que `aprobacion-produccion` (`--clave produccion`
        # en authorized_keys), legible aquí por declarar este job
        # `environment: produccion`. Mientras VPS_SSH_KEY_PRODUCCION no exista
        # se usa la clave antigua, para no cortar el despliegue.
        env:
          CLAVE_NUEVA: ${{ secrets.VPS_SSH_KEY_PRODUCCION }}
          CLAVE_ANTIGUA: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          if [ -n "$CLAVE_NUEVA" ]; then
            printf '%s\n' "$CLAVE_NUEVA" > ~/.ssh/id_ed25519
            echo "Clave SSH usada: VPS_SSH_KEY_PRODUCCION"
          else
            printf '%s\n' "$CLAVE_ANTIGUA" > ~/.ssh/id_ed25519
            echo "::warning::VPS_SSH_KEY_PRODUCCION no está cargado: se usa VPS_SSH_KEY (transición D6, ver RUNBOOK-CLAVES-SSH-D6-P32)"
          fi
          # Clave de host FIJADA, no aprendida. `ssh-keyscan` en cada ejecucion
          # confia en la primera clave que le contesten: si alguien se interpone
          # una sola vez, el despliegue le entrega la sesion sin distinguirlo de
          # una rotacion legitima. Fijada aqui, un cambio de clave rompe el
          # despliegue y obliga a mirar, que es lo que debe pasar.
          echo "$VPS_HOST_KEY" >> ~/.ssh/known_hosts

      - name: Descargar la imagen firmada
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: imagen-despliegue
          path: imagen-despliegue

      - name: Desplegar SHA exacto a producción
        # Misma imagen que staging (artefacto de este run), mismo formato de stdin.
        run: |
          set -euo pipefail
          echo "Desplegando a produccion el commit $SHA_DESPLEGADO"
          {
            base64 -w0 imagen-despliegue/imagen.sigstore.json; echo
            base64 -w0 imagen-despliegue/imagen.manifiesto; echo
            cat imagen-despliegue/imagen.tar.gz
          } | ssh -i ~/.ssh/id_ed25519 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "root@$VPS_HOST" "produccion $SHA_DESPLEGADO"
