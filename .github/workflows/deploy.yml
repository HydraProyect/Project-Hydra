name: Desplegar

# --- Qué dispara este workflow, y por qué así -------------------------------
#
# Staging se despliega cuando el workflow `CI` TERMINA EN VERDE sobre un
# commit de `main` — no en cuanto el commit llega a `main`. La diferencia
# importa: son dos momentos distintos, y entre ellos cabe un CI en rojo.
#
# Hasta el 2026-09-02 este workflow disparaba en `push: branches: [main]` y su
# cabecera lo justificaba diciendo que el commit "ya superó CI" porque la
# protección de rama exigía estar al día Y en verde para poder mergear. Esa
# regla se retiró el 2026-08-29 al adoptar la cola de merge (CLAUDE.md § 22):
# la cola prueba el RESULTADO YA FUSIONADO, que es lo correcto para decidir el
# merge, pero nadie volvía a mirar el CI que corre sobre `main` DESPUÉS del
# merge. Caso real (`bced727a`): la cola dejó pasar el merge, staging se
# desplegó, y el CI de `main` salió en rojo a continuación. El gate que
# faltaba no es "antes de mergear" — es "antes de desplegar lo ya mergeado".
#
# Por eso el disparador es `workflow_run` sobre el workflow `CI`:
#
#   - `types: [completed]` recibe TODA terminación de CI, verde o no. El job
#     `staging` es el que filtra por la conclusión. Un CI en rojo crea
#     igualmente un run de `Desplegar`, pero con todos sus jobs omitidos — y
#     como `aprobacion-produccion` depende de `staging`, tampoco deja una
#     aprobación de producción pendiente que alguien pueda aprobar por error.
#   - `branches: [main]` filtra por el NOMBRE de la rama en la que corrió CI.
#     Deja fuera los runs de `pull_request` de este repositorio (rama
#     `claude/**`) y los de la cola de merge (rama
#     `gh-readonly-queue/main/...`) — comprobado sobre los runs reales, no
#     supuesto. Lo que NO deja fuera es una PR desde la rama `main` de un
#     fork, que también lleva `head_branch` = `main`: de eso se encarga la
#     condición `workflow_run.event == 'push'` del job `staging`. Ver allí.
#   - Un CI de `main` CANCELADO no despliega. Ocurre de forma rutinaria: CI
#     cancela su propio run en curso sobre `main` cuando llega un merge más
#     nuevo. No se pierde nada — el commit nuevo contiene al viejo, y es ese
#     el que se despliega cuando su CI termina en verde.
#
# CONSECUENCIA NUEVA, que el disparador anterior no tenía: REEJECUTAR un run
# de CI antiguo de `main` vuelve a emitir `completed`, y si sale verde
# despliega SU commit. Es decir, reejecutar el CI de un commit ya superado
# devuelve staging a ese commit. No hay forma de distinguir esa reejecución de
# la de la punta actual —que sí queremos que despliegue, por ejemplo tras un
# rojo de infraestructura—, así que no se filtra por número de intento. Si
# ocurre, la salida es reejecutar el CI del commit más nuevo de `main`, o
# lanzar este workflow a mano. Y ojo con la concurrencia: el grupo
# `deploy-staging` solo guarda UN despliegue en espera, así que un despliegue
# que llegue a la cola desplaza al que estuviera esperando (nunca al que ya
# está corriendo, que es lo que protege `cancel-in-progress: false`).
#
# CUIDADO al cambiar este disparador: `workflow_run` solo funciona si el
# fichero está en la rama por defecto. Un cambio aquí no surte efecto hasta
# que la PR se mergea, y no se puede probar desde la rama.
#
# --- Qué SHA se despliega ---------------------------------------------------
#
# `SHA_DESPLEGADO` (más abajo), NUNCA `github.sha` a secas. Bajo
# `workflow_run`, `github.sha` es "el último commit de la rama por defecto" en
# el momento del evento, no el commit que superó CI: si `main` avanzó entre
# medias, son commits distintos. Usarlo reintroduciría por otra vía el
# incidente del 2026-08-26 (un job aprobado para el commit X terminando por
# desplegar el commit Y). Por la vía manual (`workflow_dispatch`) no hay run
# de CI del que leer nada, así que ahí sí se usa `github.sha`: el SHA de la
# referencia que se eligió al lanzarlo.
#
# El idiom `condición && valor || alternativa` devuelve `valor` solo si
# `valor` es truthy; una cadena vacía no lo es. Un `head_sha` vacío daría
# entonces `github.sha`, o sea la punta de `main`: el comportamiento anterior
# a este cambio, degradado pero no peligroso. Y si aun así llegara vacío al
# VPS, resolve-deploy-sha.sh exige 40 hexadecimales y rechaza cualquier otra
# cosa — el fallo es cerrado y ruidoso, nunca un despliegue silencioso de algo
# equivocado.
#
# CONSECUENCIA AL LEER LA LISTA DE RUNS: la interfaz atribuye cada run de
# `Desplegar` a la punta de `main`, porque eso es lo que vale `github.sha`
# bajo `workflow_run`. El SHA realmente desplegado está en el log del job
# ("Desplegar SHA exacto a ..."). No deduzcas qué se desplegó del encabezado
# del run.
#
# --- Producción -------------------------------------------------------------
#
# Producción entra en el mismo run que staging, pero su job usa
# `environment: produccion`, que en la configuración del repo exige aprobación
# manual de un revisor antes de ejecutar un solo paso (ver Settings →
# Environments → produccion). El job queda en pausa ("Waiting") hasta que se
# aprueba o se rechaza — nunca corre solo. Con el gate de CI de arriba, ahora
# además esa aprobación solo llega a existir si CI está verde.
#
# workflow_dispatch se conserva como vía alternativa (por ejemplo para forzar
# un redeploy sin un push nuevo) — pasa por el mismo gate del entorno.
#
# --- La clave SSH -----------------------------------------------------------
#
# La clave SSH (secrets.VPS_SSH_KEY) es de un par dedicado, restringido en el
# propio VPS (ver /root/.ssh/authorized_keys, entrada con "command=") a solo
# poder ejecutar /opt/talveg/deploy/ci-deploy.sh — ese script decide, por el
# primer token recibido ("staging" o "produccion"), cuál de los dos stacks
# reconstruye, y usa el segundo token (el SHA) para fijar exactamente qué
# commit despliega (ver deploy/resolve-deploy-sha.sh). Aunque este secreto se
# filtrara, no da una shell libre en el VPS: como mucho, permite forzar el
# redeploy de un commit que ya sea ancestro real de main en GitHub.
#
# --- Por qué producción depende de staging, y por qué son dos jobs ----------
#
# `aprobacion-produccion` depende de `staging` (needs:) por una razón que no
# es de orden de despliegue sino de disco: los dos `docker-compose.*.yml`
# compilan con `build: context: ../..`, es decir, ambos entornos comparten EL
# MISMO checkout git en /opt/talveg. Sin este `needs:`, GitHub podría arrancar
# ambos jobs a la vez (si la aprobación de producción llegara rápido) y sus
# dos `git checkout --detach <sha>` + `docker compose build` competirían por
# el mismo árbol de ficheros en disco — pisándose entre sí y pudiendo acabar
# construyendo cualquiera de los dos con el SHA equivocado, precisamente lo
# que el SHA determinista de arriba quiere evitar. `needs: staging` fuerza a
# que el build de staging termine (éxito o fallo) antes de que producción
# empiece siquiera a esperar aprobación.
#
# La aprobación (`environment: produccion`) vive en un job propio,
# `aprobacion-produccion`, separado del job que ejecuta el despliegue real
# (`produccion`, más abajo). Son dos grupos de concurrencia distintos, y esa
# separación es la que evita la cola interminable de aprobaciones obsoletas
# (incidente real, 2026-08-30: cada push a main dejaba su propia aprobación
# pendiente sin que nadie la revisara, y solo se vaciaban rechazándolas una a
# una a mano — 6 commits obsoletos acumulados antes de vaciar la cola):
#
#   - `aprobacion-produccion` usa cancel-in-progress: true. En cuanto llega
#     un despliegue más nuevo, GitHub cancela solo la aprobación pendiente
#     del anterior si nadie llegó a revisarla — ya no hace falta rechazarla
#     a mano para que la cola no crezca sin límite.
#   - `deploy-produccion` (el job `produccion`) sigue con
#     cancel-in-progress: false, exactamente como antes. Vive en un grupo
#     distinto a propósito: la cancelación automática de arriba nunca debe
#     alcanzar a un despliegue que YA fue aprobado y está corriendo el `ssh`
#     contra el VPS — interrumpirlo a medias sigue siendo tan peligroso como
#     siempre (build o `docker compose up` a medio terminar), así que ese job
#     sigue serializándose, nunca cancelándose solo.
#
# En resumen: solo se cancela sola una aprobación que TODAVÍA no se dio. Una
# vez aprobado, un despliegue corre siempre hasta el final.
#
# --- Permisos del GITHUB_TOKEN (2026-09-03, DEC-39 / REC-120) ---------------
#
# `permissions: {}` a nivel de workflow: el `GITHUB_TOKEN` sale sin ningún
# permiso. Medido línea a línea antes de fijarlo (evidencia en el handoff
# HO-120-01): este workflow no usa `actions/checkout`, no llama a la API de
# GitHub con `gh` ni con `actions/github-script`, y su único secreto es
# `secrets.VPS_SSH_KEY` — que no es el `GITHUB_TOKEN` y no depende de
# `permissions:`. La comprobación de la punta de `main` (más abajo) tampoco
# lo necesita: usa `git ls-remote` anónimo por HTTPS, válido porque el
# repositorio es público — mide estrictamente menos privilegio que pedir
# `contents: read` por la API de GitHub, que sí habría exigido conceder ese
# scope a un job (fuente: docs.github.com, "Using jobs" → "Assigning
# permissions to jobs", consultado 2026-09-03: "As a good security practice,
# you should grant the GITHUB_TOKEN the least required access"). Por eso
# ningún job de este fichero declara `permissions:` propio: no hace falta
# ninguno.
#
# --- Vía manual como break-glass explícito (2026-09-03, DEC-40 / REC-121) ---
#
# `workflow_dispatch` ya no dispara el despliegue con solo pulsar "Run
# workflow": exige dos `inputs` (docs.github.com, "Events that trigger
# workflows" → `workflow_dispatch`, consultado 2026-09-03), `confirmar` (debe
# coincidir EXACTAMENTE con "DESPLIEGO SIN GATE DE CI") y `motivo`
# (obligatorio). El primer paso del job `staging` los valida antes de tocar
# la clave SSH; si la confirmación no coincide o el motivo llega vacío
# (`required: true` obliga a que la API reciba el input, pero la
# documentación no garantiza que rechace una cadena vacía), el job falla sin
# desplegar nada — y como `aprobacion-produccion` depende de `staging`
# (`needs:`), tampoco queda ninguna aprobación de producción pendiente. Si la
# validación pasa, el paso escribe "BREAK-GLASS: actor, SHA, motivo" en el
# log (`::warning::`) y en `GITHUB_STEP_SUMMARY`, para que quede visible que
# este despliegue se hizo sin pasar por el gate de CI — nunca de forma
# silenciosa. Esto NO convierte la vía manual en el flujo normal (DEC-40,
# punto 7): sigue siendo un rodeo deliberado, operado por una persona que
# confirma explícitamente que lo es. `confirmar` y `motivo` se leen a través
# de `env:` en el paso, no interpolados directamente dentro de `${{ }}` en
# medio de `run:` — evita que un input con metacaracteres de shell (backticks,
# `$()`, etc.) se ejecute en el runner.
#
# --- Rechazo de runs obsoletos (2026-09-03, DEC-41 / REC-122) ---------------
#
# Antes de desplegar por la vía automática (`workflow_run`), un paso
# comprueba que `SHA_DESPLEGADO` sigue siendo la punta vigente de `main`
# (`git ls-remote` sobre el repositorio, sin autenticar). Si `main` avanzó
# desde que ese CI corrió — el caso típico es reejecutar ("rerun") un run de
# CI antiguo, ver "CONSECUENCIA NUEVA" arriba — el paso falla con "run
# obsoleto para despliegue" en el log y en el resumen, y no llega a tocar la
# clave SSH. Por el mismo mecanismo de `needs:` de arriba, tampoco queda
# aprobación de producción pendiente.
#
# Esta comprobación vive en el WORKFLOW, no en `resolve-deploy-sha.sh`: al
# guion lo invocan tanto la vía automática como el break-glass manual, y no
# distingue entre ambas — meterla ahí bloquearía también un rollback
# intencional hecho a propósito por la vía manual (DEC-41: "debe hacerse
# mediante la vía manual explícita... no como efecto secundario de pulsar
# rerun"). Por eso el paso solo corre `if: github.event_name == 'workflow_run'`
# y nunca se aplica a `workflow_dispatch`.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe exactamente: DESPLIEGO SIN GATE DE CI'
        required: true
        type: string
      motivo:
        description: 'Motivo del despliegue manual (obligatorio, break-glass)'
        required: true
        type: string

# Sin ningún permiso para el GITHUB_TOKEN: ver "Permisos del GITHUB_TOKEN" en
# la cabecera. Ningún job de este workflow necesita ninguno.
permissions: {}

env:
  VPS_HOST: 2.29.9.79
  # Clave publica del host. No es un secreto: identifica al servidor, no da
  # acceso. Vive versionada a proposito, para que cambiarla deje rastro.
  VPS_HOST_KEY: "2.29.9.79 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJdktXchT+yIjLV+Z7181+W+Sv7cnTuzk3hC8QwU7DsW"
  # El commit que se despliega. Ver "Qué SHA se despliega" en la cabecera:
  # bajo `workflow_run` es el commit que superó CI, no la punta de `main`.
  SHA_DESPLEGADO: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  staging:
    # EL GATE. Solo despliega si el CI que acaba de terminar terminó en verde
    # Y corrió sobre un `push` a `main`. `failure`, `cancelled`, `timed_out`,
    # `skipped` y `action_required` omiten el job — y con él, toda la cadena
    # hacia producción, que cuelga de este `needs:`.
    #
    # Las DOS condiciones hacen falta. `branches: [main]` de arriba compara el
    # NOMBRE de la rama en la que corrió CI, no el evento: este repositorio es
    # público, así que cualquiera puede abrir una PR desde la rama `main` de
    # su fork, y el run de CI de esa PR lleva `head_branch` = `main`. Sin
    # `workflow_run.event == 'push'`, ese run verde activaría este workflow,
    # que sí tiene acceso a `secrets.VPS_SSH_KEY` aunque el de la PR no lo
    # tuviera — el riesgo clásico de `workflow_run`. No llegaría a desplegar
    # nada (resolve-deploy-sha.sh rechaza un SHA que no sea ancestro real de
    # `origin/main`), pero bastaría para hacer que el workflow contacte con el
    # VPS y compita por el grupo `deploy-staging`. Exigir `push` cierra ese
    # camino entero: un run de CI por `push` a `main` solo puede venir de un
    # push a la `main` de ESTE repositorio.
    #
    # La vía manual se conserva aparte: en `workflow_dispatch` no hay run de
    # CI del que leer una conclusión, y bloquearla dejaría sin forma de forzar
    # un redeploy ni de probar el mecanismo de despliegue. Es, a propósito, un
    # rodeo del gate operado por una persona: quien lanza el workflow a mano
    # despliega la punta de la referencia que elija, tenga esa punta el CI en
    # verde, en rojo o todavía corriendo. Comprobar CI también ahí es una
    # decisión de producto pendiente, no un olvido — hoy la vía manual existe
    # justamente para los casos en que el camino automático no sirve.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success')
    name: Desplegar a staging
    runs-on: ubuntu-latest
    # Concurrencia por entorno, no por workflow entero: dos deploys de
    # staging no deben chocar entre sí (causa real del run #47, dos runs
    # desplegando staging a la vez), pero staging tampoco debe quedar
    # bloqueado detrás de una aprobación de producción pendiente durante
    # horas — son colas independientes.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Break-glass — validar confirmación manual
        # Ver "Vía manual como break-glass explícito" en la cabecera.
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
          MOTIVO: ${{ inputs.motivo }}
        run: |
          set -euo pipefail
          ESPERADO="DESPLIEGO SIN GATE DE CI"
          if [ "$CONFIRMAR" != "$ESPERADO" ]; then
            echo "::error::confirmación incorrecta — debes escribir exactamente: $ESPERADO"
            {
              echo "### 🛑 Despliegue manual rechazado"
              echo ""
              echo "La confirmación no coincide con el texto exigido."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -z "$MOTIVO" ]; then
            echo "::error::el motivo es obligatorio para el despliegue manual"
            {
              echo "### 🛑 Despliegue manual rechazado"
              echo ""
              echo "Falta el motivo."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Motivo de una sola línea antes de escribirlo en el log o el
          # resumen: un salto de línea dentro del input permitiría falsificar
          # una línea de log de Actions (p. ej. un `::error::` o `::warning::`
          # posterior no emitido de verdad por este paso). Quien dispara
          # workflow_dispatch ya necesita acceso de escritura al repositorio,
          # así que esto no es una escalada de privilegio — es higiene del
          # registro de auditoría que DEC-40 exige (actor, SHA, motivo).
          MOTIVO="$(printf '%s' "$MOTIVO" | tr '\n\r' '  ')"
          echo "::warning::BREAK-GLASS — actor=$GITHUB_ACTOR sha=$SHA_DESPLEGADO motivo=$MOTIVO"
          {
            echo "### ⚠️ BREAK-GLASS: despliegue manual sin gate de CI"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Actor | $GITHUB_ACTOR |"
            echo "| SHA | \`$SHA_DESPLEGADO\` |"
            echo "| Motivo | $MOTIVO |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comprobar que el SHA sigue siendo la punta de main
        # Ver "Rechazo de runs obsoletos" en la cabecera. Solo aplica a la vía
        # automática: el break-glass manual puede desplegar deliberadamente un
        # SHA que ya no sea la punta (rollback intencional, DEC-41).
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          PUNTA_ACTUAL="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ "$PUNTA_ACTUAL" != "$SHA_DESPLEGADO" ]; then
            echo "::error::run obsoleto para despliegue — $SHA_DESPLEGADO ya no es la punta de main ($PUNTA_ACTUAL)"
            {
              echo "### 🛑 Despliegue omitido: run obsoleto"
              echo ""
              echo "El commit de este run (\`$SHA_DESPLEGADO\`) ya no es la punta de \`main\`"
              echo "(\`$PUNTA_ACTUAL\`). Esto ocurre al reejecutar (rerun) un CI antiguo:"
              echo "main avanzó mientras tanto. No se despliega."
              echo ""
              echo "Para desplegar este commit de todas formas, usa la vía manual"
              echo "(workflow_dispatch) — break-glass explícito, con motivo."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Punta de main confirmada: $SHA_DESPLEGADO"

      - name: Preparar clave SSH
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          # Clave de host FIJADA, no aprendida. `ssh-keyscan` en cada ejecucion
          # confia en la primera clave que le contesten: si alguien se interpone
          # una sola vez, el despliegue le entrega la sesion sin distinguirlo de
          # una rotacion legitima. Fijada aqui, un cambio de clave rompe el
          # despliegue y obliga a mirar, que es lo que debe pasar.
          echo "$VPS_HOST_KEY" >> ~/.ssh/known_hosts

      - name: Desplegar SHA exacto a staging
        run: |
          echo "Desplegando a staging el commit $SHA_DESPLEGADO"
          ssh -i ~/.ssh/id_ed25519 "root@$VPS_HOST" "staging $SHA_DESPLEGADO"

  aprobacion-produccion:
    name: Aprobar despliegue a producción
    needs: staging
    runs-on: ubuntu-latest
    environment: produccion
    # cancel-in-progress: true a propósito — ver el comentario de arriba.
    # Este job no toca el VPS, solo espera al revisor; cancelarlo a medias
    # no deja nada a medio construir.
    concurrency:
      group: aprobacion-produccion
      cancel-in-progress: true
    steps:
      - name: Aprobado
        run: echo "Despliegue a produccion aprobado para $SHA_DESPLEGADO"

  produccion:
    name: Desplegar a producción
    needs: aprobacion-produccion
    runs-on: ubuntu-latest
    # Grupo propio, distinto al de la aprobación — y es lo que de verdad
    # importa aquí: si dos despliegues aprobados quedaran encolados a la
    # vez, esta cola evita que ambos ejecuten `docker compose up` sobre el
    # mismo VPS en paralelo, y ninguno de los dos se cancela nunca solo.
    concurrency:
      group: deploy-produccion
      cancel-in-progress: false
    steps:
      - name: Preparar clave SSH
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          # Clave de host FIJADA, no aprendida. `ssh-keyscan` en cada ejecucion
          # confia en la primera clave que le contesten: si alguien se interpone
          # una sola vez, el despliegue le entrega la sesion sin distinguirlo de
          # una rotacion legitima. Fijada aqui, un cambio de clave rompe el
          # despliegue y obliga a mirar, que es lo que debe pasar.
          echo "$VPS_HOST_KEY" >> ~/.ssh/known_hosts

      - name: Desplegar SHA exacto a producción
        run: |
          echo "Desplegando a produccion el commit $SHA_DESPLEGADO"
          ssh -i ~/.ssh/id_ed25519 "root@$VPS_HOST" "produccion $SHA_DESPLEGADO"
