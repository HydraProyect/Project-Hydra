name: Desplegar

# Staging se despliega solo en cuanto algo llega a main — para cuando eso
# pasa, el commit ya superó CI (required_status_checks.strict exige que la
# rama esté al día Y en verde antes de poder mergear), así que no hace falta
# volver a esperar aquí. Esto recupera el "cada push queda visible en un
# entorno real" que antes daba Railway automáticamente.
#
# Producción SÍ se dispara en cuanto algo llega a main (2026-08-24, antes era
# workflow_dispatch puro) — pero el job usa `environment: produccion`, que en
# la configuración del repo exige aprobación manual de un revisor antes de
# ejecutar un solo paso (ver Settings → Environments → produccion). Es el
# mismo principio que antes ("decidir el momento después de probar en
# staging"), con menos fricción: un click de aprobar en vez de recordar el
# comando workflow_dispatch y la cadena de confirmación. El job queda en
# pausa ("Waiting") hasta que se aprueba o se rechaza — nunca corre solo.
#
# workflow_dispatch se conserva como vía alternativa (por ejemplo para forzar
# un redeploy sin un push nuevo) — pasa por el mismo gate del entorno.
#
# La clave SSH (secrets.VPS_SSH_KEY) es de un par dedicado, restringido en el
# propio VPS (ver /root/.ssh/authorized_keys, entrada con "command=") a solo
# poder ejecutar /opt/talveg/deploy/ci-deploy.sh — ese script decide, por el
# primer token recibido ("staging" o "produccion"), cuál de los dos stacks
# reconstruye, y usa el segundo token (el SHA) para fijar exactamente qué
# commit despliega (ver deploy/resolve-deploy-sha.sh). Aunque este secreto se
# filtrara, no da una shell libre en el VPS: como mucho, permite forzar el
# redeploy de un commit que ya sea ancestro real de main en GitHub.
#
# El SHA que se pasa es `github.sha`: el commit exacto que disparó ESTE job,
# no "lo que haya en main cuando el comando llegue a ejecutarse". Esto
# importa especialmente para producción, cuya aprobación manual puede tardar
# horas — sin fijar el SHA, un job aprobado para el commit X podía terminar
# desplegando el commit Y si main avanzó mientras se esperaba la aprobación
# (incidente real, 2026-08-26).
#
# `produccion` depende de `staging` (needs:) por una razón que no es de
# orden de despliegue sino de disco: los dos `docker-compose.*.yml` compilan
# con `build: context: ../..`, es decir, ambos entornos comparten EL MISMO
# checkout git en /opt/talveg. Sin este `needs:`, GitHub podría arrancar
# ambos jobs a la vez (si la aprobación de producción llegara rápido) y sus
# dos `git checkout --detach <sha>` + `docker compose build` competirían por
# el mismo árbol de ficheros en disco — pisándose entre sí y pudiendo acabar
# construyendo cualquiera de los dos con el SHA equivocado, precisamente lo
# que el SHA determinista de arriba quiere evitar. `needs: staging` fuerza a
# que el build de staging termine (éxito o fallo) antes de que producción
# empiece siquiera a esperar aprobación.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VPS_HOST: 2.29.9.79
  # Clave publica del host. No es un secreto: identifica al servidor, no da
  # acceso. Vive versionada a proposito, para que cambiarla deje rastro.
  VPS_HOST_KEY: "2.29.9.79 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJdktXchT+yIjLV+Z7181+W+Sv7cnTuzk3hC8QwU7DsW"

jobs:
  staging:
    # workflow_dispatch también dispara staging (antes solo push) — hace
    # falta una vía manual para probar el mecanismo de despliegue (SHA
    # determinista, etc.) sin esperar a un push real ni tocar producción.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Desplegar a staging
    runs-on: ubuntu-latest
    # Concurrencia por entorno, no por workflow entero: dos deploys de
    # staging no deben chocar entre sí (causa real del run #47, dos runs
    # desplegando staging a la vez), pero staging tampoco debe quedar
    # bloqueado detrás de una aprobación de producción pendiente durante
    # horas — son colas independientes.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Preparar clave SSH
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          # Clave de host FIJADA, no aprendida. `ssh-keyscan` en cada ejecucion
          # confia en la primera clave que le contesten: si alguien se interpone
          # una sola vez, el despliegue le entrega la sesion sin distinguirlo de
          # una rotacion legitima. Fijada aqui, un cambio de clave rompe el
          # despliegue y obliga a mirar, que es lo que debe pasar.
          echo "$VPS_HOST_KEY" >> ~/.ssh/known_hosts

      - name: Desplegar SHA exacto a staging
        run: ssh -i ~/.ssh/id_ed25519 "root@$VPS_HOST" "staging ${{ github.sha }}"

  produccion:
    name: Desplegar a producción
    needs: staging
    runs-on: ubuntu-latest
    environment: produccion
    # Grupo propio, igual que staging — y es lo que de verdad importa aquí:
    # si dos aprobaciones de producción quedaran pendientes a la vez, esta
    # cola evita que ambas ejecuten `docker compose up` sobre el mismo VPS
    # en paralelo cuando se aprueben.
    concurrency:
      group: deploy-produccion
      cancel-in-progress: false
    steps:
      - name: Preparar clave SSH
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          # Clave de host FIJADA, no aprendida. `ssh-keyscan` en cada ejecucion
          # confia en la primera clave que le contesten: si alguien se interpone
          # una sola vez, el despliegue le entrega la sesion sin distinguirlo de
          # una rotacion legitima. Fijada aqui, un cambio de clave rompe el
          # despliegue y obliga a mirar, que es lo que debe pasar.
          echo "$VPS_HOST_KEY" >> ~/.ssh/known_hosts

      - name: Desplegar SHA exacto a producción
        run: ssh -i ~/.ssh/id_ed25519 "root@$VPS_HOST" "produccion ${{ github.sha }}"
