name: Desplegar

# Staging se despliega solo en cuanto algo llega a main — para cuando eso
# pasa, el commit ya superó CI (required_status_checks.strict exige que la
# rama esté al día Y en verde antes de poder mergear), así que no hace falta
# volver a esperar aquí. Esto recupera el "cada push queda visible en un
# entorno real" que antes daba Railway automáticamente.
#
# Producción SÍ se dispara en cuanto algo llega a main (2026-08-24, antes era
# workflow_dispatch puro) — pero el job usa `environment: produccion`, que en
# la configuración del repo exige aprobación manual de un revisor antes de
# ejecutar un solo paso (ver Settings → Environments → produccion). Es el
# mismo principio que antes ("decidir el momento después de probar en
# staging"), con menos fricción: un click de aprobar en vez de recordar el
# comando workflow_dispatch y la cadena de confirmación. El job queda en
# pausa ("Waiting") hasta que se aprueba o se rechaza — nunca corre solo.
#
# workflow_dispatch se conserva como vía alternativa (por ejemplo para forzar
# un redeploy sin un push nuevo) — pasa por el mismo gate del entorno.
#
# La clave SSH (secrets.VPS_SSH_KEY) es de un par dedicado, restringido en el
# propio VPS (ver /root/.ssh/authorized_keys, entrada con "command=") a solo
# poder ejecutar /opt/talveg/deploy/ci-deploy.sh — ese script decide, por el
# comando recibido ("staging" o "produccion"), cuál de los dos stacks
# reconstruye. Aunque este secreto se filtrara, no da una shell libre en el
# VPS: como mucho, permite forzar un redeploy desde el main real de GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Sin esto, dos push a main en poco tiempo (o un push + un workflow_dispatch
# manual) disparan dos ejecuciones de este workflow en paralelo, y ambas
# corren `docker compose up --build` contra el mismo VPS al mismo tiempo:
# una gana, la otra falla con "container name already in use" al chocar con
# los contenedores que la primera ya está recreando (visto en el run #47,
# 2026-08-26). `cancel-in-progress: false` es deliberado: un despliegue en
# marcha nunca debe cancelarse a mitad de `docker compose up` — eso dejaría
# el stack a medio reconstruir. La segunda ejecución debe esperar a que la
# primera termine, no interrumpirla.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  VPS_HOST: 2.29.9.79

jobs:
  staging:
    if: github.event_name == 'push'
    name: Desplegar a staging
    runs-on: ubuntu-latest
    steps:
      - name: Preparar clave SSH
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: git pull + docker compose up --build (staging)
        run: ssh -i ~/.ssh/id_ed25519 "root@$VPS_HOST" staging

  produccion:
    name: Desplegar a producción
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Preparar clave SSH
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: git pull + docker compose up --build (producción)
        run: ssh -i ~/.ssh/id_ed25519 "root@$VPS_HOST" produccion
