name: Gobernanza de PR

# WORKFLOW APARTE, no job aparte dentro de ci.yml — decisión deliberada
# (DEC-66, cierra REC-140 y REC-162 juntos por orden expresa del propietario).
#
# El `on:` de GitHub Actions pertenece al WORKFLOW, no al job: un job de
# gobernanza dentro de ci.yml seguiría heredando el disparador global de ese
# fichero (`opened`, `synchronize`, `reopened` para pull_request) y no
# resolvería el defecto de REC-140. Ampliar ESE disparador para que
# reaccionase a `labeled`/`milestoned` despertaría los 17 jobs de ci.yml ante
# cada cambio puramente administrativo de metadatos — exactamente la opción
# que el propietario descartó. Un fichero de workflow separado tiene su
# propio `on:`, así que revalidarse ante un cambio de milestone o etiqueta no
# toca ci.yml en absoluto (medido y demostrado en HO-140-01 § 9).
on:
  # REC-213 (turno 2026-09-18, T4): `gobernanza-pr` usa `pull_request_target`,
  # no `pull_request`. Para el evento `pull_request`, GitHub resuelve el
  # WORKFLOW YAML del commit de MERGE de la PR — una PR podía editar este
  # mismo fichero (quitar un paso, desactivar el job) y evaluarse con su
  # propia versión, sin tocar siquiera el guion. `pull_request_target` lee el
  # YAML de la rama POR DEFECTO del repositorio (2ª pasada de Codex sobre
  # esta PR: no es "siempre la rama base de la PR" en general — son la misma
  # rama aquí porque toda PR de este repo se corta de `origin/main` y va
  # contra `main`, que es la rama por defecto; una PR contra una base
  # distinta de `main` rompería esa coincidencia). Inmune a lo que la PR
  # declare en su propia copia. El motivo habitual para EVITAR
  # `pull_request_target` (ejecuta código ajeno con más autoridad/secretos)
  # no aplica aquí: ningún paso hace checkout del head de la PR ni de
  # ninguna otra rama que no sea la base — `scripts/verificar-gobernanza-pr.sh`
  # no lee el árbol de la PR en absoluto, recibe cuerpo/ficheros/autor por
  # API (ver el paso de abajo). Si algún día se añade un checkout del head
  # aquí, esa garantía desaparece — no lo hagas sin repetir el análisis de
  # REC-213.
  #
  # Caso límite documentado por GitHub y señalado por Codex (severidad baja,
  # no se protege activamente): una rama cuyo nombre coincide con el formato
  # de un SHA puede no disparar `pull_request_target`. Las ramas de este
  # repo siguen la convención `claude/<slug-legible>` (protocolo § 21) — no
  # colisiona en el uso normal.
  #
  # Verificado en una PR real (repo privado desechable, 2026-09-18): el check
  # de un job disparado por `pull_request_target` SÍ aparece en la lista de
  # checks de la PR y queda asociado al SHA de HEAD de la PR (confirmado por
  # `gh pr checks` y por `commits/{head_sha}/check-runs`), pese a que el
  # propio job se ejecuta en el contexto de la base — GitHub separa "a qué
  # commit se asocia el check" (el head de la PR) de "qué código ejecuta el
  # job" (la base). Sin esto no se puede dar el cambio por bueno: un check
  # invisible en la PR protegería menos que uno falsificable.
  #
  # `gobernanza-pr-tests`, en cambio, sigue en `pull_request` a propósito:
  # legítimamente prueba la versión del guion QUE TRAE LA PROPIA PR (ver su
  # comentario más abajo) — sin secretos ni permisos de escritura
  # (`permissions: contents: read` en ese job), así que ejecutar código de la
  # PR ahí no reabre REC-213.
  pull_request_target:
    types:
      - opened
      - synchronize # el SHA sobre el que se publica el check cambió
      - reopened
      - labeled # REC-140: hoy el check no se reevalúa al añadir Type:/Priority:
      - unlabeled
      - milestoned # REC-140: ni al asignar el milestone después de abrir la PR
      - demilestoned
      - edited # turno 2026-09-18 (T3): las secciones "Paso operativo en
      # servidores" y "Revisión Codex" viven en el CUERPO de la PR, no en sus
      # etiquetas — sin este disparador, rellenarlas tras abrir la PR (el
      # caso normal: Codex revisa después de abrir) no revalida el check.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      # gobernanza-pr-tests solo prueba el guion contra el código que trae
      # la PR: no depende de milestone, etiquetas ni del cuerpo, así que no
      # necesita labeled/unlabeled/milestoned/demilestoned/edited — esos
      # tipos solo afectan a lo que evalúa gobernanza-pr (bajo
      # pull_request_target, arriba).

# Deliberadamente SIN `merge_group` ni `push`: la convención (§ 5 de
# tecnico/CONVENCION-METADATOS-PR.md) nunca aplicó a esos dos eventos — en
# `push` el commit ya está fusionado y no hay nada que exigir, y en
# `merge_group` la referencia temporal no lleva una PR en el payload que
# resolver. Este workflow no cambia ese alcance, solo el disparador de
# `pull_request`/`pull_request_target` y la fuente del dato. No es un
# required status check (sigue fuera de los ocho de la protección de `main`,
# DEC-42), así que su ausencia en la cola de fusión no la bloquea — igual
# que antes.
#
# Cancela una ejecución anterior de la MISMA PR: un cambio de etiqueta más
# reciente hace obsoleta la evaluación de un cambio de etiqueta anterior. El
# grupo incluye `github.event_name` (REC-213, T4): abrir una PR dispara
# `pull_request` Y `pull_request_target` casi a la vez, cada uno con su
# propio job relevante (`if:`, más abajo) — sin separarlos por nombre de
# evento, la llegada del segundo cancelaría el primero antes de que su job
# terminase, aunque ninguno de los dos sea "obsoleto" respecto al otro.
# `|| github.run_id` como último recurso: si algún evento llegara sin
# `pull_request.number` en el payload, cada ejecución cae a su propio
# `run_id` (nunca colisiona) en vez de compartir grupo con otra PR distinta
# — barato de añadir, aunque `number` es un campo estándar del payload de
# `pull_request`/`pull_request_target` y no se ha medido un caso real donde
# falte (hallazgo de Codex sin confirmar en esta PR).
concurrency:
  group: gobernanza-pr-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  gobernanza-pr:
    # Nombre sin cambios a propósito: nada en la protección de rama, la cola
    # de fusión o CONVENCION-METADATOS-PR.md depende de él (medido:
    # `required_status_checks.contexts` de main y el ruleset de la cola no lo
    # nombran; no hay otro workflow ni automatismo que lo cite), pero
    # conservarlo evita que la pestaña de checks de las PR ya abiertas
    # muestre un check nuevo sin historial en vez de continuar el mismo.
    name: "Gobernanza — metadatos de PR"
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
      contents: read # turno 2026-09-18 (T3): el paso nuevo hace checkout para
      # correr scripts/verificar-gobernanza-pr.sh y lista los ficheros de la
      # PR con GET /pulls/{n}/files, que documenta ese mismo permiso. NO
      # subir a `write` — la garantía de REC-213 (T4) de que este job nunca
      # ejecuta código de la PR depende de que ningún paso tenga autoridad ni
      # motivo para tocar el head de la PR.
    steps:
      # REC-213 (T4): bajo `pull_request_target` el checkout por defecto YA
      # trae la rama base (GITHUB_SHA = último commit de la base en este
      # evento) — a diferencia de `pull_request`, aquí no hace falta fijar el
      # `ref` a mano para evitar el código de la PR. Se fija explícitamente
      # de todos modos, a `base.sha` (no a la rama base "actual"): pinta el
      # commit exacto del INSTANTE del evento, inmune a que la base avance
      # mientras este job espera cola — más determinista que confiar en el
      # valor implícito, por una línea de más. NUNCA cambiar este `ref` a
      # `head.sha` ni quitarlo para apuntar al de la PR: eso ejecutaría
      # código ajeno bajo el contexto de más autoridad de
      # `pull_request_target`, que es precisamente el riesgo que este evento
      # tiene fama de abrir y que aquí se evita por diseño (ningún paso lee
      # el árbol de la PR; ver el permiso `contents: read` de arriba).
      # Falsado por mutación: rama con el guion saboteado para salir 0
      # siempre sigue en rojo, porque el guion que corre es el de la base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      # REC-162, revertido a propósito. El job original en ci.yml leía
      # milestone y etiquetas de `github.event.pull_request.*` — el payload
      # del evento. Su comentario (ci.yml, antes de este cambio, ~líneas
      # 1084-1091) ya había considerado la vía por API y la había descartado,
      # razonando que leer el payload evitaba pedir el permiso
      # `pull-requests: read`. Quedó demostrado (REC-162, reproducido a
      # propósito el 2026-09-03) que ese payload puede representar un estado
      # ANTERIOR al que termina teniendo la PR: `gh pr create --milestone`
      # adjunta el milestone en una llamada posterior a la creación, así que
      # el payload del evento `opened` no lo lleva aunque la PR ya lo tenga
      # un instante después — y no hay ningún evento de `synchronize`
      # posterior que reevalúe ese caso.
      #
      # DEC-66 revierte esa decisión: el payload del evento sirve solo para
      # identificar QUÉ PR mirar (su número); el milestone y las etiquetas se
      # consultan por API, en solo lectura, en el momento de la ejecución —
      # así el veredicto es siempre sobre el estado vigente, no sobre una
      # fotografía tomada al abrir la PR.
      - name: "Exigir milestone y etiquetas Type:/Priority: (estado vigente por API)"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMERO: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          fallos=0

          datos=$(gh api "repos/${REPO}/pulls/${NUMERO}")
          MILESTONE=$(echo "$datos" | jq -r '.milestone.title // ""')
          LABELS_JSON=$(echo "$datos" | jq -c '[.labels[].name]')

          if [ -z "$MILESTONE" ]; then
            echo "::error::Esta PR no tiene milestone. Convención: tecnico/CONVENCION-METADATOS-PR.md en el repositorio de negocio — toda PR entra en un milestone de 'Hydra — Roadmap'."
            fallos=1
          fi

          if ! echo "$LABELS_JSON" | jq -e 'any(startswith("Type: "))' >/dev/null; then
            echo "::error::Esta PR no lleva ninguna etiqueta 'Type: *'. Convención: tecnico/CONVENCION-METADATOS-PR.md en el repositorio de negocio."
            fallos=1
          fi

          if ! echo "$LABELS_JSON" | jq -e 'any(startswith("Priority: "))' >/dev/null; then
            echo "::error::Esta PR no lleva ninguna etiqueta 'Priority: *'. Convención: tecnico/CONVENCION-METADATOS-PR.md en el repositorio de negocio."
            fallos=1
          fi

          if [ "$fallos" -ne 0 ]; then
            exit 1
          fi
          echo "OK — milestone: '$MILESTONE'; etiquetas Type:/Priority: presentes (leído por API, PR #${NUMERO})."

      # Turno 2026-09-18 (T3), registro PROTOCOLO-TURNO-NOCTURNO.md § 8:
      #
      #   - #674 añadió el rol cae_app_aprovisionamiento a
      #     deploy/bootstrap/roles-de-cluster.sql sin que ningún adaptador de
      #     despliegue lo ejecutara -> staging roto (42704) hasta que alguien
      #     lo aplicó a mano (PR #683). Regla: toda PR que TOQUE ese fichero
      #     lleva en el cuerpo una sección "## Paso operativo en servidores"
      #     que nombre staging y producción.
      #   - #678 se abrió sin pasar por Codex; #673 dejó un marcador
      #     provisional ("2ª pasada — (resultado abajo)") sin rellenar. Regla:
      #     toda PR (salvo dependabot[bot]) lleva una sección
      #     "## Revisión Codex" con contenido real — hallazgos aceptados o
      #     rechazados, o "sin hallazgos" — y sin marcadores provisionales.
      #
      # Igual que el paso de arriba (DEC-66): el cuerpo, los ficheros y el
      # autor se leen por API en el momento de evaluar, nunca del payload del
      # evento — un `synchronize` o un `edited` pueden cambiar cualquiera de
      # los dos primeros tras abrir la PR (rellenar las secciones después de
      # abrir es el caso normal: Codex revisa sobre el incremento ya
      # empujado). La lógica de las dos reglas vive en
      # scripts/verificar-gobernanza-pr.sh (con su prueba sin red,
      # verificar-gobernanza-pr.tests.sh, en el job gobernanza-pr-tests de
      # este mismo workflow) para no escribir awk/grep dentro de YAML dentro
      # de shell — mismo motivo que separó scripts/repartir-clases-de-test.sh.
      - name: "Exigir sección de paso operativo (roles de clúster) y de revisión Codex"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMERO: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          datos=$(gh api "repos/${REPO}/pulls/${NUMERO}")
          AUTOR=$(echo "$datos" | jq -r '.user.login // ""')

          CUERPO="$(mktemp)"
          echo "$datos" | jq -r '.body // ""' >"$CUERPO"

          # .previous_filename además de .filename: si el fichero vigilado se
          # renombra dentro de la misma PR, la entrada de esa API lo lleva en
          # previous_filename, no en filename — sin las dos, un rename lo
          # saca de la ruta vigilada sin que el guion pueda verlo (hallazgo
          # de Codex sobre la PR #683, ver su "## Revisión Codex").
          FICHEROS="$(mktemp)"
          gh api "repos/${REPO}/pulls/${NUMERO}/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' >"$FICHEROS"

          bash scripts/verificar-gobernanza-pr.sh "$CUERPO" "$FICHEROS" "$AUTOR"

  gobernanza-pr-tests:
    # Prueba sin red de scripts/verificar-gobernanza-pr.sh (el guion que usa
    # el job de arriba). El patrón ya existente para este tipo de prueba de
    # shell es el job deploy-script-tests de ci.yml (ver
    # scripts/verificar-licencias-nuget.tests.sh, scripts/repartir-clases-de-
    # test.tests.sh) — pero el alcance de la misión que introdujo este job
    # (T3, turno 2026-09-18) prohíbe expresamente tocar ci.yml. Este workflow,
    # que ya es dueño de scripts/verificar-gobernanza-pr.sh, es el sitio más
    # cercano a ese patrón sin cruzar esa frontera: corre en cada evento de
    # `pull_request` que dispara este fichero (arriba), sin depender del
    # contenido de la PR concreta que lo disparó — prueba el guion, no esa PR.
    #
    # REC-213 (T4): a propósito sigue en `pull_request`, NO en
    # `pull_request_target` — este job SÍ quiere el código que trae la
    # propia PR (es su función: probar la versión del guion que la PR está
    # proponiendo), y hacerlo bajo `pull_request` es seguro porque no hay
    # nada que proteger: `permissions: contents: read` (sin escritura, sin
    # `pull-requests`), ningún secreto, y el único efecto es un `bash` local
    # sobre datos sintéticos — el guion bajo prueba no toca la red (ver
    # cabecera de verificar-gobernanza-pr.tests.sh). Si alguna vez este job
    # necesitara escritura o secretos, ejecutar código de la PR dejaría de
    # ser seguro y habría que repensarlo (artefacto + job separado bajo
    # pull_request_target, patrón estándar para este caso).
    name: "Gobernanza — prueba del verificador (sin red)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read # solo para actions/checkout; el resto del job no llama a la API.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: scripts/verificar-gobernanza-pr.tests.sh
        run: bash scripts/verificar-gobernanza-pr.tests.sh
