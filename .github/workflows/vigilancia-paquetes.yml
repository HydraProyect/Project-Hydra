name: Vigilancia de paquetes NuGet vulnerables

# Un aviso nuevo en la NuGet Advisory Database sobre una dependencia ya fijada no
# avisaba hasta la siguiente PR: el job `paquetes-vulnerables` de ci.yml solo corre con
# PR, cola de merge y push a main. Este workflow repite esa misma comprobación una vez
# por semana (lunes) sobre main, sin los otros jobs de CI, y queda en rojo si hay algún
# paquete con vulnerabilidad conocida (también transitiva); el rojo programado es el aviso.
#
# Las alertas de Dependabot son aparte y las activa Chris (D-6): este workflow no las toca.
#
# `schedule` solo corre desde la rama por defecto; a mano:
#   gh workflow run vigilancia-paquetes.yml
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: vigilancia-paquetes
  cancel-in-progress: false

jobs:
  paquetes-vulnerables:
    name: Paquetes NuGet vulnerables (semanal)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restaurar dependencias
        run: dotnet restore CaeManager.slnx

      # Misma lectura que el job de ci.yml: --format json omite "frameworks" en un proyecto
      # sin paquetes vulnerables; la forma del JSON no depende del locale del runner.
      - name: Comprobar vulnerabilidades conocidas (NuGet Advisory Database)
        run: |
          dotnet list CaeManager.slnx package --vulnerable --include-transitive --format json > vulnerables.json
          jq '.' vulnerables.json
          if jq -e '.projects[] | select(.frameworks != null)' vulnerables.json > /dev/null; then
            echo "::error::Hay paquetes NuGet con vulnerabilidades conocidas. Ver el JSON de arriba (advisoryurl por paquete)."
            exit 1
          fi
          echo "Sin vulnerabilidades conocidas en las fuentes actuales."
