# Espejo de la imagen de PostgreSQL en GHCR (ghcr.io/hydraproyect/postgres).
#
# Por qué existe: Amazon ECR Public limita la descarga anónima de imágenes
# desde las IP compartidas de los runners («toomanyrequests: Data limit
# exceeded»). Ese límite tumbó jobs de la CI en «Initialize containers» los
# días 2026-10-11 y 2026-10-12. Este workflow copia a GHCR, dentro de la misma
# organización, la imagen que ya usa la CI, para poder cambiar después las
# referencias de los servicios sin depender de ECR Public.
#
# SOLO SE LANZA A MANO (workflow_dispatch). No tiene push, pull_request,
# schedule ni merge_group: no corre nunca sola ni al fusionar.
#
# NO CAMBIA de dónde baja hoy el CI. Las referencias de ci.yml y de
# integraciones-con-clave.yml siguen apuntando a public.ecr.aws hasta un
# incremento posterior, que solo se hará cuando el paquete sea público.
#
# El digest que se copia es el mismo que el de producción
# (deploy/local/docker-compose.produccion.yml). Se copia el manifiesto tal
# cual, sin reconstruir la imagen, para que el digest no cambie. Lo vigila
# MismaVersionDePostgresTests (tests/CaeManager.Architecture.Tests): si el
# compose de producción cambia de digest, ese test se pone en rojo.
#
# No usa ningún secreto aparte de GITHUB_TOKEN, con permiso packages: write
# solo en este job.
#
# Cuando se actualice PostgreSQL: hay que cambiar ETIQUETA y DIGEST aquí,
# volver a lanzar este workflow y comprobar que el resultado es correcto ANTES
# de cambiar las referencias de la CI. En ese orden, nunca al revés.
#
# Tras la primera publicación el paquete nace PRIVADO. Hay que marcarlo como
# público a mano en la organización (Packages de HydraProyect) antes de cambiar
# las referencias de ci.yml. Ese paso lo recuerda el resumen del job.
name: Espejo de postgres en GHCR

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe exactamente: publicar'
        required: true
        type: string

# Sin permisos a nivel de workflow; el job pide solo lo que necesita.
permissions: {}

# Una sola copia a la vez. No se cancela una en curso: a medio copiar, el
# manifiesto podría quedar a medias.
concurrency:
  group: espejo-postgres-ghcr
  cancel-in-progress: false

jobs:
  espejo:
    name: Copiar postgres a GHCR
    # Solo desde main y con la confirmación escrita exactamente.
    if: github.ref == 'refs/heads/main' && inputs.confirmar == 'publicar'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      ORIGEN: public.ecr.aws/docker/library/postgres
      ETIQUETA: "18.6"
      DIGEST: sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
      DESTINO: ghcr.io/hydraproyect/postgres
    steps:
      - name: Iniciar sesión en ghcr.io
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Copiar el manifiesto sin reconstruir
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$DESTINO:$ETIQUETA" \
            "$ORIGEN:$ETIQUETA@$DIGEST"

      - name: Verificar digest y accesibilidad
        shell: bash
        run: |
          set -euo pipefail
          obtenido="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$DESTINO:$ETIQUETA")"
          if [ "$obtenido" != "$DIGEST" ]; then
            echo "::error::El digest de $DESTINO:$ETIQUETA es «$obtenido» y debe ser «$DIGEST». No se publica una imagen distinta de la de producción."
            exit 1
          fi
          docker buildx imagetools inspect "$DESTINO@$DIGEST" > /dev/null
          echo "Digest verificado: $DESTINO:$ETIQUETA@$DIGEST"

      - name: Resumen del espejo
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Espejo de postgres publicado"
            echo ""
            echo "Referencia final: \`$DESTINO:$ETIQUETA@$DIGEST\`"
            echo ""
            echo "**Pendiente a mano:** el paquete nace privado. Márcalo como público en la organización HydraProyect antes de cambiar las referencias de \`ci.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"
