name: Seguridad del código

# Pruebas de código seguro que no caben en el CI obligatorio: análisis estático
# (CodeQL), inventario de dependencias (SBOM CycloneDX) y escaneo pasivo de la
# aplicación en marcha (ZAP baseline). Solo `CodeQL (resultado)` es `required`
# (protección de la rama main); SBOM y ZAP informan y dejan evidencia, pero no
# bloquean la cola de fusión.
#
# Como `CodeQL (resultado)` es obligatorio, este workflow DEBE correr en
# `merge_group`: la cola espera ahí los checks obligatorios y, sin el
# disparador, se quedaría colgada en silencio para todas las PR. En `merge_group`
# CodeQL analiza pero no sube el SARIF (`upload: never`): la subida solo tiene
# sentido sobre la rama o la PR, y un fallo de subida no debe expulsar de la
# cola un cambio cuyo código no tiene nada. Los hallazgos se publican en el run
# de la PR y en el push a main.
#
# El check obligatorio es el job agregador, no los de la matriz: el nombre del
# agregador es estable aunque cambien los lenguajes, y un job de matriz saltado
# (PR de fork o de Dependabot) no se publica con su nombre expandido, así que
# exigirlo dejaría esas PR esperando para siempre un check que nunca llega.
#
# ZAP se lanza contra una instancia levantada dentro de este mismo runner,
# nunca contra staging: staging envía correo real por SMTP y un escáner que
# recorre formularios podría disparar envíos.
#
# El escaneo autenticado (job zap-autenticado) solo corre en el semanal y a mano:
# tarda ~40 min, con sesión propia y escaneo activo, y no aporta nada a una PR
# que no lo espera. Tampoco es obligatorio.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  # Semanal: CodeQL actualiza sus consultas y ZAP sus reglas aunque el código
  # no cambie.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: seguridad-${{ github.workflow }}-${{ github.ref }}
  # Solo se cancelan los runs de PR: los de main (push, semanal, manual) son la
  # base con la que code scanning compara las alertas de cada PR.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.lenguaje }})
    runs-on: ubuntu-latest
    # El análisis de C# tarda ~10-12 min (medido en las PR del 2026-10-25); el
    # tope evita que un cuelgue del extractor retenga la cola hasta el timeout
    # de checks de la cola de fusión (60 min).
    timeout-minutes: 30
    # Las PR de forks y de Dependabot reciben un GITHUB_TOKEN de solo lectura:
    # la subida del SARIF fallaría sin que el código tenga nada. Sus cambios se
    # analizan igualmente en el push a main.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # build-mode none: C# se analiza sin compilar (extracción desde el
        # código fuente), así el job no depende del SDK ni duplica la
        # compilación del CI. `javascript-typescript` cubre el JS propio de
        # wwwroot y la extensión de navegador, que maneja credenciales de
        # plataformas CAE. `actions` analiza los propios workflows (inyección
        # de expresiones, permisos excesivos, checkout inseguro).
        lenguaje: [csharp, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.lenguaje }}
          build-mode: none
          queries: security-extended

      - name: Analizar
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.lenguaje }}"
          # En merge_group no se sube el SARIF (ver cabecera del fichero).
          upload: ${{ github.event_name == 'merge_group' && 'never' || 'always' }}

  # Check obligatorio de la rama main. Falla si algún lenguaje de CodeQL falla o
  # se cancela; pasa si todos terminan bien o si la matriz se saltó (PR de fork
  # o de Dependabot, que no pueden subir el SARIF y se analizan en el push a
  # main). No ejecuta código del repositorio ni usa secretos.
  codeql-resultado:
    name: CodeQL (resultado)
    needs: codeql
    # No `always()`: en una ejecución cancelada (push nuevo a la PR) el run está
    # obsoleto y no debe publicar un rojo sobre su SHA.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Comprobar el resultado de la matriz de CodeQL
        env:
          RESULTADO: ${{ needs.codeql.result }}
        run: |
          echo "Resultado de la matriz de CodeQL: $RESULTADO"
          case "$RESULTADO" in
            success|skipped) exit 0 ;;
            *) echo "::error::CodeQL no terminó correctamente ($RESULTADO)."; exit 1 ;;
          esac

  sbom:
    name: SBOM CycloneDX
    # No es obligatorio: en la cola de fusión solo corre CodeQL.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Trivy (la misma versión fijada que escanea la imagen en ci.yml) lee los
      # packages.lock.json de cada proyecto: el inventario sale de las
      # versiones exactas resueltas, no de los rangos del .csproj.
      - name: Generar SBOM del código fuente
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json

      - name: Comprobar que el SBOM no está vacío
        run: |
          componentes=$(jq '.components | length' sbom.cdx.json)
          echo "Componentes en el SBOM: $componentes"
          if [ "$componentes" -lt 50 ]; then
            echo "::error::El SBOM solo tiene $componentes componentes: Trivy no ha leído los packages.lock.json."
            exit 1
          fi

      - name: Publicar SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  zap-baseline:
    name: ZAP baseline (instancia local)
    # No es obligatorio: en la cola de fusión solo corre CodeQL.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        # Espejo GHCR, mismo digest que producción: ver el servicio postgres del
        # job tests-integracion en ci.yml.
        image: ghcr.io/hydraproyect/postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Compilar la aplicación
        run: dotnet build src/CaeManager.Web -c Release

      # Mismo prerrequisito que los jobs de integración y E2E: los roles de
      # clúster no los crea ninguna migración.
      - name: Bootstrap de roles de clúster
        env:
          PGPASSWORD: postgres
        run: >
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f deploy/bootstrap/roles-de-cluster.sql

      # Contraseña efímera de este runner, igual que AccesoBajoRolRuntimeTests:
      # el tráfico va por cae_app_runtime (sometido a RLS), como en producción,
      # y no hace falta la degradación insegura fuera de Development.
      - name: Dar LOGIN al rol de tráfico
        env:
          PGPASSWORD: postgres
        run: >
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -c "ALTER ROLE cae_app_runtime LOGIN PASSWORD 'zap-ci-efimera';"

      # Entorno distinto de Development a propósito: activa el manejador de
      # errores, HSTS y el resto del comportamiento de un entorno desplegado,
      # que es lo que el escáner debe ver. Sin proveedores de IA, SMTP ni
      # Sentry: ninguna clave llega a este job.
      - name: Arrancar la aplicación
        env:
          ASPNETCORE_ENVIRONMENT: Escaneo
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ConnectionStrings__CaeManagerDb: Host=localhost;Database=cae_zap;Username=postgres;Password=postgres
          ConnectionStrings__CaeManagerDbRuntime: Host=localhost;Database=cae_zap;Username=cae_app_runtime;Password=zap-ci-efimera
          # Obligatoria fuera de Development (ValidadorUrlBasePublica): sin ella la aplicación
          # no arranca. Dominio .invalid reservado: los enlaces no apuntan a ningún sitio real
          # y, con la guarda de envío cerrada y sin SMTP configurado, ningún correo sale de este job.
          Smtp__UrlBasePublica: https://escaneo-zap.invalid
        run: |
          cd src/CaeManager.Web/bin/Release/net10.0
          nohup dotnet CaeManager.Web.dll > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:5080/salud; then
              echo "La aplicación responde en /salud tras ${i} intentos."
              exit 0
            fi
            sleep 2
          done
          echo "::error::La aplicación no respondió en /salud."
          tail -n 200 "$RUNNER_TEMP/app.log"
          exit 1

      # Imagen oficial de ZAP fijada por digest (2.17.0) en vez de la acción de
      # terceros: la acción pide permiso para abrir issues y aquí solo hace
      # falta el informe. Escaneo pasivo: araña las páginas públicas sin enviar
      # formularios. -I: los avisos no hacen fallar el job; solo las reglas
      # marcadas FAIL en .zap/reglas-baseline.tsv.
      - name: Escanear con ZAP baseline
        run: |
          mkdir -p zap
          cp .zap/reglas-baseline.tsv zap/
          chmod -R 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6 \
            zap-baseline.py -t http://127.0.0.1:5080 -m 3 -I \
            -c reglas-baseline.tsv -r informe-zap.html -J informe-zap.json -w informe-zap.markdown

      - name: Resumen del escaneo
        if: always()
        run: |
          if [ -f zap/informe-zap.markdown ]; then cat zap/informe-zap.markdown >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Log de la aplicación si falla
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/app.log" || true

      - name: Publicar informe de ZAP
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informe-zap-baseline
          path: zap/informe-zap.*
          retention-days: 90
          if-no-files-found: ignore

  # Escaneo activo como usuario autenticado, contra la misma clase de instancia
  # local que el baseline. Falla solo por hallazgos de riesgo alto, por perder la
  # sesión durante el escaneo o porque el escaneo no haya ocurrido: un verde sin
  # sesión no demostraría nada. El alcance y las rutas excluidas viven en
  # .zap/plan-autenticado.yaml.
  zap-autenticado:
    name: ZAP autenticado (instancia local)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      ZAP_BASE: http://127.0.0.1:5080
      ZAP_API: http://127.0.0.1:8090
      # Cuenta de la siembra de demo: rol sin 2FA obligatorio y Tenant propietario
      # con datos. Su contraseña la genera este job.
      ZAP_CUENTA: prueba.coordinadorcae1@caemanager.local
      # Política SesionOExtension: con cookie contesta 200 y una lista JSON, y sin
      # ella 401. Otras rutas de /extension son SoloExtension y nunca aceptan cookie.
      ZAP_SONDA: /extension/acreditaciones-pendientes
    services:
      postgres:
        # Espejo GHCR, mismo digest que producción: ver el job zap-baseline.
        image: ghcr.io/hydraproyect/postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Compilar la aplicación
        run: dotnet build src/CaeManager.Web -c Release

      - name: Bootstrap de roles de clúster
        env:
          PGPASSWORD: postgres
        run: >
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f deploy/bootstrap/roles-de-cluster.sql

      - name: Dar LOGIN al rol de tráfico
        env:
          PGPASSWORD: postgres
        run: >
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -c "ALTER ROLE cae_app_runtime LOGIN PASSWORD 'zap-ci-efimera';"

      # Credenciales que solo existen en este runner. No son secretos del
      # repositorio: mueren con el job, igual que la base.
      - name: Generar credenciales efímeras
        run: |
          contrasena="Zap-$(openssl rand -hex 16)-Aa1!"
          clave="hydra_$(openssl rand -hex 32)"
          echo "::add-mask::$contrasena"
          echo "::add-mask::$clave"
          {
            echo "ZAP_CONTRASENA=$contrasena"
            echo "ZAP_CLAVE_API=$clave"
          } >> "$GITHUB_ENV"

      # Segunda barrera del correo, por si alguien configura SMTP en este job: el
      # contador de esta regla se comprueba al final (paso «Comprobar el correo»).
      - name: Cerrar la salida de correo del runner
        run: >
          sudo iptables -I OUTPUT -p tcp -m multiport --dports 25,465,587,2525
          -m comment --comment zap-correo -j REJECT

      # Como el baseline, entorno distinto de Development y tráfico por
      # cae_app_runtime, ahora con la siembra de demo para tener cuentas y datos.
      # Sin EnvioCorreo__Modo la guarda de envío está cerrada, y tampoco hay Smtp__Host
      # ni credenciales: no sale ningún correo. Los topes de peticiones se suben porque el escáner, desde una sola IP, solo vería
      # 429 (mismo ajuste que el fixture de E2E).
      - name: Arrancar la aplicación
        env:
          ASPNETCORE_ENVIRONMENT: Escaneo
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ConnectionStrings__CaeManagerDb: Host=localhost;Database=cae_zap;Username=postgres;Password=postgres
          ConnectionStrings__CaeManagerDbRuntime: Host=localhost;Database=cae_zap;Username=cae_app_runtime;Password=zap-ci-efimera
          Smtp__UrlBasePublica: https://escaneo-zap.invalid
          DatosPrueba__Activo: "true"
          RateLimiting__Cuenta__LimiteAnonimo: "1000000"
          RateLimiting__Cuenta__LimiteAutenticado: "1000000"
          RateLimiting__Extension__LimiteGlobalPorMinuto: "1000000"
          RateLimiting__Extension__LimitePorMinuto: "1000000"
          ApiPublica__RateLimitPorMinuto: "1000000"
          ApiPublica__RateLimitPorMinutoPorIp: "1000000"
        run: |
          export DatosPrueba__Contrasena="$ZAP_CONTRASENA"
          export DatosPrueba__ClaveApiActiva="$ZAP_CLAVE_API"
          cd src/CaeManager.Web/bin/Release/net10.0
          nohup dotnet CaeManager.Web.dll > "$RUNNER_TEMP/app.log" 2>&1 &
          # La siembra de demo va antes de Kestrel y tarda bastante más que el
          # arranque del baseline.
          for i in $(seq 1 300); do
            if curl -fsS -o /dev/null http://127.0.0.1:5080/salud; then
              echo "La aplicación responde en /salud tras ${i} intentos."
              exit 0
            fi
            sleep 2
          done
          echo "::error::La aplicación no respondió en /salud."
          tail -n 200 "$RUNNER_TEMP/app.log"
          exit 1

      # Una clave de la API pública solo autentica con su ventana de Soporte
      # abierta (CriterioSoporteClaveApi), y la de la siembra no la lleva. Se abre
      # aquí por SQL porque emitirla exige una Sesión Privilegiada interactiva, y
      # esta base muere con el job.
      - name: Respaldar la clave de API con una ventana de Soporte
        env:
          PGPASSWORD: postgres
        run: |
          hash=$(printf '%s' "$ZAP_CLAVE_API" | sha256sum | cut -d' ' -f1)
          psql -h localhost -U postgres -d cae_zap -v ON_ERROR_STOP=1 -At <<SQL
          WITH ventana AS (
            UPDATE "DelegacionesTenant" d
            SET "Activa" = true,
                "ActivadaEnUtc" = date_trunc('milliseconds', now()),
                "ExpiraEnUtc" = now() + interval '3 hours',
                "MotivoActivacion" = 'Escaneo ZAP en el runner de CI'
            FROM "AspNetUsers" u
            WHERE u."NormalizedEmail" = upper('$ZAP_CUENTA')
              AND d."TenantClienteId" = u."TenantId"
              AND d."Proposito" = 'Soporte'
            RETURNING d."Id", d."ActivadaEnUtc"
          )
          UPDATE "ClavesApi" c
          SET "VentanaSoporteId" = v."Id", "VentanaSoporteAbiertaEnUtc" = v."ActivadaEnUtc"
          FROM ventana v
          WHERE c."HashClave" = '$hash'
          RETURNING 'clave respaldada';
          SQL

      # Imagen oficial fijada por el mismo digest que el baseline. Modo demonio y
      # no zap-full-scan: mantener ZAP vivo es lo que permite preguntarle por la
      # sesión mientras escanea y cargar las credenciales por su API, sin
      # escribirlas en ningún fichero. La API escucha solo en el bucle local de
      # un runner efímero, por eso va sin clave.
      - name: Arrancar ZAP
        run: |
          mkdir -p zap
          cp .zap/plan-autenticado.yaml zap/
          chmod -R 777 zap
          docker run -d --name zap --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6 \
            zap.sh -daemon -host 127.0.0.1 -port 8090 \
            -config api.disablekey=true -config start.checkForUpdates=false
          for i in $(seq 1 60); do
            if curl -fsS "$ZAP_API/JSON/core/view/version/"; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::ZAP no respondió por su API."
          docker logs --tail 50 zap
          exit 1

      # Inicio de sesión real por el formulario de Blazor con curl, y la cookie se
      # entrega a ZAP como regla del Replacer: ZAP no reintenta el login por su
      # cuenta, de modo que perder la sesión se nota y no se tapa. Las pantallas
      # anónimas quedan sin cookie para que ZAP vea sus formularios.
      - name: Iniciar sesión y autenticar a ZAP
        run: |
          tmp=$(mktemp -d)
          curl -fsS -c "$tmp/jar" -o "$tmp/login.html" "$ZAP_BASE/cuenta/iniciar-sesion"
          token=$(sed -n 's/.*name="__RequestVerificationToken"[^>]*value="\([^"]*\)".*/\1/p' "$tmp/login.html" | head -n 1)
          if [ -z "$token" ]; then
            echo "::error::El formulario de inicio de sesión no trae token antiforgery."
            exit 1
          fi
          curl -sS -b "$tmp/jar" -c "$tmp/jar" -o /dev/null -w 'Inicio de sesión: HTTP %{http_code}\n' \
            --data-urlencode "__RequestVerificationToken=$token" \
            --data-urlencode "_handler=iniciar-sesion" \
            --data-urlencode "Entrada.Email=$ZAP_CUENTA" \
            --data-urlencode "Entrada.Password=$ZAP_CONTRASENA" \
            "$ZAP_BASE/cuenta/iniciar-sesion"
          if ! grep -q 'AspNetCore.Identity.Application' "$tmp/jar"; then
            echo "::error::El inicio de sesión no emitió la cookie de sesión."
            exit 1
          fi
          # Todas las cookies, también la de antiforgery: los formularios que ZAP
          # lea con esta sesión van emparejados con ella.
          cookies=$(awk -F'\t' 'NF == 7 { printf "%s%s=%s", sep, $6, $7; sep = "; " }' "$tmp/jar")
          echo "::add-mask::$cookies"
          rm -rf "$tmp"

          regla() {
            curl -fsS -o /dev/null "$ZAP_API/JSON/replacer/action/addRule/" \
              --data-urlencode "description=$1" --data-urlencode "enabled=true" \
              --data-urlencode "matchType=REQ_HEADER" --data-urlencode "matchRegex=false" \
              --data-urlencode "matchString=$2" --data-urlencode "replacement=$3" \
              --data-urlencode "url=$4"
          }
          regla sesion Cookie "$cookies" \
            '^http://127\.0\.0\.1:5080/(?!api/v1/|cuenta/(iniciar-sesion|olvide-contrasena|restablecer-contrasena|verificar-2fa)).*'
          regla clave-api Authorization "ApiKey $ZAP_CLAVE_API" \
            '^http://127\.0\.0\.1:5080/api/v1/.*'

          # La sonda tiene que distinguir: sin ZAP (sin cookie) no puede dar 200.
          anonimo=$(curl -sS -o /dev/null -w '%{http_code}' "$ZAP_BASE$ZAP_SONDA")
          sesion=$(curl -sS -o /dev/null -w '%{http_code}' -x "$ZAP_API" "$ZAP_BASE$ZAP_SONDA")
          api_anonimo=$(curl -sS -o /dev/null -w '%{http_code}' "$ZAP_BASE/api/v1/clientes")
          api=$(curl -sS -o /dev/null -w '%{http_code}' -x "$ZAP_API" "$ZAP_BASE/api/v1/clientes")
          echo "Sonda de sesión: sin ZAP $anonimo, por ZAP $sesion. API: sin ZAP $api_anonimo, por ZAP $api."
          if [ "$sesion" != 200 ] || [ "$anonimo" = 200 ] || [ "$api" != 200 ] || [ "$api_anonimo" = 200 ]; then
            echo "::error::ZAP no quedó autenticado antes de escanear."
            exit 1
          fi

      # Control positivo: pide un restablecimiento para una cuenta que existe y
      # exige que la guarda de envío diga que lo ha bloqueado. Si ese camino cambia,
      # este paso falla en vez de dar por apagado un correo que no se ha probado.
      - name: Comprobar que el correo está apagado
        run: |
          aviso='Envío de correo bloqueado por la guarda'
          antes=$(grep -c "$aviso" "$RUNNER_TEMP/app.log" || true)
          tmp=$(mktemp -d)
          curl -fsS -c "$tmp/jar" -o "$tmp/form.html" "$ZAP_BASE/cuenta/olvide-contrasena"
          token=$(sed -n 's/.*name="__RequestVerificationToken"[^>]*value="\([^"]*\)".*/\1/p' "$tmp/form.html" | head -n 1)
          handler=$(sed -n 's/.*name="_handler"[^>]*value="\([^"]*\)".*/\1/p' "$tmp/form.html" | head -n 1)
          curl -sS -b "$tmp/jar" -o /dev/null -w 'Solicitud de restablecimiento: HTTP %{http_code}\n' \
            --data-urlencode "__RequestVerificationToken=$token" \
            --data-urlencode "_handler=$handler" \
            --data-urlencode "Entrada.Email=$ZAP_CUENTA" \
            "$ZAP_BASE/cuenta/olvide-contrasena"
          rm -rf "$tmp"
          for i in $(seq 1 30); do
            # Hay que ver aumentar el recuento: los avisos de arranque también
            # intentan enviar y dejan la misma línea.
            despues=$(grep -c "$aviso" "$RUNNER_TEMP/app.log" || true)
            if [ "$despues" -gt "$antes" ]; then
              echo "La guarda de envío bloquea el correo: salida cerrada."
              exit 0
            fi
            sleep 1
          done
          echo "::error::El restablecimiento no llegó al aviso de la guarda de envío."
          exit 1

      # ZAP solo ataca lo que conoce. Las rutas con identificador salen de la
      # siembra para que las descargas lleguen a su manejador y no a un 404.
      - name: Sembrar las rutas HTTP en ZAP
        env:
          PGPASSWORD: postgres
        run: |
          sql() { psql -h localhost -U postgres -d cae_zap -At -c "$1" 2>/dev/null | head -n 1; }
          tenant=$(sql "SELECT \"TenantId\" FROM \"AspNetUsers\" WHERE \"NormalizedEmail\" = upper('$ZAP_CUENTA')")
          primero() { sql "SELECT \"Id\" FROM \"$1\" WHERE \"TenantId\" = '$tenant' ORDER BY \"Id\" LIMIT 1"; }
          pedir() { curl -sS -o /dev/null -w "%{http_code} $1\n" -x "$ZAP_API" "$ZAP_BASE$1" || true; }

          for ruta in \
            /cuenta/iniciar-sesion /cuenta/olvide-contrasena /cuenta/restablecer-contrasena \
            /cuenta/verificar-2fa /cuenta/pendiente-de-rol \
            /extension/tenants-beneficiarios /extension/acreditaciones-pendientes \
            /asignaciones/exportar.xlsx /auditoria/exportar.xlsx /centros/exportar.xlsx \
            /clientes/exportar.xlsx /clientes/plantilla.xlsx /clientes/plantilla-combinada.xlsx \
            /documentos/exportar.xlsx /documentos/plantilla.xlsx /empresas/exportar.xlsx \
            /facturacion/resumen.xlsx /facturacion/cuota-operador.xlsx /direccion/extranjeros.xlsx \
            /gestiones/exportar.xlsx /incidencias/exportar.xlsx \
            /proyectos/exportar.xlsx /subcontratas/exportar.xlsx /trabajadores/exportar.xlsx \
            /vehiculos/exportar.xlsx /visitas/exportar.xlsx /mi-firma/archivo \
            /reportes/vigencia.xlsx /reportes/vigencia.pdf \
            /reportes/asignaciones.xlsx /reportes/asignaciones.pdf; do
            pedir "$ruta"
          done

          id=$(primero Centros);   [ -z "$id" ] || pedir "/api/v1/centros/$id"
          id=$(primero Trabajadores); [ -z "$id" ] || pedir "/api/v1/trabajadores/$id"
          id=$(primero Documentos)
          if [ -n "$id" ]; then
            pedir "/api/v1/documentos/$id"
            pedir "/documentos/$id/archivo"
          fi
          id=$(primero Visitas);   [ -z "$id" ] || pedir "/visitas/$id/paquete-documental.zip"
          # Las rutas /api/v1/clientes leen la tabla Empresas.
          id=$(primero Empresas)
          if [ -n "$id" ]; then
            pedir "/api/v1/clientes/$id"
            pedir "/empresas/$id/sello/archivo"
          fi
          pedir "/tenants/$tenant/logo"
          id=$(primero AcreditacionesDocumentoPlataforma)
          if [ -n "$id" ]; then
            pedir "/extension/acreditaciones/$id/archivo"
            curl -sS -o /dev/null -w "%{http_code} POST /extension/acreditaciones/$id/subida\n" -x "$ZAP_API" \
              -H 'Content-Type: application/json' -d '{}' "$ZAP_BASE/extension/acreditaciones/$id/subida" || true
          fi

      # Cada 30 s, dos peticiones por ZAP: la de sesión y la de la clave de API.
      # Las credenciales las pone el Replacer, así que un 200 demuestra que ZAP
      # sigue autenticado en ese momento, no solo que la credencial valía. 000
      # (sonda agotada con ZAP ocupado) no prueba nada en ningún sentido y se
      # cuenta aparte; cualquier otro código es credencial perdida.
      #
      # La señal de interacción es lo único que mueve el plazo de inactividad de
      # 30 min (CaducidadSesion), y sin ella la sesión caería a la vez que el tope
      # del escaneo. Una señal tardía no revive una sesión ya caducada, así que no
      # tapa ninguna pérdida.
      - name: Escanear con ZAP autenticado
        shell: bash
        run: |
          sonda() {
            local cuerpo codigo api
            cuerpo=$(mktemp)
            curl -sS -o /dev/null --max-time 45 -x "$ZAP_API" -X POST \
              -H 'Sec-Fetch-Site: same-origin' "$ZAP_BASE/sesion/actividad" || true
            codigo=$(curl -sS -o "$cuerpo" -w '%{http_code}' --max-time 45 -x "$ZAP_API" "$ZAP_BASE$ZAP_SONDA" || true)
            if [ "$codigo" = 200 ] && ! jq -e 'type == "array"' "$cuerpo" > /dev/null 2>&1; then
              codigo=no-es-lista
            fi
            api=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 45 -x "$ZAP_API" "$ZAP_BASE/api/v1/clientes" || true)
            rm -f "$cuerpo"
            echo "$(date -u +%H:%M:%S) sesion=$codigo api=$api" >> zap/sesion-zap.txt
            case "$codigo:$api" in
              200:200) echo 200 ;;
              200:000|000:200|000:000) echo 000 ;;
              *) echo "$codigo:$api" ;;
            esac
          }

          # Solo informa: las reglas OAST saldrían a un servidor externo si hubiera uno.
          echo "Servicio OAST del escaneo activo: $(curl -sS "$ZAP_API/JSON/oast/view/getActiveScanService/" || echo desconocido)"

          respuesta=$(curl -fsS "$ZAP_API/JSON/automation/action/runPlan/" \
            --data-urlencode "filePath=/zap/wrk/plan-autenticado.yaml")
          plan=$(jq -r '.planId // empty' <<< "$respuesta")
          if [ -z "$plan" ]; then
            echo "::error::ZAP no aceptó el plan."
            exit 1
          fi
          echo "Plan de ZAP en marcha: $plan"
          perdida=0
          while :; do
            sleep 30
            codigo=$(sonda)
            case "$codigo" in 200|000) ;; *) perdida=$((perdida + 1)) ;; esac
            progreso=$(curl -fsS "$ZAP_API/JSON/automation/view/planProgress/" \
              --data-urlencode "planId=$plan" -G || echo '{}')
            if [ -n "$(jq -r '.finished // empty' <<< "$progreso")" ]; then
              break
            fi
          done

          jq -r '(.info // [])[], (.warn // [])[], (.error // [])[]' <<< "$progreso"
          # Único error admitido: el aviso del documento OpenAPI (ver el plan).
          errores=$(jq '[(.error // [])[] | select(test("Declared path parameter") | not)] | length' <<< "$progreso")

          # La prueba final no admite 000: tiene que ser un 200 con ZAP ya libre.
          final=$(sonda)
          muestras=$(wc -l < zap/sesion-zap.txt)
          sin_datos=$(grep -c '=000' zap/sesion-zap.txt || true)
          duracion=$(jq -r '"\(.started) -> \(.finished)"' <<< "$progreso")
          curl -fsS "$ZAP_API/JSON/stats/view/siteStats/" --data-urlencode "site=$ZAP_BASE" -G \
            > zap/estadisticas-zap.json || echo '{}' > zap/estadisticas-zap.json
          recuento() {
            jq --arg codigos "$1" \
              '[.. | objects | to_entries[] | select(.key | test("code\\.(" + $codigos + ")$")) | .value | tonumber] | add // 0' \
              zap/estadisticas-zap.json
          }
          peticiones=$(recuento '[0-9]+')
          exitos=$(recuento '2[0-9][0-9]')
          rechazos=$(recuento '401')

          {
            echo "### ZAP autenticado"
            echo ""
            echo "- Plan: $duracion"
            echo "- Sondas de sesión por ZAP: $muestras (perdidas $perdida, sin respuesta $sin_datos, final $final)"
            echo "- Peticiones de ZAP con respuesta: $peticiones (2xx $exitos, 401 $rechazos)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Sondas: $muestras, perdidas: $perdida, sin respuesta: $sin_datos, final: $final. Peticiones: $peticiones, 2xx: $exitos, 401: $rechazos. Errores del plan: $errores."

          if [ "$errores" -gt 0 ]; then
            echo "::error::El plan de ZAP terminó con errores."
            exit 1
          fi
          if [ "$perdida" -gt 0 ] || [ "$final" != 200 ]; then
            echo "::error::ZAP perdió la sesión durante el escaneo: el resultado no vale."
            exit 1
          fi
          # Sin este mínimo, un plan que no llegara a atacar pasaría por escaneo limpio.
          if [ "$peticiones" -lt 1000 ]; then
            echo "::error::ZAP solo hizo $peticiones peticiones: el escaneo no ha ocurrido."
            exit 1
          fi
          # El mínimo anterior también lo cumpliría un escaneo rechazado entero. Medido
          # con la sesión viva: 41 % de 2xx y 0,1 % de 401. Sirve de red para la clave de
          # API y para un escaneo rechazado; la cookie perdida la detecta la sonda, porque
          # las páginas anónimas también dan 200.
          if [ $((exitos * 10)) -lt "$peticiones" ] || [ $((rechazos * 10)) -gt "$peticiones" ]; then
            echo "::error::Solo $exitos de $peticiones peticiones dieron 2xx y $rechazos dieron 401: el escaneo fue rechazado."
            exit 1
          fi

      - name: Comprobar el correo tras el escaneo
        run: |
          paquetes=$(sudo iptables -L OUTPUT -v -n -x | awk '/zap-correo/ { print $1 }')
          echo "Paquetes hacia puertos de correo durante el job: ${paquetes:-sin regla}"
          if [ "$paquetes" != 0 ]; then
            echo "::error::Algo intentó salir por un puerto de correo."
            exit 1
          fi

      # Solo recuentos: el repositorio es público y el resumen del run también.
      - name: Evaluar hallazgos
        run: |
          informe=zap/informe-zap-autenticado.json
          if [ ! -s "$informe" ]; then
            echo "::error::ZAP no generó el informe."
            exit 1
          fi
          contar() {
            jq --arg riesgo "$1" \
              '[.site[]?.alerts[]? | select(.riskcode == $riesgo and .confidence != "0")] | length' "$informe"
          }
          altos=$(contar 3)
          {
            echo "- Hallazgos: altos $altos, medios $(contar 2), bajos $(contar 1), informativos $(contar 0)"
            echo "- El detalle está en el artefacto informe-zap-autenticado."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$altos" -gt 0 ]; then
            echo "::error::ZAP ha encontrado $altos hallazgos de riesgo alto: ver el informe."
            exit 1
          fi

      # Al artefacto y no al log del run, a diferencia del baseline: tras un
      # escaneo activo este log trae las trazas que provocan sus ataques.
      - name: Guardar los logs si falla
        if: failure()
        run: |
          cp "$RUNNER_TEMP/app.log" zap/app.log || true
          docker logs --tail 200 zap > zap/zap.log 2>&1 || true

      - name: Publicar informe de ZAP
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informe-zap-autenticado
          path: |
            zap/informe-zap-autenticado.*
            zap/sesion-zap.txt
            zap/estadisticas-zap.json
            zap/app.log
            zap/zap.log
          retention-days: 90
          if-no-files-found: ignore
